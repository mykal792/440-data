  --display:'Rotundo', ui-sans-serif, system-ui, sans-serif;
  --body:'Laro Soft', ui-sans-serif, system-ui, sans-serif;
  /* Laro is right for labels and figures; full sentences read
     cleaner in Wix Madefor Text. */
  --copy:'Wix Madefor Text', ui-sans-serif, system-ui, sans-serif;

  --w:902px;
  --margin:47.9px;
  --pad-bottom:46.6px;
  --row-h:61.3px;
  --face-pad:70.3px;
  --row-gap:19.2px;
  --cut-gap:42.1px;

  --card-radius:clamp(18px, 5.677vw, 51.15px);
  --row-radius:clamp(8px, 1.171vw, 10.55px);

  --nm-size:clamp(20px, 6.015vw, 54.2px);
  --yr-size:clamp(14px, 4.451vw, 40.1px);
  --arch-size:clamp(9px, 1.443vw, 13px);
}

*{ box-sizing:border-box; }
html,body{ margin:0; background:transparent; }
body{
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center;
}
.stack{ width:var(--w); max-width:100%; display:flex; flex-direction:column; gap:14px; }

.card{
  position:relative;
  background:var(--ink); color:var(--white);
  border-radius:var(--card-radius);
}
.card.standings{ padding:36.1px 0 var(--pad-bottom); }
.card.climb{ padding:26px 0 28px; }

/* ── Standings title ────────────────────────────────────── */
.head{
  position:relative;
  padding-left:17.58%;
  padding-right:clamp(92px, 14.4%, 130px);
  display:flex; align-items:baseline; gap:1.4%;
  white-space:nowrap;
}
h2{ margin:0; font-family:var(--display); font-weight:400; line-height:1; }
.yr{ font-size:var(--yr-size); color:var(--mint); line-height:1; position:relative; top:-0.05px; }
.nm{ font-size:var(--nm-size); line-height:1; }

.demo{
  /* Anchored to the card, sitting in the same strip as the week label
     so it can't crowd the Archive button. */
  position:absolute; right:var(--margin);
  bottom:calc(var(--pad-bottom) / 2); transform:translateY(50%);
  border:1.5px solid var(--warn); border-radius:999px;
  padding:.4em .8em; color:var(--warn);
  font-family:var(--display); font-size:11px; line-height:1;
  text-transform:uppercase; letter-spacing:.08em;
}
.demo[hidden]{ display:none; }
.archive{
  position:absolute; right:var(--margin); top:50%; transform:translateY(-50%);
  display:inline-flex; align-items:center; gap:.55em;
  border:.15em solid rgba(255,255,255,.28); border-radius:999px;
  padding:.62em 1.25em; color:var(--white); text-decoration:none;
  font-family:var(--display); font-size:var(--arch-size); line-height:1;
  text-transform:uppercase; white-space:nowrap;
}
.archive:hover{ border-color:var(--mint); color:var(--mint); }
.archive svg{ width:1.1em; height:1.1em; fill:none; stroke:currentColor; stroke-width:2; }

/* ── Dashed rule ────────────────────────────────────────── */
.dashed-wrap{ height:4.06px; margin:23.65px var(--margin) 0; overflow:hidden; }
.card.climb .dashed-wrap{ margin-top:16px; }
.dashed{ display:block; width:100%; height:100%; }
.dashed line{
  stroke:var(--dot); stroke-linecap:round;
  stroke-width:clamp(2px, .451vw, 4.06px);
  stroke-dasharray:clamp(4px, .901vw, 8.12px) clamp(10px, 2.254vw, 20.3px);
}

/* ── Standings columns ──────────────────────────────────── */
.labels, .front{
  display:grid;
  grid-template-columns:70.3px minmax(0,1fr) 186.02px 204.68px 128.8px;
  align-items:center;
}
.wrap-in{ padding:0 var(--margin); }

.labels{ margin-top:26.35px; margin-bottom:12.34px; }
.labels span{
  font-family:var(--display); font-size:15px; line-height:1;
  text-transform:uppercase; color:var(--white); text-align:center;
  cursor:pointer; user-select:none;
}
.labels .l-name{ text-align:left; }
.labels .l-rank{ padding-right:6.9px; cursor:default; }
.labels .l-rec, .labels .l-avg, .labels .l-bank{ padding-right:45.2px; }
.labels span:hover:not(.l-rank){ color:var(--mint); }
.labels span:focus-visible{ outline:2px solid var(--mint); outline-offset:4px; border-radius:3px; }
.labels span[aria-sort]{ color:var(--mint); }
.labels span[aria-sort]::after{ content:' ↓'; font-size:.78em; font-family:var(--body); }
.labels span[aria-sort="ascending"]::after{ content:' ↑'; font-size:.78em; font-family:var(--body); }

/* ── Standings rows ─────────────────────────────────────── */
.rows{ display:flex; flex-direction:column; gap:var(--row-gap); }
.rows.no-cut{ padding-bottom:calc(var(--cut-gap) - var(--row-gap)); }

.row{ height:var(--row-h); perspective:1400px; transition:opacity .25s ease; }
.row.faded{ opacity:.3; }
.flipper{
  position:relative; width:100%; height:100%;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.2,.7,.3,1);
}
.row.flipped .flipper{ transform:rotateX(180deg); }
.face{
  position:absolute; inset:0;
  background:var(--bar); border-radius:var(--row-radius);
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
}
.front{ align-items:center; }
.back{
  transform:rotateX(180deg);
  display:flex; align-items:center; gap:18px;
  padding:0 47.9px 0 var(--face-pad);
}
.back .bank{ margin-right:0; flex:none; }
.back .ledgerwrap{ flex:1; min-width:0; display:flex; }
.ledger{ display:flex; flex-direction:column; gap:5px; min-width:0; flex:1; overflow:hidden; }
.lrow{ display:flex; align-items:baseline; gap:9px; min-width:0; }
.ltag{
  font-family:var(--display); font-size:10.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--mint); flex:none; width:96px;
  line-height:1; white-space:nowrap;
}
.ltag.hs{ color:var(--white); }
.lval{
  font-family:var(--body); font-size:14px; color:var(--white); line-height:1.15;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.lval.none{ color:var(--gray); }
.ws{ display:none; }
.broke{
  font-family:var(--copy); font-size:14px; color:var(--gray);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.row.cut{ margin-bottom:calc(var(--cut-gap) - var(--row-gap)); position:relative; }
.row.cut::after{
  content:''; position:absolute; left:-19.2px; right:-19.2px;
  top:calc(100% + (var(--cut-gap) / 2) - 1.015px);
  height:2.03px; background:var(--line-mint); border-radius:999px;
}

.rank{
  font-family:var(--display); font-size:19.1px; line-height:1;
  text-align:center; color:var(--gray); padding-right:6.9px;
}
.row.in .rank{ color:var(--mint); }
.who{
  display:flex; align-items:center; gap:11px; min-width:0;
  background:none; border:0; padding:0; color:inherit; cursor:pointer; text-align:left;
}
.who .ava{
  width:34px; height:34px; flex:none; border-radius:50%;
  background:center/cover no-repeat;
  box-shadow:0 0 0 2px var(--c);
  transition:filter .18s ease;
}
.name{
  font-family:var(--display); font-size:25px; line-height:1;
  text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.who:hover .name{ color:var(--mint); }
.who:focus-visible{ outline:2px solid var(--mint); outline-offset:3px; border-radius:6px; }
.rec, .avg{
  font-family:var(--body); font-size:24.3px; line-height:1;
  text-align:center; font-variant-numeric:tabular-nums; padding-right:45.2px;
}
.bank{
  justify-self:center; margin-right:45.2px;
  min-width:78.2px; height:32.4px; padding:0 12px;
  border-radius:999px; background:var(--chip); color:var(--gray);
  display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--display); font-size:21px; line-height:1;
  border:1.5px solid transparent; cursor:pointer; font-variant-numeric:tabular-nums;
  transition:background .18s ease, border-color .18s ease;
}
.bank .amt{ display:inline-block; }
.bank .cur{ font-style:normal; font-size:.82em; color:inherit; margin-right:.04em; }
.bank.paid{ color:var(--white); border-color:var(--mint); }
.bank.paid .cur{ color:var(--mint); }
.bank:hover{ background:#585757; }
.bank:focus-visible{ outline:2px solid var(--white); outline-offset:3px; }

.week{
  position:absolute; left:var(--margin); right:var(--margin); bottom:0;
  height:var(--pad-bottom);
  display:flex; align-items:center; min-width:0;
  font-size:13px; line-height:1; color:var(--gray);
}
.week .wlabel{
  font-family:var(--display); text-transform:uppercase; flex:none;
}
.week .wlabel b{ color:var(--white); font-weight:400; }
/* Short enough now to be a pill in caps rather than a sentence, which is
   what lets it drop the long/short label pair. Amber carries the rewound
   state on its own — the caption beside it already names the week. */
.week .rewound{
  flex:none; margin-left:11px; padding:5px 12px; cursor:pointer;
  background:none; border:1.5px solid rgba(232,193,90,.45); border-radius:999px;
  font-family:var(--display); font-size:11px; line-height:1; color:var(--warn);
  text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;
}
.week .rewound:hover{ border-color:var(--warn); color:var(--white); }
.week .rewound:focus-visible{ outline:2px solid var(--warn); outline-offset:2px; }
.msg{ padding:60px 0; text-align:center; color:var(--gray); font-family:var(--copy); font-size:16px; }

/* ── Climb eyebrow ──────────────────────────────────────── */
/* Small on purpose: the standings table right above already
   carries the page title, so this reads as the next chapter
   rather than a second front door. */
.eyebrow{
  display:flex; align-items:center; gap:16px;
  padding:8px var(--margin) 0;          /* room for the line's stroke */
}
.hdr{ display:block; height:30px; width:auto; flex:none; overflow:visible; }
.hdr #hdrTrack, .hdr #hdrOver{ transition:stroke .35s ease; }
.eyebrow .sub{
  font-family:var(--copy); font-size:12px; line-height:1; color:var(--gray);
  margin-left:auto; text-align:right; white-space:nowrap;
}

/* ── Chart ──────────────────────────────────────────────── */
.plot{
  position:relative;
  display:flex; margin-top:18px;
  background:var(--bar); border-radius:var(--row-radius); overflow:hidden;
}
.axis{ flex:none; width:44px; }
.axis svg{ display:block; }
.scroller{
  flex:1; min-width:0; overflow-x:auto; overflow-y:hidden;
  scrollbar-width:thin; scrollbar-color:#6a6a6a transparent;
  -webkit-overflow-scrolling:touch;
}
.scroller::-webkit-scrollbar{ height:6px; }
.scroller::-webkit-scrollbar-thumb{ background:#6a6a6a; border-radius:999px; }
.scroller::-webkit-scrollbar-track{ background:transparent; }
#chart{ display:block; }

.wklab{ font-family:var(--display); font-size:11px; fill:var(--gray); text-transform:uppercase; }
.wklab.on{ fill:var(--white); }
.wklab.ahead{ fill-opacity:.45; }
.rklab{ font-family:var(--display); font-size:16px; fill:var(--gray); }
.rklab.in{ fill:var(--mint); }
.grid{ stroke:#fff; stroke-opacity:.055; stroke-width:1; }
.vline{ stroke:#fff; stroke-opacity:.05; stroke-width:1; }
.nowline{ stroke:var(--white); stroke-opacity:.16; stroke-width:1.5; }
.cutline{ stroke:var(--line-mint); stroke-width:2; stroke-linecap:round; }
.cuttag{
  position:absolute; z-index:2; pointer-events:none;
  transform:translateY(-50%); padding:0 9px;
  background:var(--bar); color:var(--mint);
  font-family:var(--display); font-size:10px; line-height:1;
  text-transform:uppercase; letter-spacing:.07em;
}

.team .ln{ fill:none; stroke-width:3.6; stroke-linecap:round; stroke-linejoin:round; }
.team .nd{ stroke:var(--bar); stroke-width:2; }
.team .hd{ stroke:var(--bar); stroke-width:2.5; }
.team .ring{ fill:none; stroke-width:2.6; }
.team .halo{ fill:var(--bar); }
.team{ transition:opacity .25s ease; }
.team.dim{ opacity:.2; }
.team.dim .ln{ stroke:#8f9296 !important; }
.team.dim .nd,.team.dim .hd{ fill:#8f9296 !important; }
.team.dim .fc,.team.dim .ring{ display:none; }

/* ── Scrub row ──────────────────────────────────────────── */
.scrub{ display:flex; align-items:center; gap:14px; margin-top:16px; padding:0 4px; }
.play{
  flex:none; width:34px; height:34px; border-radius:50%;
  border:2px solid rgba(255,255,255,.28); background:transparent;
  color:var(--white); cursor:pointer; display:grid; place-items:center; padding:0;
}
.play:hover{ border-color:var(--mint); color:var(--mint); }
.play:focus-visible{ outline:2px solid var(--mint); outline-offset:3px; }
.play svg{ width:13px; height:13px; fill:currentColor; }

/* The slider is drawn by hand — rail, fill and football are real
   elements, and the native input sits on top at zero opacity purely
   for keyboard and pointer handling. That way no browser gets to
   draw its own thumb box around the ball. */
.track{ position:relative; flex:1; min-width:0; height:34px; --p:0; --ball-w:46px; }
.rail{
  position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
  height:9px; border-radius:999px; background:#66686b; overflow:hidden;
}
.rail i{ display:block; height:100%; border-radius:999px; background:var(--mint);
         width:calc(var(--ball-w) + (100% - var(--ball-w)) * var(--p)); }
.ball{
  position:absolute; top:50%; width:var(--ball-w); height:29px;
  left:calc(var(--ball-w)/2 + (100% - var(--ball-w)) * var(--p));
  transform:translate(-50%,-50%); pointer-events:none;
}
.ball svg{ display:block; width:100%; height:100%; overflow:visible; }
.track input{
  position:absolute; inset:0; z-index:3; width:100%; height:100%; margin:0;
  opacity:0; cursor:grab; -webkit-appearance:none; appearance:none; background:transparent;
}
.track input:active{ cursor:grabbing; }
.track.idle{ opacity:.4; }
.track.idle input{ cursor:default; }
.play.idle{ opacity:.4; cursor:default; border-color:rgba(255,255,255,.18); }
.play.idle:hover{ border-color:rgba(255,255,255,.18); color:var(--white); }
.track input::-webkit-slider-thumb{ -webkit-appearance:none; width:var(--ball-w); height:29px; }
.track input::-moz-range-thumb{ border:0; width:46px; height:29px; }
.track input:focus-visible ~ .rail{ outline:2px solid var(--mint); outline-offset:4px; border-radius:999px; }

.wkread{
  flex:none; font-family:var(--display); font-size:13px; line-height:1;
  text-transform:uppercase; color:var(--gray); white-space:nowrap;
}
.wkread b{ color:var(--white); font-weight:400; }

/* ── Name buttons ───────────────────────────────────────── */
.chips{
  display:grid; grid-template-columns:repeat(5, minmax(0,1fr));
  gap:6px; margin-top:16px;
}
.chipbtn{
  display:flex; align-items:center; gap:7px; min-width:0;
  padding:4px 8px 4px 4px; border-radius:999px;
  background:var(--chip); border:1.5px solid transparent;
  color:var(--gray); cursor:pointer;
  font-family:var(--display); font-size:13px; line-height:1;
  text-transform:uppercase; letter-spacing:.02em;
  transition:color .18s ease, border-color .18s ease, background .18s ease;
}
.chipbtn .ava{
  width:22px; height:22px; flex:none; border-radius:50%;
  background:center/cover no-repeat;
  box-shadow:0 0 0 1.5px var(--c);
  transition:box-shadow .18s ease, filter .18s ease;
}
.chipbtn .who2{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chipbtn:hover{ color:var(--white); }
.chipbtn.on{ color:var(--ink); background:var(--c); border-color:var(--c); }
.chipbtn.on .ava{ box-shadow:0 0 0 1.5px rgba(0,0,0,.35); }
.chipbtn:focus-visible{ outline:2px solid var(--mint); outline-offset:2px; }
.any .chipbtn:not(.on) .ava{ filter:grayscale(1); opacity:.5; }

.foot{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-top:14px;
  font-family:var(--copy); font-size:12px; line-height:1; color:var(--gray);
}
.foot .ws{ display:none; }
.foot .acts{ display:flex; gap:8px; flex:none; }
.foot .all[hidden]{ display:none; }
.foot .all{
  flex:none; background:none; cursor:pointer;
  border:1.5px solid rgba(255,255,255,.28); border-radius:999px;
  padding:5px 13px; color:var(--white);
  font-family:var(--display); font-size:11px; line-height:1;
  text-transform:uppercase; letter-spacing:.04em;
}
.foot .all:hover{ border-color:var(--mint); color:var(--mint); }
.foot .all:focus-visible{ outline:2px solid var(--mint); outline-offset:3px; }

@media (prefers-reduced-motion:reduce){ .team,.row,.flipper{ transition:none; } }

/* ── Narrow ─────────────────────────────────────────────── */
@media (max-width:920px){
  :root{ --margin:16px; --row-h:50px; --row-gap:10px; --cut-gap:24px; --pad-bottom:48px; }
  .stack{ gap:10px; }
  .card.standings{ padding:22px 0 var(--pad-bottom); }
  .card.climb{ padding:20px 0 20px; }
  .week{ font-size:11px; }
  .head{ padding-left:16px; padding-right:clamp(78px, 24%, 120px); gap:6px; }
  .dashed-wrap{ margin-top:12px; height:3px; }
  .card.climb .dashed-wrap{ margin-top:12px; }
  .labels{ margin-top:14px; margin-bottom:6px; }
  .labels span{ font-size:10px; }
  .labels .l-rank{ padding-right:3px; }
  .labels .l-rec, .labels .l-avg, .labels .l-bank{ padding-right:14px; }
  .labels, .front{ grid-template-columns:32px minmax(0,1fr) 76px 88px 92px; }
  .who{ gap:7px; }
  .who .ava{ width:26px; height:26px; box-shadow:0 0 0 1.5px var(--c); }
  .name{ font-size:15px; }
  .rec,.avg{ font-size:15px; padding-right:14px; }
  .bank{ font-size:14px; height:25px; min-width:58px; padding:0 9px; margin-right:14px; }
  .rank{ font-size:13px; padding-right:3px; }
  .back{ padding:0 14px 0 32px; gap:8px; }
  .ledger{ gap:3px; }
  .ltag{ width:auto; min-width:74px; font-size:9px; }
  .lval{ font-size:12px; }
  .broke{ font-size:13px; }
  .row.cut::after{ left:-8px; right:-8px; height:1.5px;
    top:calc(100% + (var(--cut-gap) / 2) - .75px); }
  .plot{ margin-top:14px; }
  .hdr{ height:26px; }
  .axis{ width:32px; }
  .scrub{ gap:10px; margin-top:12px; }
  .play{ width:31px; height:31px; }
  .wkread{ font-size:11px; }
  .chips{ gap:5px; margin-top:12px; }
  .chipbtn{ font-size:11px; padding:3px 7px 3px 3px; gap:5px; }
  .chipbtn .ava{ width:19px; height:19px; }
  .foot{ font-size:10.5px; margin-top:11px; }
  .foot .all{ font-size:10px; padding:4px 10px; }
  .foot .acts{ gap:6px; }
}
@media (max-width:560px){
  body{ padding:2px; }
  :root{ --margin:14px; --row-h:36px; --row-gap:6px; --cut-gap:14px; --pad-bottom:32px; }
  .card.standings{ padding:14px 0 var(--pad-bottom); }
  .card.climb{ padding:16px 0 16px; }
  .head{ padding-left:14px; padding-right:46px; gap:5px; margin-bottom:14px; }
  .yr{ font-size:17px; }
  .nm{ font-size:24px; }
  .archive{
    right:14px; width:30px; height:30px; padding:0;
    border-radius:50%; justify-content:center; gap:0; border-width:1.5px;
  }
  .arch-label{ display:none; }
  .archive svg{ width:14px; height:14px; }
  .dashed-wrap{ margin:8px var(--margin) 0; height:3px; }
  .labels{ margin-top:9px; margin-bottom:4px; padding:0 10px; }
  .labels span{ font-size:9px; }
  .labels .l-rank, .labels .l-rec, .labels .l-avg, .labels .l-bank{ padding-right:0; }
  .labels .l-avg, .front .avg{ display:none; }
  .labels, .front{ grid-template-columns:18px 82px minmax(0,1fr) 56px; gap:6px; }
  .front{ padding:0 10px; }
  .rank{ font-size:12px; padding-right:0; text-align:center; }
  .week .rewound{ font-size:9px; padding:4px 9px; margin-left:8px; }
  .who .ava{ display:none; }
  .name{ font-size:12px; }
  .rec{ font-size:12.5px; padding-right:0; text-align:center; }
  .bank{ font-size:13px; height:24px; min-width:54px; padding:0 8px; margin-right:0; justify-self:stretch; }
  .back{ padding:0 10px; gap:8px; }
  .ltag{ min-width:58px; font-size:8px; letter-spacing:.04em; }
  .lval{ font-size:10.5px; }
  .broke{ font-size:10px; }
  .wl{ display:none; }
  .ws{ display:inline; }
  .foot .ws{ display:inline; }
  .row.cut::after{ left:-6px; right:-6px; height:1.5px;
    top:calc(100% + (var(--cut-gap) / 2) - .75px); }
  .week{ font-size:10px; }
  .demo{ font-size:9px; padding:.35em .7em; }
  .hdr{ height:22px; }
  .eyebrow{ padding-top:6px; }
  .eyebrow .sub{ display:none; }
  .axis{ width:26px; }
  .rklab{ font-size:13px; }
  .cuttag{ font-size:8.5px; padding:0 7px; letter-spacing:.05em; }
  .chips{ grid-template-columns:repeat(2, minmax(0,1fr)); gap:5px; }
  .chipbtn{ font-size:11px; padding:4px 8px 4px 4px; }
  .chipbtn .ava{ width:20px; height:20px; }
  .track{ --ball-w:40px; }
  .ball{ height:25px; }
}
</style>
</head>
<body>

const PALETTE = ['#FF8A2A','#22D3EE','#FFC200','#0E97C1','#8AEBC1',
                 '#E094FF','#3CAF94','#FF4858','#D0ECF2','#93A8C9'];

/* Draft order is the page's own record, not the feed's. Two things hang
   off it: the colour a manager's line gets, and where everyone sits in
   the preseason column. Both used to ride on the order `managers` happened
   to arrive in, which was fine while the JSON was written by hand and is
   not fine now that a scheduled job writes it. Pinned here, the feed can
   list managers in any order and nothing on the page moves. */
const DRAFT_ORDER = ['greg','graham','anthony','scotty','gangus',
                     'hayden','garrett','coyne','scarpitti','schilling'];

/* ── Geometry ───────────────────────────────────────────── */
const TOP = 30, BOT = 14;
let ROW = 50, COL = 96;

const state = { data:null, live:null, idx:0, cur:0, target:0, playing:false,
                sel:new Set(), open:new Set(), sort:{ key:'rank', dir:'asc' } };
let els = null, raf = null, timer = null;
let TL = [], BY_WEEK = new Map(), LAST = 0;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money    = n => '$' + n.toLocaleString('en-US');
const moneyTag = n => `<span class="amt"><i class="cur">$</i>${n.toLocaleString('en-US')}</span>`;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const xOf = i => COL * 0.55 + i * COL;
const yOf = r => TOP + (r - 0.5) * ROW;
const visibleWeeks = () => innerWidth <= 560 ? VISIBLE.narrow
                         : innerWidth <= 920 ? VISIBLE.mid : VISIBLE.wide;

/* Preseason, the regular season, then Final — the full shape of the
   year, whether or not it has been played yet. */
function timeline(D){
  const n = D.league.regular_weeks || 15;
  const out = [{ w:0, label:'Preseason', short:'Pre' }];
  for (let w = 1; w <= n; w++) out.push({ w, label:`Week ${w}`, short:`Wk ${w}` });
  out.push({ w:n + 1, label:'Final', short:'Final' });
  D.weeks.forEach(k => {
    const slot = out.find(t => t.w === k.week);
    if (slot && k.label){ slot.label = k.label; slot.short = k.short || k.label; }
  });
  return out;
}

const weekAt = i => BY_WEEK.get(TL[i].w);
const bonusesTo = (i, key) =>
  (state.data.bonuses[key] || []).filter(b => b.week == null ? i >= LAST : b.week <= TL[i].w);
const bankTo = (i, key) => bonusesTo(i, key).reduce((s, b) => s + b.amount, 0);
const recOf = t => t.ties ? `${t.wins}-${t.losses}-${t.ties}` : `${t.wins}-${t.losses}`;

/* Rank of every manager at every column that has data. */
function series(){
  const out = {};
  state.data.managers.forEach(m => out[m.key] = []);
  TL.forEach((slot, i) => {
    const wk = BY_WEEK.get(slot.w);
    if (wk) wk.teams.forEach(t => { if (out[t.key]) out[t.key].push({ i, rank:t.rank }); });
  });
  return out;
}

/* ── Bump path ──────────────────────────────────────────── */
/* Classic bump curve: cubic with the control points pushed
   horizontally, so a rank change reads as a swap rather than a
   diagonal. Drawing stops at `cur`, splitting the live segment with
   De Casteljau so the line grows smoothly mid-week. */
const lerp = (p, q, t) => ({ x:p.x + (q.x - p.x) * t, y:p.y + (q.y - p.y) * t });

function cubicAt(p0, p1, t){
  const k = COL * 0.42;
  const c1 = { x:p0.x + k, y:p0.y }, c2 = { x:p1.x - k, y:p1.y };
  const a = lerp(p0, c1, t), b = lerp(c1, c2, t), c = lerp(c2, p1, t);
  const d = lerp(a, b, t), e = lerp(b, c, t);
  return { c1:a, c2:d, end:lerp(d, e, t) };
}

function buildPath(pts, cur){
  if (!pts.length) return { d:'', head:null };
  const first = { x:xOf(pts[0].i), y:yOf(pts[0].rank) };
  if (cur <= pts[0].i) return { d:'', head:first };

  let d = `M${first.x.toFixed(1)},${first.y.toFixed(1)}`;
  let head = first;
  const k = COL * 0.42;

  for (let n = 1; n < pts.length; n++){
    const p0 = { x:xOf(pts[n-1].i), y:yOf(pts[n-1].rank) };
    const p1 = { x:xOf(pts[n].i),   y:yOf(pts[n].rank) };
    if (cur >= pts[n].i){
      d += `C${(p0.x+k).toFixed(1)},${p0.y.toFixed(1)} ${(p1.x-k).toFixed(1)},${p1.y.toFixed(1)} ${p1.x.toFixed(1)},${p1.y.toFixed(1)}`;
      head = p1;
    } else {
      const t = (cur - pts[n-1].i) / (pts[n].i - pts[n-1].i);
      const s = cubicAt(p0, p1, Math.max(0, Math.min(1, t)));
      d += `C${s.c1.x.toFixed(1)},${s.c1.y.toFixed(1)} ${s.c2.x.toFixed(1)},${s.c2.y.toFixed(1)} ${s.end.x.toFixed(1)},${s.end.y.toFixed(1)}`;
      head = s.end;
      break;
    }
  }
  return { d, head };
}

/* ── Standings table ────────────────────────────────────── */
const COLS = [
  { key:null,           label:'',             cls:'l-rank' },
  { key:'name',         label:'Team',         cls:'l-name' },
  { key:'wins',         label:'Record',       cls:'l-rec'  },
  { key:'avg_per_week', label:'Avg per week', cls:'l-avg'  },
  { key:'bank',         label:'Bank',         cls:'l-bank' },
];

function ledgerLines(i, key){
  const list = bonusesTo(i, key);
  if (!list.length)
    return `<div class="ledger"><p class="broke">Sorry, you are bonus cash poor.</p></div>`;
  /* Two forms per entry — the narrow layout can't fit
     "Wk 7 · Wk 8 · Squid Game Champion", so CSS swaps to the short
     one below 560px. */
  const tag = b => b.week
    ? `<span class="wl">Wk&nbsp;${b.week}</span><span class="ws">W${b.week}</span>`
    : `<span class="wl">${esc(b.label)}</span><span class="ws">${esc(b.short || b.label)}</span>`;
  const bonus = list.filter(b => b.type === 'category').map(tag);
  const hs = list.filter(b => b.type === 'high' || b.type === 'award').map(tag);
  return `<div class="ledger">
      <div class="lrow"><span class="ltag">Bonus wins</span>
        <span class="lval${bonus.length ? '' : ' none'}">${bonus.join(' · ') || 'None yet'}</span></div>
      <div class="lrow"><span class="ltag hs">High scores</span>
        <span class="lval${hs.length ? '' : ' none'}">${hs.join(' · ') || 'None yet'}</span></div>
    </div>`;
}

/* The rows are built once and then only updated. Rebuilding the table's
   markup on every week change meant re-parsing ten avatar data URIs
   mid-animation, which is what made scrubbing stutter. Reordering is
   done with the flex `order` property, so nothing is destroyed. */
let TBL = null;

function buildTable(){
  const D = state.data;

  const labels = COLS.map(c => {
    if (!c.key) return `<span class="${c.cls}"></span>`;
    return `<span class="${c.cls}" tabindex="0" role="button" data-key="${c.key}">${c.label}</span>`;
  }).join('');

  const rows = D.managers.map(m => `
    <div class="row" data-k="${m.key}" style="--c:${m.color}">
      <div class="flipper">
        <div class="face front">
          <span class="rank"></span>
          <button class="who" data-trace="${m.key}" title="Trace ${esc(m.name)} on the power lines">
            <span class="ava" style="background-image:url(&quot;${FACES[m.key]}&quot;)"></span>
            <span class="name">${esc(m.name)}</span>
          </button>
          <span class="rec"></span>
          <span class="avg"></span>
          <button class="bank" data-k="${m.key}" aria-expanded="false"></button>
        </div>
        <div class="face back">
          <div class="ledgerwrap"></div>
          <button class="bank" data-k="${m.key}" aria-label="Close breakdown"></button>
        </div>
      </div>
    </div>`).join('');

  document.getElementById('table').innerHTML =
    `<div class="labels">${labels}</div><div class="rows">${rows}</div>`;

  TBL = { wrap:document.querySelector('.rows'), labels:{}, rows:{} };
  document.querySelectorAll('.labels span[data-key]').forEach(el => {
    TBL.labels[el.dataset.key] = el;
    const go = () => {
      const key = el.dataset.key;
      const desc = ['wins','avg_per_week','bank'];
      const first = desc.includes(key) ? 'desc' : 'asc';
      /* Third click on the same column returns to standings order, so
         the playoff divider is always one click away. */
      if (state.sort.key !== key)        state.sort = { key, dir:first };
      else if (state.sort.dir === first) state.sort = { key, dir:first === 'asc' ? 'desc' : 'asc' };
      else                               state.sort = { key:'rank', dir:'asc' };
      updateTable();
    };
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); }
    });
  });

  D.managers.forEach(m => {
    const el = document.querySelector(`.row[data-k="${CSS.escape(m.key)}"]`);
    TBL.rows[m.key] = {
      el, name:m.name,
      rank:el.querySelector('.rank'),
      rec:el.querySelector('.rec'),
      avg:el.querySelector('.avg'),
      banks:[...el.querySelectorAll('.bank')],
      ledger:el.querySelector('.ledgerwrap'),
    };
    el.querySelector('.who').addEventListener('click', () => toggleTrace(m.key));
    TBL.rows[m.key].banks.forEach(btn => btn.addEventListener('click', () => {
      state.open.has(m.key) ? state.open.delete(m.key) : state.open.add(m.key);
      el.classList.toggle('flipped');
      el.querySelectorAll('.front .bank')
        .forEach(b => b.setAttribute('aria-expanded', state.open.has(m.key)));
    }));
  });
}

function updateTable(){
  if (!TBL) return;
  const D = state.data, i = state.idx;
  const byKey = Object.fromEntries(D.managers.map(m => [m.key, m]));
  const list = weekAt(i).teams.map(t => ({ ...t, name:byKey[t.key].name, bank:bankTo(i, t.key) }));

  const ranked = state.sort.key === 'rank' && state.sort.dir === 'asc';
  const order = [...list].sort((a, b) => {
    const av = a[state.sort.key], bv = b[state.sort.key];
    const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
    return state.sort.dir === 'asc' ? cmp : -cmp;
  });

  Object.entries(TBL.labels).forEach(([k, el]) => {
    if (state.sort.key === k) el.setAttribute('aria-sort', state.sort.dir === 'asc' ? 'ascending' : 'descending');
    else el.removeAttribute('aria-sort');
  });
  TBL.wrap.classList.toggle('no-cut', !ranked);

  const any = state.sel.size > 0;
  order.forEach((t, pos) => {
    const r = TBL.rows[t.key];
    r.el.style.order = pos;
    r.rank.textContent = t.rank;
    r.rec.textContent = recOf(t);
    r.avg.textContent = t.avg_per_week.toFixed(2);
    r.ledger.innerHTML = ledgerLines(i, t.key);
    r.banks.forEach(b => {
      b.innerHTML = moneyTag(t.bank);
      b.classList.toggle('paid', t.bank > 0);
    });
    r.banks[0].setAttribute('aria-label', `${r.name} bank ${money(t.bank)} — show breakdown`);
    /* The mint rank belongs to the team, so it survives any sort. The
       divider describes a position in the table, so it only appears in
       rank order. */
    r.el.classList.toggle('in', t.rank <= PLAYOFF_LINE);
    r.el.classList.toggle('cut', ranked && t.rank === PLAYOFF_LINE);
    r.el.classList.toggle('faded', any && !state.sel.has(t.key));
  });

  const slot = TL[i];
  const caption = slot.w === 0
    ? (LAST === 0 ? 'Preseason — nobody has played yet' : 'Preseason order')
    : `${slot.label} standings`;
  document.getElementById('week').innerHTML =
    `<span class="wlabel">${caption}</span>` + (i < LAST
      ? `<button class="rewound" id="catchup">Catch up</button>`
      : '');
  const catchup = document.getElementById('catchup');
  if (catchup) catchup.addEventListener('click', () => goTo(LAST));
  syncActions();
}

const debounce = (fn, ms) => { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; };

/* Everything whose position depends on the column width. Runs on
   first paint and on resize. */
function paintStatic(){
  const { chart, axis, scroller, S, teams } = els;
  COL = Math.max(56, scroller.clientWidth / visibleWeeks());
  ROW = innerWidth <= 560 ? 36 : innerWidth <= 920 ? 44 : 50;

  const H = TOP + 10 * ROW + BOT, W = COL * TL.length;
  const FACE = Math.min(ROW * 0.62, COL * 0.38);
  const cutY = TOP + PLAYOFF_LINE * ROW;

  /* Left rank gutter — fixed, so the numbers stay put while the
     weeks scroll underneath. */
  axis.setAttribute('viewBox', `0 0 44 ${H}`);
  axis.setAttribute('width', 44); axis.setAttribute('height', H);
  axis.innerHTML = Array.from({length:10}, (_, i) =>
    `<text class="rklab${i + 1 <= PLAYOFF_LINE ? ' in' : ''}" x="30" y="${yOf(i+1) + 5.5}" text-anchor="end">${i+1}</text>`
  ).join('');

  chart.setAttribute('viewBox', `0 0 ${W} ${H}`);
  chart.setAttribute('width', W); chart.setAttribute('height', H);

  const grid = Array.from({length:10}, (_, i) =>
    `<line class="grid" x1="0" y1="${yOf(i+1)}" x2="${W}" y2="${yOf(i+1)}"/>`).join('');
  const vlines = TL.map((_, i) =>
    `<line class="vline" x1="${xOf(i)}" y1="${TOP-8}" x2="${xOf(i)}" y2="${H-BOT+4}"/>`).join('');
  const labs = TL.map((slot, i) =>
    `<text class="wklab${BY_WEEK.has(slot.w) ? '' : ' ahead'}" data-i="${i}" x="${xOf(i)}" y="14" text-anchor="middle">${slot.short}</text>`).join('');
  const cut = `<line class="cutline" x1="0" y1="${cutY}" x2="${W}" y2="${cutY}"/>`;

  /* The avatar is the marker: it rides the end of each line inside a
     ring in that team's colour, so the chart and the table agree
     without needing a lookup. Each face is its own little SVG
     document, which keeps the artwork's blend modes intact. */
  const lines = teams.map(m => {
    const nodes = S[m.key].map(p =>
      `<circle class="nd" data-i="${p.i}" cx="${xOf(p.i)}" cy="${yOf(p.rank)}" r="3.8" fill="${m.color}" opacity="0"/>`).join('');
    return `<g class="team" data-k="${m.key}">
        <title>${esc(m.name)}</title>
        <path class="ln" stroke="${m.color}" d=""/>
        ${nodes}
        <g class="head" opacity="0">
          <circle class="hd" r="5" fill="${m.color}"/>
          <g class="mug">
            <circle class="halo" r="${(FACE/2 + 2.4).toFixed(1)}"/>
            <image class="fc" href="${FACES[m.key]}" width="${FACE.toFixed(1)}" height="${FACE.toFixed(1)}"/>
            <circle class="ring" r="${(FACE/2).toFixed(1)}" stroke="${m.color}"/>
          </g>
        </g>
      </g>`;
  }).join('');

  chart.innerHTML =
    `<g class="bg">${grid}${vlines}${cut}</g>` +
    `<line class="nowline" id="now" x1="0" y1="${TOP-8}" x2="0" y2="${H-BOT+4}"/>` +
    `<g class="labs">${labs}</g><g class="lines">${lines}</g>`;

  const tag = document.getElementById('cuttag');
  tag.style.top  = cutY + 'px';
  tag.style.left = '0px';

  els.FACE = FACE;
  frame(state.cur, true);
  if (state.sel.size) syncSel();
}

/* ── Per-frame update ───────────────────────────────────── */
function frame(cur, snap){
  const { chart, scroller, S, teams, FACE } = els;
  const i = Math.round(cur);

  chart.querySelectorAll('.wklab').forEach(t => t.classList.toggle('on', +t.dataset.i === i));
  const now = chart.querySelector('#now');
  now.setAttribute('x1', xOf(cur)); now.setAttribute('x2', xOf(cur));

  const heads = [];
  teams.forEach(m => {
    const g = chart.querySelector(`.team[data-k="${m.key}"]`);
    const { d, head } = buildPath(S[m.key], cur);
    g.querySelector('.ln').setAttribute('d', d);
    g.querySelectorAll('.nd').forEach(c =>
      c.setAttribute('opacity', +c.dataset.i <= cur + 0.001 ? 1 : 0));

    const hg = g.querySelector('.head');
    if (!head){ hg.setAttribute('opacity', 0); return; }
    hg.setAttribute('opacity', 1);
    const img = hg.querySelector('.fc'), ring = hg.querySelector('.ring');
    hg.querySelector('.hd').setAttribute('cx', head.x);
    hg.querySelector('.hd').setAttribute('cy', head.y);
    img.setAttribute('x', head.x - FACE / 2); img.setAttribute('y', head.y - FACE / 2);
    ring.setAttribute('cx', head.x); ring.setAttribute('cy', head.y);
    hg.querySelector('.halo').setAttribute('cx', head.x);
    hg.querySelector('.halo').setAttribute('cy', head.y);
    heads.push({ g, y:head.y, sel:state.sel.has(m.key) ? 1 : 0 });
  });

  /* Whoever sits lowest is drawn last, so a portrait climbing the board
     passes in front of the one it overtakes rather than behind it. A
     traced team always wins, so highlighting still lifts it clear. */
  const lines = chart.querySelector('.lines');
  heads.sort((a, b) => (a.sel - b.sel) || (a.y - b.y)).forEach(h => lines.appendChild(h.g));

  /* Keep the live column roughly three-quarters across the window. */
  const want = Math.max(0, Math.min(chart.width.baseVal.value - scroller.clientWidth,
                                    xOf(cur) - scroller.clientWidth * 0.74));
  if (snap) scroller.scrollLeft = want;
  else scroller.scrollLeft += (want - scroller.scrollLeft) * 0.35;

  els.track.style.setProperty('--p', LAST > 0 ? i / LAST : 0);
  els.wkread.textContent = TL[i].label;
  els.range.setAttribute('aria-valuetext', TL[i].label);

}

function goTo(i, snap){
  state.target = i;
  els.range.value = i;
  if (i !== state.idx){ state.idx = i; updateTable(); }
  syncActions();
  if (snap || reduced()){ state.cur = i; frame(i, true); return; }
  if (raf) return;
  /* An exponential chase rather than a fixed tween, so dragging the
     football fast keeps heading for the latest target instead of
     queueing. Scaled by real elapsed time so 120Hz screens don't run it
     at double speed. */
  let last = performance.now();
  const step = now => {
    const dt = Math.min(64, now - last); last = now;
    const gap = state.target - state.cur;
    if (Math.abs(gap) < 0.004){ state.cur = state.target; frame(state.cur); raf = null; return; }
    state.cur += gap * (1 - Math.pow(0.86, dt / 16.667));
    frame(state.cur);
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function togglePlay(){
  state.playing = !state.playing;
  els.play.innerHTML = state.playing
    ? `<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>`
    : `<svg viewBox="0 0 12 12"><path d="M2 1l8 5-8 5z"/></svg>`;
  els.play.setAttribute('aria-label', state.playing ? 'Pause' : 'Play the season');
  clearInterval(timer);
  if (!state.playing) return;
  if (state.target >= LAST) goTo(0, true);
  timer = setInterval(() => {
    if (state.target >= LAST){ togglePlay(); return; }
    goTo(state.target + 1);
  }, 850);
}

/* Both buttons are situational: they turn up only when there is
   something to undo, so the row stays quiet the rest of the time. */
function syncActions(){
  if (!els) return;
  els.now.hidden = state.idx >= LAST;
  els.clear.hidden = state.sel.size === 0;
}

function toggleTrace(key){
  state.sel.has(key) ? state.sel.delete(key) : state.sel.add(key);
  syncSel();
}

function syncSel(){
  const any = state.sel.size > 0;
  els.chips.classList.toggle('any', any);
  syncActions();
  els.chips.querySelectorAll('.chipbtn').forEach(c => {
    const on = state.sel.has(c.dataset.k);
    c.classList.toggle('on', on);
    c.setAttribute('aria-pressed', on);
  });
  els.chart.querySelectorAll('.team').forEach(g => {
    const on = state.sel.has(g.dataset.k);
    g.classList.toggle('dim', any && !on);
  });
  frame(state.cur, true);   // restack so traced lines sit on top
  document.querySelectorAll('.row[data-k]').forEach(r =>
    r.classList.toggle('faded', any && !state.sel.has(r.dataset.k)));
}

/* ── Load ───────────────────────────────────────────────── */
async function load(){
  try{
    const url = SOURCE + (SOURCE.includes('?') ? '&' : '?') + 't=' + Date.now();
    const res = await fetch(url, { cache:'no-store' });
    if (!res.ok) throw new Error(res.status);
    state.data = await res.json();
    state.live = true;
  }catch(err){
    if (!FALLBACK){
      document.getElementById('table').innerHTML =
        `<div class="msg">Standings are offline right now.</div>`;
      document.getElementById('mount').innerHTML = '';
      return;
    }
    state.data = FALLBACK;
    state.live = false;
  }
  /* Colours live with the page, not the feed, so a new season's JSON
     never has to carry them. */
  const draftPos = k => { const i = DRAFT_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  state.data.managers.sort((a, b) => draftPos(a.key) - draftPos(b.key));
  state.data.managers.forEach((m, i) => m.color = m.color || PALETTE[i % PALETTE.length]);

  /* Week 0 is the draft, not a standing. Yahoo has no preseason table to
     report, so whatever rank it writes there is filler — 1..10 in draft
     order is the only honest reading of a league where nobody has played. */
  const pre = (state.data.weeks || []).find(w => w.week === 0);
  if (pre && Array.isArray(pre.teams)){
    pre.teams.sort((a, b) => draftPos(a.key) - draftPos(b.key));
    pre.teams.forEach((t, i) => t.rank = i + 1);
  }

  /* The scoring job appends a snapshot on a schedule, which means a week
     can land in the feed before it has been played — Yahoo has no table to
     report yet, so every rank comes back 0. A week like that isn't a week:
     it would park the football on an empty column and stack all ten lines
     on the same y. Drop anything that isn't a complete 1..N ranking and
     let it reappear once the games are final. */
  state.data.weeks = (state.data.weeks || []).filter(w => {
    if (w.week === 0) return true;
    if (!Array.isArray(w.teams) || !w.teams.length) return false;
    return w.teams.every(t => Number(t.rank) > 0);
  });

  TL = timeline(state.data);
  BY_WEEK = new Map(state.data.weeks.map(w => [w.week, w]));
  LAST = TL.reduce((last, slot, i) => BY_WEEK.has(slot.w) ? i : last, 0);
  state.idx = state.cur = state.target = LAST;

  document.getElementById('yr').textContent = state.data.league.season;
  const badge = document.getElementById('demo');
  badge.hidden = !state.data.demo;
  if (!badge.hidden) document.getElementById('week').style.paddingRight = '82px';
  buildTable();
  updateTable();
  buildChart();
  animateHeader();
}

/* The ball runs the line, and each time it reaches an end it takes the
   next colour and repaints the line behind itself on the way back.
   Two stacked copies of the same path do the work: one holds the colour
   the line is leaving, the other the colour it's arriving at, and a dash
   of growing length reveals one over the other. */
function animateHeader(){
  const track = document.getElementById('hdrTrack');
  const over  = document.getElementById('hdrOver');
  const ball  = document.getElementById('hdrBall');
  if (!track || !over || !ball) return;

  const HUES = ['#22D3EE', '#FFC200', '#FF4858'];   // cyan, yellow, red
  const L = track.getTotalLength();
  const CROSS = 2800, HOLD = 380;
  const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;

  let hue = 0, dir = 1, start = null;

  const place = pos => {
    const pt = track.getPointAtLength(pos);
    ball.setAttribute('cx', pt.x); ball.setAttribute('cy', pt.y);
    over.style.strokeDasharray = `${pos} ${L + 1}`;
  };

  if (matchMedia('(prefers-reduced-motion: reduce)').matches){
    track.style.stroke = HUES[0];
    over.style.stroke = HUES[0];
    ball.style.fill = HUES[0];
    place(L);
    return;
  }

  function pass(ts){
    if (start === null) start = ts;
    const raw = (ts - start) / CROSS;
    const p = ease(Math.max(0, Math.min(1, raw)));
    const leaving = HUES[hue], arriving = HUES[(hue + 1) % HUES.length];

    /* Going right, the new colour trails the ball from the left; coming
       back, the old colour retreats from the left instead. */
    track.style.stroke = dir > 0 ? leaving : arriving;
    over.style.stroke  = dir > 0 ? arriving : leaving;
    ball.style.fill = arriving;
    place(dir > 0 ? p * L : (1 - p) * L);

    if (raw < 1 + HOLD / CROSS) return requestAnimationFrame(pass);
    hue = (hue + 1) % HUES.length;
    dir = -dir;
    start = null;
    requestAnimationFrame(pass);
  }

  ball.style.fill = HUES[1];
  requestAnimationFrame(pass);
}

load();

</script>
