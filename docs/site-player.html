<title>440 Radio</title>
<!--
  440 & Friends - 440 RADIO, the site-wide team song player.
  ONE Wix HTML embed in the site header, "Show on all pages":
    https://mykal792.github.io/440-data/site-player.html
  Desktop: ~300 x 40 -> a pill. Phone (any box under 120px wide, ~50 x 50)
  -> a round button. In the classic Wix Editor the header isn't reloaded on
  page changes, so the music keeps going from page to page.

  Radio: hit play and it shuffles through every team song in
  docs/songs/songs.json (each one once before any repeats), honouring each
  song's "start" / "fade". Pill: play/pause, next, close. Round button: tap =
  play/pause, press and hold = next song.
  Profiles: their TEAM SONG buttons ask this player to play that song over a
  BroadcastChannel ("440-song"): {type:"play"|"pause"|"stop"|"hello", ...};
  it answers {type:"state", who, playing, title} (the profile mirrors it -
  pause button, dancing avatar, title) or {type:"blocked"} if the browser
  won't start it (then the profile plays the song itself). After a profile's
  song ends the radio carries on if it was on, otherwise it stops.
-->

html,body{margin:0;background:transparent;overflow:hidden;height:100%}
button{border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit}
/* ---- pill (desktop) ---- */
#bar{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 8px 0 4px;
  background:#333;border-radius:999px;box-sizing:border-box;font-family:Rotundo,sans-serif;color:#fff}
#av{height:calc(100% - 8px);aspect-ratio:1;border-radius:50%;background:#e4e4e4 center/cover no-repeat;flex:none;display:grid;place-items:center}
#av.idle{background:#88e9bf}
#av.idle::after{content:"";width:34%;height:34%;background:#333;
  clip-path:polygon(20% 0,100% 50%,20% 100%)}
#win{flex:1;min-width:0;overflow:hidden;position:relative;height:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8px,#000 calc(100% - 8px),transparent);
          mask-image:linear-gradient(90deg,transparent,#000 8px,#000 calc(100% - 8px),transparent)}
#tick{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:13px;letter-spacing:.06em}
#tick span{padding-right:40px}
#tick.run{animation:tick var(--dur,12s) linear infinite}
#tick small{font-size:9px;color:#88e9bf;letter-spacing:.08em;margin-left:6px}
@keyframes tick{from{transform:translate(0,-50%)}to{transform:translate(-50%,-50%)}}
.ic{flex:none;width:26px;height:26px;display:grid;place-items:center}
#pp{background:#88e9bf;border-radius:50%}
.ic svg{width:12px;height:12px}
#nx svg{width:13px;height:13px}
#x svg{width:11px;height:11px}
#bar.idle #pp,#bar.idle #nx,#bar.idle #x{display:none}
#bar.idle{cursor:pointer}
/* ---- round button (phone) ---- */
#mini{display:none;position:absolute;inset:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body.compact #bar{display:none}
body.compact #mini{display:block}
#mini .face{position:absolute;inset:12%;border-radius:50%;background:#333 center/cover no-repeat}
#mini svg.ring{position:absolute;inset:0;width:100%;height:100%}
#mini.playing svg.ring{animation:spin 2.4s linear infinite}
#mini.skip svg.ring circle{stroke:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
#mini .over{position:absolute;inset:12%;border-radius:50%;display:none;place-items:center}
#mini:not(.playing) .over{display:grid}
#mini.loaded:not(.playing) .over{background:rgba(51,51,51,.55)}
#mini .over svg{width:36%;height:36%}
@media (prefers-reduced-motion:reduce){#tick.run,#mini.playing svg.ring{animation:none}}
</style></head>
<body>
<div id="bar" class="idle" role="region" aria-label="440 Radio">
  <div id="av" class="idle"></div>
  <div id="win"><div id="tick"></div></div>
  <button id="pp" class="ic" aria-label="Pause"><svg viewBox="0 0 12 12"><path id="ppi" d="M3 1.5v9l7.5-4.5z" fill="#333"/></svg></button>
  <button id="nx" class="ic" aria-label="Next song"><svg viewBox="0 0 13 12"><path d="M1.5 1.5v9l6.5-4.5zM8.5 1.5v9l-.1 0" fill="#fff"/><rect x="9.4" y="1.5" width="2.2" height="9" rx=".8" fill="#fff"/></svg></button>
  <button id="x" class="ic" aria-label="Stop"><svg viewBox="0 0 11 11"><path d="M1.5 1.5l8 8M9.5 1.5l-8 8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>
</div>
<button id="mini" aria-label="Play 440 Radio">
  <svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#88e9bf" stroke-width="3"
      stroke-dasharray="84 29" stroke-linecap="round"/></svg>
  <div class="face"></div>
  <div class="over"><svg viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z" fill="#88e9bf"/></svg></div>
</button>
<script>
(function(){
  "use strict";

  // ---- talking between the profile embeds and the header player ------------
  // Two routes, every message on both (each carries an id, so a copy that
  // arrives twice is ignored): a BroadcastChannel, and a postMessage to every
  // frame on the page (walking window.top.frames). Wix can put the embeds in
  // different wrappers, and some browsers then keep their BroadcastChannels
  // apart - the frame walk still reaches them.
  var NET = (function(){
    var bc = "BroadcastChannel" in window ? new BroadcastChannel("440-song") : null, seen = {}, handler = function(){};
    function got(m){ if (!m || !m.id || seen[m.id]) return; seen[m.id] = 1; handler(m); }
    if (bc) bc.onmessage = function(e){ got(e.data); };
    window.addEventListener("message", function(e){ if (e.data && e.data.__440) got(e.data.__440); });
    function walk(w, m, depth){
      if (depth > 4) return;
      var n = 0; try { n = w.frames.length; } catch (x) { return; }
      for (var i = 0; i < n; i++) {
        var f; try { f = w.frames[i]; } catch (x) { continue; }
        if (f !== window) try { f.postMessage({__440: m}, "*"); } catch (x) {}
        walk(f, m, depth + 1);
      }
    }
    return {
      send: function(m){
        m = Object.assign({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7)}, m);
        seen[m.id] = 1;
        if (bc) bc.postMessage(m);
        try { walk(window.top, m, 0); } catch (x) {}
      },
      on: function(f){ handler = f; }
    };
  })();
  var audio = new Audio(), cur = null, ramp = null, radio = false, bag = [];
  var $ = function(id){ return document.getElementById(id); };
  var bar = $("bar"), av = $("av"), tick = $("tick"), win = $("win"), ppi = $("ppi"), mini = $("mini"), face = mini.querySelector(".face");
  var PLAY = "M3 1.5v9l7.5-4.5z", PAUSE = "M2.5 1.5h2.6v9H2.5zM6.9 1.5h2.6v9H6.9z";
  function say(m){ NET.send(m); }
  function state(){ say({type: "state", who: cur && cur.who, playing: !!cur && !audio.paused, title: cur && cur.title}); }

  // ---- the songs: songs.json (title, artist, start, fade) + whichever file exists
  var SONGS = fetch("songs/songs.json", {cache: "no-cache"}).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; });
  var FILE = {};
  function fileFor(who){
    if (!FILE[who]) {
      var W = who.charAt(0).toUpperCase() + who.slice(1);
      var list = ["songs/" + who + ".m4a", "songs/" + who + ".mp3", "songs/" + W + ".m4a", "songs/" + W + ".mp3"];
      var tryOne = function(i){
        if (i >= list.length) return Promise.resolve("");
        return fetch(list[i], {method: "HEAD", cache: "no-cache"}).then(function(r){ return r.ok ? list[i] : tryOne(i + 1); }, function(){ return tryOne(i + 1); });
      };
      FILE[who] = tryOne(0);
    }
    return FILE[who];
  }
  function info(who){
    return Promise.all([SONGS, fileFor(who)]).then(function(r){
      var e = r[0][who] || {};
      return r[1] ? {who: who, src: r[1], start: +e.start || 0, fade: +e.fade || 0,
                     title: ((e.title || who) + (e.artist ? "  ·  " + e.artist : "")).toUpperCase()} : null;
    });
  }
  function nextWho(){                                      // shuffle: everyone once before repeats
    return SONGS.then(function(all){
      var keys = Object.keys(all);
      if (!bag.length) {
        bag = keys.slice();
        for (var i = bag.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = bag[i]; bag[i] = bag[j]; bag[j] = t; }
        if (cur && bag.length > 1 && bag[bag.length - 1] === cur.who) bag.unshift(bag.pop());   // no back-to-back
      }
      return bag.pop();
    });
  }
  function radioNext(){
    radio = true;
    return nextWho().then(function(w){ return w ? info(w) : null; }).then(function(m){
      if (m) start(m); else if (bag.length) return radioNext();
    });
  }

  // ---- looks
  function fit(){ document.body.classList.toggle("compact", window.innerWidth < 120); }
  fit(); window.addEventListener("resize", fit);
  function setTitle(t, idle){
    tick.innerHTML = ""; tick.classList.remove("run");
    var a = document.createElement("span"); a.textContent = t || "";
    if (idle) { var sm = document.createElement("small"); sm.textContent = "SHUFFLE TEAM SONGS"; a.appendChild(sm); }
    tick.appendChild(a);
    requestAnimationFrame(function(){
      if (!idle && a.offsetWidth - 40 > win.clientWidth) {
        tick.appendChild(a.cloneNode(true));
        tick.style.setProperty("--dur", (a.offsetWidth / 30) + "s"); tick.classList.add("run");
      } else a.style.paddingRight = "0";
    });
  }
  function show(){
    var on = !!cur, playing = on && !audio.paused;
    bar.classList.toggle("idle", !on); av.classList.toggle("idle", !on);
    if (!on) { av.style.backgroundImage = ""; setTitle("440 RADIO", true); }
    ppi.setAttribute("d", playing ? PAUSE : PLAY); $("pp").setAttribute("aria-label", playing ? "Pause" : "Play");
    mini.classList.toggle("playing", playing); mini.classList.toggle("loaded", on);
    face.style.backgroundImage = on ? "url(avatars/" + cur.who + ".svg)" : "";
    mini.setAttribute("aria-label", playing ? "Pause (hold for next song)" : on ? "Play" : "Play 440 Radio");
  }
  function fadeIn(sec){
    cancelAnimationFrame(ramp);
    if (!sec) { audio.volume = 1; return; }
    var t0 = performance.now(); audio.volume = 0;
    (function up(){ var k = (performance.now() - t0) / (sec * 1000); audio.volume = Math.min(1, k); if (k < 1) ramp = requestAnimationFrame(up); })();
  }
  function start(m){
    var fresh = !cur || cur.who !== m.who || audio.ended;
    if (fresh) {
      cur = m; audio.src = m.src; av.style.backgroundImage = "url(avatars/" + m.who + ".svg)"; setTitle(m.title || m.who.toUpperCase());
      show();
      info(m.who).then(function(i){ if (i && cur === m) { m.title = i.title; setTitle(i.title); show(); state(); } });   // header's own songs.json title wins
      if (m.start) {
        var seek = function(){ try { audio.currentTime = m.start; } catch (e) {} };
        if (audio.readyState >= 1) seek(); else audio.addEventListener("loadedmetadata", seek, {once: true});
      }
      fadeIn(m.start ? (m.fade || 3) : 0);
    }
    var p = audio.play();
    if (p && p.catch) p.catch(function(){ if (!radio) { say({type: "blocked", who: m.who}); } show(); });
    show();
  }
  function stop(){ radio = false; audio.pause(); audio.removeAttribute("src"); audio.load(); cur = null; show(); state(); }
  audio.addEventListener("play", function(){ show(); state(); });
  audio.addEventListener("pause", function(){ show(); state(); });
  audio.addEventListener("ended", function(){ if (radio) radioNext(); else { cur = null; show(); state(); } });
  audio.addEventListener("error", function(){ if (radio && cur) radioNext(); });

  // ---- controls
  function toggle(){
    if (!cur) { radioNext(); return; }                    // idle: start the radio
    if (audio.paused) audio.play(); else audio.pause();
  }
  bar.addEventListener("click", function(e){ if (!cur && !e.target.closest("button")) radioNext(); });
  av.addEventListener("click", function(e){ if (cur) { e.stopPropagation(); toggle(); } });
  $("pp").addEventListener("click", toggle);
  $("nx").addEventListener("click", function(){ radioNext(); });
  $("x").addEventListener("click", stop);
  // round button: tap = play/pause, hold = next song
  var held = null, skipped = false;
  mini.addEventListener("pointerdown", function(){
    skipped = false;
    held = setTimeout(function(){ skipped = true; mini.classList.add("skip"); setTimeout(function(){ mini.classList.remove("skip"); }, 400); radioNext(); }, 600);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function(ev){ mini.addEventListener(ev, function(){ clearTimeout(held); }); });
  mini.addEventListener("click", function(){ if (!skipped) toggle(); skipped = false; });
  mini.addEventListener("contextmenu", function(e){ e.preventDefault(); });

  // ---- the profiles
  NET.on(function(m){
    if (m.type === "hello") state();
    else if (m.type === "play") start(m);                  // a profile's TEAM SONG button (radio carries on after, if it was on)
    else if (m.type === "pause") audio.pause();
    else if (m.type === "stop") stop();
  });
  // ---- picking up after a page change. On desktop Wix rebuilds the header
  // embed on every page, so the player notes what's playing (song, spot,
  // radio on/off) and the next page's player carries on from there. Browsers
  // may want a tap before sound starts in a fresh embed: then it waits,
  // paused at the same spot, and one tap on play continues.
  var KEY = "440radio";
  function save(){
    try {
      if (cur) localStorage.setItem(KEY, JSON.stringify({m: cur, t: audio.currentTime, playing: !audio.paused, radio: radio, bag: bag, at: Date.now()}));
      else localStorage.removeItem(KEY);
    } catch (e) {}
  }
  setInterval(save, 1000);
  // heartbeat the profiles can read even if no message gets through
  setInterval(function(){ try { localStorage.setItem("440hdr", String(Date.now())); } catch (e) {} }, 1000);
  window.addEventListener("pagehide", save);
  audio.addEventListener("pause", save); audio.addEventListener("play", save);
  (function resume(){
    var s = null; try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
    if (!s || !s.m || Date.now() - s.at > 120000) return;          // only straight after a page change
    radio = !!s.radio; bag = s.bag || []; cur = s.m;
    audio.src = s.m.src; av.style.backgroundImage = "url(avatars/" + s.m.who + ".svg)"; setTitle(s.m.title);
    var at = s.t + (s.playing ? (Date.now() - s.at) / 1000 : 0);
    var seek = function(){ try { audio.currentTime = at; } catch (e) {} };
    if (audio.readyState >= 1) seek(); else audio.addEventListener("loadedmetadata", seek, {once: true});
    audio.volume = 1;
    if (s.playing) { var p = audio.play(); if (p && p.catch) p.catch(function(){ show(); state(); }); }
    show();
  })();
  show(); state();
})();
</script>
</body></html>
