/* ================================================================
   DOT POT LEADERBOARD — matches the Dot Pot board widget's visual
   language: same fonts, same position colors (read directly off the
   actual position-pill SVGs during that build, not the old page's
   values), same card stroke/radius, same circle-badge treatment.
   Row height, avatar size and column layout measured directly off
   the provided mockup (Dot_Pot_Leaderboard_Update.svg).
   ================================================================ */
body{ margin:0; background:transparent }
.lb-wrap{ container-type:inline-size; width:100% }
.lb, .lb *{ box-sizing:border-box }
.lb{
  max-width:905px; margin:0 auto; padding:24px 0;
  /* was 24px 16px - that horizontal padding was exactly what kept the
     card from reaching the full 905px: .lb__card has no explicit width,
     so it fills its PARENT's content box, which was 905 - 32 = 873px.
     Vertical spacing kept, horizontal removed so the card can use the
     iframe's full available width. */
  font-family:"Wix Madefor Text",Arial,sans-serif; color:#333333;
  -webkit-font-smoothing:antialiased;
}

.lb__header{ position:relative; display:flex; justify-content:center; margin-bottom:18px }
.lb__header img{ width:820px; height:auto; display:block }
.lb__dotfield{
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:820px; height:100%; pointer-events:auto;
}
.lb__dot{
  position:absolute; border-radius:50%; pointer-events:none;
  transform:translate(-50%,-50%) translate(var(--mx,0px), var(--my,0px));
  transition:transform .6s cubic-bezier(.34,1.56,.64,1);
}
.lb__dot.is-magnet{ transition:transform .12s ease-out }

/* ---- season totals card ---- */
.lb__card{
  background:#fff; border:3px solid #333333; border-radius:27px;
  padding:20px 24px; margin-bottom:24px;
}
/* Column widths, row height and stroke below are all read directly off
   the provided reference SVG (Dot_Pot_Grid.svg), not estimated: name
   228.07px, four equal position columns at 117.79px each, total column
   146.84px (a real but modest ~25% wider than the positions), row height
   84px (measured consistently across all 9 horizontal-line gaps), divider
   color/weight #e4e4e4 at 3px - matching the outer card's own stroke. */
.lb__cardhead{
  display:grid;
  grid-template-columns:228.07px repeat(4, 1fr) 1.24663fr;
  column-gap:0; align-items:center; padding-bottom:0;
}
.lb__pot{
  font-family:"Rotundo",sans-serif; font-size:13px; letter-spacing:.01em;
  color:#6d6e71; background:#efefef; border-radius:999px;
  width:211px; height:48px; display:flex; align-items:center; justify-content:center;
  /* explicit 211x48, not content-sized - as a grid item this was defaulting
     to justify-self:stretch and filling the entire (wide, auto-sized) first
     track, which is why it was spanning almost the full card width. */
}
.lb__pot b{ color:#1f9e63; font-weight:400 }
.lb__potline--short{ display:none }
.lb__colcell{
  display:flex; align-items:center; justify-content:center;
  /* no border here - confirmed directly off the reference SVG that the
     vertical column lines start exactly at the same y as the first
     horizontal row line, i.e. they do not run through the header/circles
     at all, only through the data rows below (see .lb__val). */
}
.lb__poscircle{
  width:46px; height:46px; border-radius:50%;
  display:grid; place-items:center; color:#fff; cursor:pointer;
  font-family:"Rotundo",sans-serif; font-size:13px; letter-spacing:.01em;
  border:3px solid transparent; transition:border-color .15s, transform .1s;
}
.lb__poscircle:hover{ transform:scale(1.18) }
.lb__poscircle[aria-pressed="true"]{ border-color:#333333 }
.lb__total{
  font-family:"Rotundo",sans-serif; font-style:italic; font-size:16px;
  color:#333333; cursor:pointer; user-select:none;
  transform:translateX(-3px);   /* the box itself measures dead-centered in
    its column (verified: 863.09 vs 863.10, effectively identical) - the
    italic slant just visually leans the glyphs rightward within that box,
    which is what actually reads as "shifted right". Small compensating
    nudge, not a real layout change. */
}
.lb__total[aria-pressed="true"]{ text-decoration:underline; text-underline-offset:3px }
.lb__total-short{ display:none }   /* "TOT" - mobile only, see below */
.lb__headrule{ grid-column:1 / -1; border-top:3px solid #e4e4e4; margin:20px 0 0 }

.lb__row{
  display:grid;
  grid-template-columns:228.07px repeat(4, 1fr) 1.24663fr;
  column-gap:0; align-items:center; height:84px;
}
.lb__row + .lb__row{ border-top:3px solid #e4e4e4 }
.lb__who{ display:flex; align-items:center; gap:12px; min-width:0 }
.lb__rank{
  width:20px; flex:0 0 auto; text-align:right;
  font-family:"Rotundo",sans-serif; font-size:15px; color:#9b9b9b;
}
.lb__avatar{
  width:40px; height:40px; border-radius:50%; flex:0 0 auto;
  background:#efefef; object-fit:cover;
}
.lb__name{
  font-family:"Rotundo",sans-serif; font-size:17px; letter-spacing:.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.lb__val{
  text-align:center; font-family:"Rotundo",sans-serif; font-size:16px;
  font-variant-numeric:tabular-nums; border-left:3px solid #e4e4e4;
  height:100%; display:flex; align-items:center; justify-content:center;
}
.lb__val--zero{ color:#c2c2c2 }
.lb__val--tot{ font-weight:400; color:#333333 }

/* ---- week-by-week card: same card treatment as above, no scroll box -
   the whole point of this redesign is showing many weeks at once instead
   of hiding them behind a fixed-height scrolling panel. ---- */
.lb__wkcard{
  background:#fff; border:3px solid #333333; border-radius:27px;
  padding:20px 24px;
}
.lb__wktitle{
  font-family:"Rotundo",sans-serif; font-size:19px; letter-spacing:.02em;
  margin:0 0 16px;
}
.lb__wk{ padding:14px 0 }
.lb__wk + .lb__wk{ border-top:2px solid #e6e6e6 }
.lb__wknum{
  display:block; font-family:"Rotundo",sans-serif; font-size:13px;
  letter-spacing:.04em; color:#6d6e71; margin-bottom:10px;
}
.lb__wkgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px }
.lb__wkcell{
  display:flex; align-items:center; gap:8px; min-width:0;
  border-left:3px solid var(--c); padding:2px 0 2px 10px;
}
.lb__wkavatar, .lb__wkplaceholder{
  width:26px; height:26px; border-radius:50%; flex:0 0 auto;
  background:#efefef; object-fit:cover;
}
.lb__wktext{ min-width:0 }
.lb__wkcell b{
  display:block; font-family:"Rotundo",sans-serif; font-weight:400; font-size:12px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  /* 14px -> 12px: measured against real player names at the actual
     available width (117px) - even at 10px "Christian McCaffrey" alone
     needs 135px, so no font size fixes that one; 12px fits 7/10 realistic
     names in full and leaves the rest to the abbreviation fallback below,
     same mechanism the Dot Pot board widget already uses for long names. */
}
.lb__wkcell small{
  display:block; font-family:"Wix Madefor Text",Arial,sans-serif; font-size:11.5px;
  color:#6d6e71;
}
.lb__wkcell--empty{ opacity:.4 }

.lb__foot{
  text-align:center; font-family:"Wix Madefor Text",Arial,sans-serif;
  font-size:11px; color:#9b9b9b; margin-top:14px; min-height:14px;
}

/* ---- mobile ---- */
@container (max-width:500px){
  .lb{ padding:16px 12px }
  .lb__header{ margin-bottom:10px }
  .lb__header img{ width:290px }
  .lb__dotfield{ display:none }   /* mobile now shows the actual Dot Pot
    widget's own mobile header asset (dots baked in, matching its genuinely
    different layout), not the desktop leaderboard header scaled down - the
    separate interactive dot overlay is positioned specifically for the
    DESKTOP image's geometry and would land in the wrong spots here. No
    loss of interaction either way, since that's desktop-only already. */

  .lb__card, .lb__wkcard{ border-width:2.5px; border-radius:16px; padding:12px 10px }

  /* Header goes BACK to sharing the exact same grid as the data rows,
     not the flex layout from last round. That flex approach positioned
     circles via leftover space around the pot pill, which had nothing to
     do with the actual data columns below - that's exactly why circles
     weren't landing over their columns. A shared grid makes that
     structurally impossible to get wrong: whatever column QB sits in up
     here is the exact same column its dots sit in down below. */
  .lb__cardhead{
    display:grid; grid-template-columns:80px repeat(5, 1fr);
    column-gap:0; align-items:center; padding-bottom:0;
  }
  .lb__pot{
    width:auto; height:auto; font-size:7px; padding:4px 6px;
    grid-column:1; justify-self:start;
    /* mobile keeps its own compact, content-sized pill - the 211x48 spec
       was explicitly "on desktop". Text itself is shortened separately
       (see renderPot) to "$260 LEFT", dropping "of $300". */
  }
  .lb__colcell:nth-child(2){ grid-column:2 }
  .lb__colcell:nth-child(3){ grid-column:3 }
  .lb__colcell:nth-child(4){ grid-column:4 }
  .lb__colcell:nth-child(5){ grid-column:5 }
  .lb__colcell:nth-child(6){ grid-column:6 }
  .lb__poscircle{ width:24px; height:24px; font-size:7.5px; border-width:1.5px }
  .lb__total{ font-size:7.5px; letter-spacing:0 }
  .lb__total-full{ display:none }
  .lb__total-short{ display:inline }
  .lb__potline--full{ display:none }
  .lb__potline--short{ display:inline }
  .lb__headrule{ margin-top:6px }

  /* Name column dropped from 98px to 75px, freeing real width for the
     position/total columns - made possible by removing the avatar from
     this table on mobile (see .lb__avatar below), not by the pot-pill
     text shortening, which turned out not to matter here: the name
     column's width was always driven by fitting real names, never by
     the pot pill, so shortening its text alone couldn't have freed up
     any room - only cutting the avatar+its gap (25px of overhead) could.
     Rank number still uniquely identifies each row. Position + TOTAL
     columns are now genuinely wider and identically sized, at 33px each. */
  .lb__row{ grid-template-columns:80px repeat(5, 1fr); column-gap:0; height:40px }
  /* 74px was the exact measured minimum (54px SCHILLING text + 20px rank/gap
     overhead) - and "exact minimum" already burned us once before on this
     same page (truncated once real sub-pixel rounding got involved). 80px
     leaves a real buffer this time, verified below, not just calculated. */
  .lb__val{ border-left-width:2.5px }   /* matches THIS breakpoint's own
    outer stroke (2.5px) - the previous fix matched desktop's 3px instead,
    which was thicker than mobile's own card border, the actual bug */
  .lb__row + .lb__row{ border-top-width:2.5px }
  .lb__headrule{ border-top-width:2.5px }
  .lb__rank{ width:14px; font-size:10px }
  .lb__avatar{ display:none }   /* same trade-off the original page already
    made for its own mobile week-by-week view for the same reason: "gives
    the name more room, since it's the only identifier needed at this
    width" - rank number covers uniqueness here */
  .lb__name{ font-size:9px }   /* re-measured against the two longest real
    names (SCARPITTI, SCHILLING) against the actual available column width -
    see build notes */
  .lb__val{ font-size:9px }
  .lb__who{ gap:6px }

  .lb__wktitle{ font-size:13px; margin-bottom:10px }
  .lb__wk{ padding:9px 0 }
  .lb__wknum{ font-size:9.5px; margin-bottom:6px }
  .lb__wkgrid{ grid-template-columns:repeat(2,1fr); gap:8px }

      <span class="lb__pot" id="lbPot">$&mdash; left of $&mdash;</span>

      <span class="lb__colcell"><span class="lb__poscircle" data-pos="RB" style="background:#0c9bd7" role="button" tabindex="0" aria-pressed="false">RB</span></span>
      <span class="lb__colcell"><span class="lb__poscircle" data-pos="WR" style="background:#2eb57b" role="button" tabindex="0" aria-pressed="false">WR</span></span>

      <span class="lb__colcell"><span class="lb__total" id="lbTotalHead" role="button" tabindex="0" aria-pressed="true"><span class="lb__total-full">TOTAL</span><span class="lb__total-short">TOT</span></span></span>
    </div>

    <div id="lbBoard"></div>

  <section class="lb__wkcard">
    <p class="lb__wktitle">WEEK BY WEEK</p>

  </section>

<script>
(function () {
  'use strict';

  var SOURCE = "https://mykal792.github.io/440-data/dots.json";
  var AVATAR_BASE = "https://mykal792.github.io/440-data/avatars/";
  var REFRESH_MS = 10 * 60 * 1000;
  var SEASON_WEEKS = 15;

  var POS_ORDER = ['QB', 'RB', 'WR', 'TE'];
  var MANAGER_KEYS = ['schilling','garrett','hayden','greg','scarpitti',
                       'gangus','graham','coyne','scotty','anthony'];
  // Same colors the Dot Pot board itself uses - read directly off the
  // actual position-pill SVG assets during that build, not the old page's
  // values (which were a different, earlier palette: ff4858/049dd9/28b99a/ff8a2a).
  var POS_COLOR = { QB: '#ed402e', RB: '#0c9bd7', WR: '#2eb57b', TE: '#f4862c' };

  var data = null;
  var updated = Date.now();
  var hasData = false;
  var sortKey = 'total';   // 'total' | 'QB' | 'RB' | 'WR' | 'TE'

  // Same fallback the Dot Pot board widget uses for long names: try the
  // name in full first, and only if it genuinely doesn't fit, abbreviate
  // the first name to an initial ("C. McCaffrey") rather than silently
  // truncating with an ellipsis.
  function abbreviateName(name) {
    var parts = name.trim().split(' ');
    if (parts.length < 2) return name;
    return parts[0].charAt(0) + '. ' + parts.slice(1).join(' ');
  }
  function fitName(nameEl, fullName) {
    nameEl.textContent = fullName;
    if (nameEl.scrollWidth <= nameEl.clientWidth + 1) return;
    nameEl.textContent = abbreviateName(fullName);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function numCell(value, extraClass) {
    var cls = 'lb__val' + (extraClass ? ' ' + extraClass : '');
    if (value === 0) return el('div', cls + ' lb__val--zero', '\u2014');
    return el('div', cls, String(value));
  }

  function tickAgo() {
    var ago = document.getElementById('lbAgo');
    if (!hasData) { ago.textContent = ''; return; }
    var total = Math.floor((Date.now() - updated) / 60000);
    if (total < 1) { ago.textContent = 'Updated just now'; return; }
    var d = Math.floor(total / 1440);
    var h = Math.floor((total % 1440) / 60);
    var m = total % 60;
    function unit(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
    var parts = [];
    if (d) parts.push(unit(d, 'day', 'days'));
    if (h) parts.push(unit(h, 'hr', 'hrs'));
    if (m && !d) parts.push(unit(m, 'min', 'min'));
    ago.textContent = 'Updated ' + parts.slice(0, 2).join(' ') + ' ago';
  }

  var SEASON_FALLBACK = 2026;
  var POT_TOTAL_FALLBACK = 300;

  function renderPot() {
    var pot = (data && data.pot) || { total: POT_TOTAL_FALLBACK, remaining: POT_TOTAL_FALLBACK };
    // Wrapped in one span, not left as a direct flex child mix of text +
    // <b> - a flex container splits that into a real item (<b>) plus an
    // anonymous item for the trailing text run, and the anonymous item's
    // LEADING space gets treated as box-edge whitespace and collapses,
    // while every later space in that same text (not at a box boundary)
    // renders fine. That's exactly why only "$260 left" lost its gap.
    // Mobile-only shortening ("$260 LEFT", dropping "of $300") - same
    // dual-span, CSS-toggled-by-breakpoint approach as TOTAL/TOT, so
    // desktop keeps the full text unchanged.
    document.getElementById('lbPot').innerHTML =
      '<span class="lb__potline lb__potline--full"><b>$' + pot.remaining + '</b> left of $' + pot.total + '</span>' +
      '<span class="lb__potline lb__potline--short"><b>$' + pot.remaining + '</b> left</span>';
  }

  // Sortable: click a position circle to rank by that position's win count,
  // click TOTAL to go back to the season-total ranking. Same underlying
  // data, JS-side sort only - no change to what's fetched or how.
  function renderBoard() {
    var board = document.getElementById('lbBoard');
    board.textContent = '';
    var totals = (data && data.totals) || MANAGER_KEYS.reduce(function (acc, k) {
      acc[k] = { QB: 0, RB: 0, WR: 0, TE: 0 };
      return acc;
    }, {});

    var managers = Object.keys(totals).map(function (key) {
      var byPos = totals[key];
      var total = POS_ORDER.reduce(function (sum, p) { return sum + (byPos[p] || 0); }, 0);
      return { key: key, byPos: byPos, total: total };
    });

    managers.sort(function (a, b) {
      var av = sortKey === 'total' ? a.total : (a.byPos[sortKey] || 0);
      var bv = sortKey === 'total' ? b.total : (b.byPos[sortKey] || 0);
      return bv - av || a.key.localeCompare(b.key);
    });

    managers.forEach(function (m, i) {
      var row = el('div', 'lb__row');
      var who = el('div', 'lb__who');
      who.appendChild(el('span', 'lb__rank', String(i + 1)));

      var img = document.createElement('img');
      img.className = 'lb__avatar';
      img.alt = m.key.toUpperCase();
      img.loading = 'lazy';
      img.src = AVATAR_BASE + m.key + '.svg';
      img.onerror = function () { this.style.visibility = 'hidden'; };
      who.appendChild(img);

      who.appendChild(el('span', 'lb__name', m.key.toUpperCase()));
      row.appendChild(who);

      POS_ORDER.forEach(function (pos) {
        row.appendChild(numCell(m.byPos[pos] || 0));
      });
      row.appendChild(numCell(m.total, 'lb__val--tot'));
      board.appendChild(row);
    });
  }

  function setSort(key) {
    sortKey = key;
    document.querySelectorAll('.lb__poscircle').forEach(function (c) {
      c.setAttribute('aria-pressed', c.dataset.pos === key ? 'true' : 'false');
    });
    document.getElementById('lbTotalHead').setAttribute('aria-pressed', key === 'total' ? 'true' : 'false');
    renderBoard();
  }

  document.querySelectorAll('.lb__poscircle').forEach(function (c) {
    c.addEventListener('click', function () { setSort(c.dataset.pos); });
    c.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSort(c.dataset.pos); }
    });
  });
  var totalHead = document.getElementById('lbTotalHead');
  totalHead.addEventListener('click', function () { setSort('total'); });
  totalHead.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSort('total'); }
  });

  // Always all weeks, most recent first - no inner scroll box any more.
  // The page itself just gets taller, which is the actual point: at least
  // ten weeks visible without having to scroll a tiny panel to find them.
  function renderHistory() {
    var box = document.getElementById('lbHistory');
    box.textContent = '';
    var byWeek = {};
    var maxWeek = 0;
    ((data && data.history) || []).forEach(function (w) {
      byWeek[w.week] = w.positions;
      if (w.week > maxWeek) maxWeek = w.week;
    });

    var order = [];
    for (var w1 = maxWeek; w1 >= 1; w1--) order.push(w1);
    for (var w2 = maxWeek + 1; w2 <= SEASON_WEEKS; w2++) order.push(w2);

    order.forEach(function (week) {
      var positions = byWeek[week];
      var wk = el('div', 'lb__wk');
      wk.appendChild(el('span', 'lb__wknum', 'WEEK ' + week));
      var grid = el('div', 'lb__wkgrid');
      var pendingNames = [];   // {el, text} - fitted only once this week's
      // block is actually attached to the live document; measuring
      // clientWidth on a still-detached subtree would just read 0

      POS_ORDER.forEach(function (pos) {
        var winner = positions ? positions[pos] : null;
        var cell = el('div', 'lb__wkcell' + (winner ? '' : ' lb__wkcell--empty'));
        cell.style.setProperty('--c', POS_COLOR[pos]);

        if (winner) {
          var img = document.createElement('img');
          img.className = 'lb__wkavatar';
          img.alt = winner.manager_display;
          img.loading = 'lazy';
          img.src = AVATAR_BASE + winner.manager + '.svg';
          img.onerror = function () { this.style.visibility = 'hidden'; };
          cell.appendChild(img);
        } else {
          cell.appendChild(el('span', 'lb__wkplaceholder'));
        }

        var text = el('div', 'lb__wktext');
        if (winner) {
          var nameEl = el('b', null, null);
          text.appendChild(nameEl);
          pendingNames.push({ el: nameEl, text: winner.detail || winner.manager_display });
          text.appendChild(el('small', null, winner.manager_display + ' \u00b7 ' + winner.value));
        } else {
          text.appendChild(el('b', null, pos));
          text.appendChild(el('small', null, positions ? 'no starter found' : 'not yet settled'));
        }
        cell.appendChild(text);
        grid.appendChild(cell);
      });

      wk.appendChild(grid);
      box.appendChild(wk);   // now live - safe to measure
      pendingNames.forEach(function (p) { fitName(p.el, p.text); });
    });
  }

  function render() {
    renderPot();
    renderBoard();
    renderHistory();
  }

  function load() {
    fetch(SOURCE, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (json) {
        data = json;
        hasData = true;
        var stamp = Date.parse(json.updated || '');
        updated = isNaN(stamp) ? Date.now() : stamp;
        tickAgo();
        render();
      })
      .catch(function () {
        hasData = false;
        tickAgo();
        render();
      });
  }

  render();
  load();
  setInterval(tickAgo, 30000);
  setInterval(load, REFRESH_MS);
})();

/* ================================================================
   Magnetic header dots - same exact mechanism as the Dot Pot board
   widget: dots sit still until the cursor comes within range, then
   follow it, then spring back with a bouncy rubber-band transition
   when the cursor moves away. Coordinates re-extracted from THIS
   header asset specifically (it includes "LEADERBOARD" text the
   widget's header doesn't, so the vertical layout differs slightly -
   confirmed the two aren't pixel-identical before reusing anything).
   One shared dataset for both breakpoints (this page scales the same
   header image via CSS width, not a separate mobile asset) - only the
   INTERACTION is gated to desktop, per "same interaction, desktop only".
   ================================================================ */
(function(){
  var DOTS = [
    {cx:8.56,  cy:39.14, r:8.56,  color:"#ed402e"},
    {cx:708.43,cy:66.08, r:10.27, color:"#ed402e"},
    {cx:793.54,cy:99.69, r:14.16, color:"#2eb57b"},
    {cx:41.89, cy:96.89, r:10.8,  color:"#2eb57b"},
    {cx:229.32,cy:82.09, r:9.87,  color:"#2eb57b"},
    {cx:659.71,cy:105.28,r:14.16, color:"#0c9bd7"},
    {cx:98.93, cy:51.7,  r:9.52,  color:"#0c9bd7"},
    {cx:161.04,cy:43.37, r:14.16, color:"#f4862c"},
    {cx:813.89,cy:41.06, r:6.64,  color:"#f4862c"},
    {cx:606.09,cy:51.67, r:9.87,  color:"#f4862c"}
  ];
  var LOGO_W = 820.53, LOGO_H = 119.44;
  var MAGNET_RADIUS = LOGO_W * (55 / 820.53);   // same ratio as the widget

  var field = document.getElementById('lbDotfield');
  var dots = [];

  function isMobileLayout(){ return window.matchMedia("(max-width:500px)").matches; }

  function buildDots(){
    field.innerHTML = '';
    dots = DOTS.map(function(d){
      var el = document.createElement('div');
      el.className = 'lb__dot';
      el.style.left = (d.cx / LOGO_W * 100) + '%';
      el.style.top = (d.cy / LOGO_H * 100) + '%';
      el.style.width = (d.r * 2 / LOGO_W * 100) + '%';
      el.style.height = (d.r * 2 / LOGO_H * 100) + '%';
      el.style.background = d.color;
      field.appendChild(el);
      return {el:el, cx:d.cx, cy:d.cy, magnetized:false};
    });
  }

  function release(d){
    if (!d.magnetized) return;
    d.magnetized = false;
    d.el.classList.remove('is-magnet');
    d.el.style.setProperty('--mx', '0px');
    d.el.style.setProperty('--my', '0px');
  }

  function handleMove(e){
    if (isMobileLayout()) return;   // desktop-only interaction - dots still
    // render on mobile (from buildDots), they just never magnetize there
    var rect = field.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var scaleX = rect.width / LOGO_W, scaleY = rect.height / LOGO_H;
    var mx = (e.clientX - rect.left) / scaleX;
    var my = (e.clientY - rect.top) / scaleY;

    dots.forEach(function(d){
      var dx = mx - d.cx, dy = my - d.cy;
      var dist = Math.hypot(dx, dy);
      if (dist < MAGNET_RADIUS){
        if (!d.magnetized){ d.magnetized = true; d.el.classList.add('is-magnet'); }
        d.el.style.setProperty('--mx', (dx * scaleX) + 'px');
        d.el.style.setProperty('--my', (dy * scaleY) + 'px');
      } else {
        release(d);
      }
    });
  }

  function releaseAll(){ dots.forEach(release); }

  field.addEventListener('mousemove', handleMove);
  field.addEventListener('mouseleave', releaseAll);

  buildDots();
  var _dotResizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(_dotResizeTimer);
    _dotResizeTimer = setTimeout(releaseAll, 150);
  });
})();
</script>
