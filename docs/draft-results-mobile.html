<style>
/* ==========================================================================
   1ST ROUND PICKS — mobile, sliding stats drawer
   Artboard 570 x 1960. Paste into a Wix HTML embed at that fixed size.

   GENERATED FROM draft-results-desktop.template.html by make_mobile_template.py
   Do not hand-edit. Change the desktop template and re-run.

   This is the desktop board cut at the bio divider. Pane 1 holds the desktop
   left half -- pick, portrait, identity -- at desktop scale with identical
   type. Pane 2 holds bio and stats, spread to the same 500px window. Tapping
   the chevron slides the whole row across; the pick number and manager leave
   frame with it, which is what buys the stats their full width.

   Both panes are exactly the window's size, so nothing is revealed or
   collapsed vertically and the 1960px height holds open or closed.

   The mobile lockup, unlike the desktop one, has no built-in underline, so
   one is drawn INSIDE the header box, positioned so the computer and cans
   sit on the line the way the desktop artwork does. Its offsets come from
   build_draft_page.py, derived from the lockup's own ink extent.

   THE ONE RULE THAT MATTERS
   Every avatar SVG has a #e5e6e7 rounded box that is 155.85 x 146.82 in its
   own viewBox, flush to the bottom and both sides. Only the amount of hair
   ABOVE that box varies (14.87 units for Taylor, 33.23 for Nacua).

   So the avatar is sized by SETTING SVG WIDTH TO THE SLOT WIDTH AND PINNING
   ITS BOTTOM. Because the box is full-width and bottom-flush in all ten
   files, that makes all ten gray boxes render identically without a single
   per-player number. Hair spills upward into reserved space. Nothing about
   the row reads the avatar's total height, which is what let last year's
   rows drift (measured pitch ran 166/171/182/181 px on the same artboard).

   No element shows or hides, so the 2004px height is always true.
   ========================================================================== */

:root {
  --ink:        #333333;
  --rule:       #bababa;   /* matches the rule built into the header SVG */
  --label:      #6D6E71;
  --pick-label: #A5A7AA;
  --white:      #ffffff;
  --cta:        #E4E4E4;   /* system tray grey, for the footer button */
}

html, body { margin: 0; padding: 0; background: var(--white); }

.dr-viewport {
  container-type: inline-size;
  width: 100%;
  max-width: 570px;
  margin: 0 auto;
}

.draft-results {
  /* 1 design unit = 1px at the 902px artboard. Everything scales as one. */
  --u: calc(100cqw / 570);

  /* layout constants, in artboard px */
  --pad-x:    14;     /* content 542 = window 500 + gap 14 + chevron 28 */
  --win-w:    500;    /* the desktop left half, cut at the bio divider */
  --pad-y:    24;
  --row-h:    178;
  --rule-w:   4;
  --slot-w:   120;      /* avatar gray-box width  */
  --slot-h:   113.05;   /* = 120 * (146.82/155.85), the box's own ratio */

  position: relative;
  box-sizing: border-box;
  width: 100%;
  background: var(--white);
  padding: calc(var(--pad-y) * var(--u)) calc(var(--pad-x) * var(--u));
  font-family: 'Laro Soft', system-ui, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* ---------- header ------------------------------------------------------ */

.dr-header {
  display: block;
  /* Trimmed lockup rendered at its original scale, centred — so dropping the
     clipboard doesn't enlarge the title. */
  width: calc(83.310 * 1%);
  margin: 0 auto;
}
.dr-header svg { display: block; width: 100%; height: auto; }

/* The mobile lockup has no built-in underline, so one is drawn inside the
   header box. --rule-top places it so the artwork overhangs it by the same
   proportion the desktop lockup uses, which is what makes the computer and
   cans read as sitting ON the line. Both offsets are injected at build time
   from the lockup's measured ink extent. */
.dr-header { position: relative; }
.dr-header__rule {
  position: absolute;
  left: 0;
  right: 0;
  display: none;
  top: calc(0.00 * var(--u));
  height: calc(4 * var(--u));
  background: var(--rule);
  border-radius: calc(2 * var(--u));
}
.dr-rows { margin-top: calc(8.00 * var(--u)); }

/* ---------- row --------------------------------------------------------- */

.dr-row {
  display: grid;
  grid-template-columns:
    calc(var(--win-w) * var(--u))  /* sliding window */
    calc(8  * var(--u))
    calc(34 * var(--u));           /* arrow          */
  align-items: center;
  height: calc(var(--row-h) * var(--u));
}

.dr-sep {
  height: calc(var(--rule-w) * var(--u));
  background: var(--rule);
  border-radius: calc(var(--rule-w) * var(--u) / 2);  /* header rule is round-capped */
}

/* ---------- the drawer -------------------------------------------------- */

.win {
  grid-column: 1;
  position: relative;
  width: calc(var(--win-w) * var(--u));
  height: 100%;          /* full row height, so avatar hair is never clipped */
  overflow: hidden;
}
.track {
  display: flex;
  width: 200%;
  height: 100%;
  transform: translateX(0);
  transition: transform 460ms cubic-bezier(0.22, 0.68, 0.28, 1);
  will-change: transform;
}
.dr-row.is-open .track { transform: translateX(-50%); }

.pane { flex: 0 0 50%; height: 100%; }

/* pane 1 — the desktop left half, unchanged */
.pane--face {
  display: grid;
  grid-template-columns:
    calc(134 * var(--u))            /* pick block */
    calc(10  * var(--u))
    calc(var(--slot-w) * var(--u))  /* avatar     */
    calc(14  * var(--u))
    calc(222 * var(--u));           /* identity — 2 more than desktop */
  align-items: center;
  height: 100%;
}

/* pane 2 — bio and stats, spread to the full window */
.pane--data {
  display: grid;
  grid-template-columns:
    calc(274 * var(--u))   /* player bio */
    calc(40  * var(--u))
    calc(2   * var(--u))   /* divider    */
    calc(38  * var(--u))
    calc(146 * var(--u));  /* stats      */
  align-items: center;
  height: 100%;
}

/* ---------- chevron ----------------------------------------------------- */

.arrow {
  grid-column: 3;
  appearance: none;
  -webkit-appearance: none;
  margin: 0; padding: 0; border: 0;
  background: transparent;
  font: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  width: calc(34 * var(--u));
  height: calc(34 * var(--u));
  border-radius: 50%;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.arrow svg {
  width: calc(28 * var(--u));
  height: calc(28 * var(--u));
  transition: transform 460ms cubic-bezier(0.22, 0.68, 0.28, 1);
}
.dr-row.is-open .arrow svg { transform: rotate(180deg); }
.arrow:focus-visible {
  outline: calc(2 * var(--u)) solid var(--pos-color);
  outline-offset: calc(2 * var(--u));
}
.arrow__chev {
  fill: var(--pos-color);
  stroke: var(--pos-color);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- pick block -------------------------------------------------- */

.pick        { grid-column: 1; }
.pick__label {
  font-size: calc(18 * var(--u));
  font-weight: 700;
  letter-spacing: calc(2 * var(--u));
  color: var(--pick-label);
  line-height: 1;
}
.pick__no {
  --no-size: calc(52 * var(--u));
  --cap: calc(var(--no-size) * 0.700);   /* cap height, identical in all 3 faces */
  display: flex;
  align-items: baseline;                 /* see .pick__no-mark */
  gap: calc(var(--cap) * 0.125);         /* reference: 7px beside a 56px cap */
  /* At 52px with line-height 1 the numeral's own line box carries 10.4px of
     dead space above its cap, so a 9 margin read as a ~21 gap. -4 cancels the
     leading without touching the baseline the numero mark aligns to. */
  margin-top: calc(-4 * var(--u));
  color: var(--ink);
}
/* U+2116 is in none of the loaded fonts, so the mark is drawn from
   Number_Symbol.svg and sized to the numeral's cap height. */
/* The mark is exactly one cap-height tall and `overflow:hidden` makes a flex
   item synthesise its baseline from its bottom margin edge. So its bottom sits
   on the digits' baseline and, both being cap height, their tops align too --
   without depending on line-height, which was making the mark ride high. */
.pick__no-mark {
  flex: 0 0 auto;
  width: calc(var(--cap) * 1.674);
  height: var(--cap);
  display: block;
  overflow: hidden;
}
.pick__no-mark svg { display: block; width: 100%; height: 100%; fill: var(--ink); }
.pick__no-digits {
  font-family: 'Rotundo', 'Laro Soft', system-ui, sans-serif;
  font-size: var(--no-size);
  line-height: 1;
  white-space: nowrap;
}
.pick__manager {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: calc(6 * var(--u));
  margin-top: calc(10 * var(--u));
}
.pick__manager::before,
.pick__manager::after {
  content: '';
  height: calc(2 * var(--u));
  background: currentColor;
  border-radius: calc(1 * var(--u));
}
.pick__manager-label {
  font-size: calc(10.3 * var(--u));
  font-weight: 700;
  letter-spacing: calc(0.7 * var(--u));
  color: var(--label);
  line-height: 1;
}
.pick__manager-name {
  font-size: calc(15.8 * var(--u));
  font-weight: 700;
  letter-spacing: calc(0.6 * var(--u));
  text-align: center;
  margin-top: calc(3 * var(--u));
  color: var(--ink);
  line-height: 1;
}

/* ---------- avatar ------------------------------------------------------ */

/* The slot IS the gray box. Nothing here knows how tall any avatar is. */
.avatar {
  grid-column: 3;
  position: relative;
  width: calc(var(--slot-w) * var(--u));
  height: calc(var(--slot-h) * var(--u));
}
.avatar svg {
  position: absolute;
  left: 0;
  bottom: 0;          /* box is bottom-flush in every file */
  width: 100%;        /* box is full-width in every file   */
  height: auto;
  display: block;
  overflow: visible;  /* hair spills up into reserved space */
  pointer-events: none;
}

/* ---------- identity ---------------------------------------------------- */

.identity { grid-column: 5; }
.identity__first {
  font-size: calc(20.1 * var(--u));
  font-weight: 400;
  letter-spacing: calc(0.4 * var(--u));
  line-height: 1;
}
.identity__last {
  font-size: calc(28.7 * var(--u));
  font-weight: 700;
  letter-spacing: calc(0.2 * var(--u));
  line-height: 1;
  margin-top: calc(2 * var(--u));
}
/* The pill sits in a bare <div>. Nothing up the chain sets a font-size, so
   that div inherits the browser's 16px/normal strut — a FIXED ~19.2px that
   does not scale with --u. Once the board renders narrower than about 900 it
   exceeds the pill's own height and pads the row, floating the names upward.
   display:flex removes the line box, so the wrapper is exactly the pill. */
.identity__badgerow {
  display: flex;
  align-items: flex-start;
  line-height: 0;
}
.identity__badge {
  display: inline-block;
  margin-top: calc(7 * var(--u));
  padding: calc(7.5 * var(--u)) calc(14 * var(--u));
  border-radius: calc(5 * var(--u));
  background: var(--pos-color);
  color: var(--white);
  font-family: 'Rotundo', 'Laro Soft', system-ui, sans-serif;
  font-size: calc(15.8 * var(--u));
  font-weight: 400;              /* Rotundo ships one weight */
  letter-spacing: calc(0.8 * var(--u));
  line-height: 1;
  white-space: nowrap;
}
.identity__team {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  margin-top: calc(7 * var(--u));

/* Fixed slot so every team NAME starts at the same x down the column, while

.identity__logo {

  flex: 0 0 calc(38 * var(--u));
  display: flex;
  align-items: center;
  justify-content: center;
  height: calc(24 * var(--u));

.identity__logo svg {
  display: block;
  width: calc(var(--logo-w) * 2 * var(--u));
  height: calc(var(--logo-h) * 2 * var(--u));
}
.identity__team-name {
  font-size: calc(13.5 * var(--u));
  font-weight: 700;
  letter-spacing: calc(0.3 * var(--u));
  color: var(--ink);
  line-height: 1;
  white-space: nowrap;
}

/* ---------- dividers ---------------------------------------------------- */

.divider {
  width: calc(2 * var(--u));
  height: calc(112 * var(--u));
  background: var(--rule);
  border-radius: calc(1 * var(--u));
  justify-self: center;
}
.divider--stats { grid-column: 3; }

/* ---------- data blocks ------------------------------------------------- */

.block--bio   { grid-column: 1; }
.block--stats { grid-column: 5; }

.block__label {
  font-size: calc(14 * var(--u));
  font-weight: 700;
  letter-spacing: calc(1.4 * var(--u));
  color: var(--label);
  line-height: 1;
}
.block__rule {
  height: calc(2 * var(--u));
  background: var(--rule);
  border-radius: calc(1 * var(--u));
  margin-top: calc(7 * var(--u));
}
.block__rows { margin-top: calc(16 * var(--u)); }
.block__row {
  /* Label column is sized to the LONGEST label (BIRTHDATE), measured off the
     reference: labels start 574, values start 656 at the 940 artboard = 82px,
     which is 85 in this content space. The old 62+10 was too narrow and
     BIRTHDATE ran into its value. */
  display: grid;
  grid-template-columns: calc(146 * var(--u)) 1fr;
  column-gap: 0;
  align-items: baseline;
  height: calc(31 * var(--u));
}
.block--stats .block__row { grid-template-columns: calc(70 * var(--u)) 1fr; }

.block__key {
  font-size: calc(15.5 * var(--u));
  font-weight: 400;
  letter-spacing: calc(0.2 * var(--u));
  color: var(--label);
  line-height: 1;
  white-space: nowrap;
}
.block__val {
  font-size: calc(15.5 * var(--u));
  font-weight: 700;
  letter-spacing: calc(0.2 * var(--u));
  color: var(--ink);
  line-height: 1;
  white-space: nowrap;
}

/* ---------- footer button ------------------------------------------------
   Full results live on a separate page. target="_top" is required or the
   destination loads inside the Wix iframe. Colour-only hover so the block
   cannot shift, matching the site header's button. */
.dr-cta-row {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: calc(16 * var(--u));
  margin-top: calc(28 * var(--u));
}
.dr-cta {
  flex: 0 0 calc(263 * var(--u));    /* (542 - 16) / 2 */
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(10 * var(--u));
  height: calc(68 * var(--u));
  border-radius: calc(34 * var(--u));
  background: var(--cta);
  text-decoration: none;
  transition: background-color 160ms ease;
}
.dr-cta span {
  font-family: 'Rotundo', 'Laro Soft', system-ui, sans-serif;
  font-size: calc(17 * var(--u));
  line-height: 1;
  letter-spacing: calc(0.6 * var(--u));
  color: var(--ink);
  transition: color 160ms ease;
  white-space: nowrap;
}
/* Ryder Cup button: red half, blue half, gradient across the middle third.
   The two colours are the LIGHTEST that still carry white text at 4.5:1
   (#D63A4B is 4.60, #2170CE is 4.91) — going lighter for the flags' sake
   would have dropped the label below AA. */
.dr-cta--rc {
  --rc-red:  #D63A4B;
  --rc-blue: #2170CE;
  background: linear-gradient(90deg,
              var(--rc-red)  0%, var(--rc-red)  33%,
              var(--rc-blue) 67%, var(--rc-blue) 100%);
}
.dr-cta--rc span { color: #ffffff; }

.dr-cta:hover { background: #333333; }
.dr-cta:hover span { color: #ffffff; }
/* Must come after .dr-cta:hover and restate the background — the two have
   equal specificity, so source order decides, and the generic rule would
   otherwise flatten the gradient to #333333 on hover. */
.dr-cta--rc:hover {
  --rc-red:  #AF303D;
  --rc-blue: #1B5CA9;
  background: linear-gradient(90deg,
              var(--rc-red)  0%, var(--rc-red)  33%,
              var(--rc-blue) 67%, var(--rc-blue) 100%);
}
/* The flags' own red (#ba133e) and blue (#0554a2) sit only 1.40 and 1.53
   against the button halves, which is far too close to read. A white ring
   separates them regardless of what the button is doing, including on hover. */
.dr-cta--rc .dr-cta__flag {
  border-radius: calc(3 * var(--u));
  box-shadow: 0 0 0 calc(2 * var(--u)) #ffffff;
}
.dr-cta__flag {
  flex: 0 0 auto;
  width: calc(32.5 * var(--u));      /* 22 tall at the files' 1.479 ratio */
  height: calc(22 * var(--u));
  display: block;
}
.dr-cta__flag svg { display: block; width: 100%; height: 100%; }
.dr-cta:focus-visible {
  outline: calc(3 * var(--u)) solid var(--ink);
  outline-offset: calc(3 * var(--u));
}

        ${pickNo(p.no)}
        <div class="pick__manager" style="color:${pos.color}">
          <span class="pick__manager-label">MANAGER</span>
        </div>
        <div class="pick__manager-name">${esc(p.manager)}</div>
      </div>

      <div class="avatar">${AVATARS[p.avatar] || ''}</div>

      <div class="identity">
        <div class="identity__first">${esc(p.firstName)}</div>
        <div class="identity__last">${esc(p.lastName)}</div>
        <div class="identity__badgerow"><span class="identity__badge">${esc(pos.name)}</span></div>
        <div class="identity__team">
          <span class="identity__logo" style="--logo-w:${logo.w};--logo-h:${logo.h}">${logo.svg}</span>
          <span class="identity__team-name">${esc(team)}</span>
        </div>
      </div>

      </div>

      <div class="pane pane--data">
      <div class="block block--bio">
        <div class="block__label">${esc(meta.sections.bio)}</div>
        <div class="block__rule"></div>
        <div class="block__rows">${bioRows}</div>
      </div>

      <div class="divider divider--stats"></div>
      <div class="block block--stats">
        <div class="block__label">${esc(meta.sections.stats)}</div>
        <div class="block__rule"></div>
        <div class="block__rows">${statRows}</div>
      </div>
      </div>
      </div></div>

      <button class="arrow" type="button"
              aria-expanded="false"
              aria-controls="${rowId}-track"
              aria-label="Show ${esc(p.fullName)} stats">${CHEVRON}</button>
    </div>
    <div class="dr-sep"></div>`;
}

/* The stats column is narrow, so long labels get their reference-graphic
   short forms. Anything unmapped passes through unchanged. */
const STAT_SHORT = {
  'CARRIES': 'CAR', 'RECEPTIONS': 'REC', 'TOTAL YARDS': 'YDS', 'TOUCHDOWNS': 'TD'
};
function shortStat(l) { return STAT_SHORT[l] || l; }

function render(data) {
  const rows = document.getElementById('dr-rows');
  rows.innerHTML = data.picks.map((p, i) => renderRow(p, data.meta, i)).join('');

  rows.querySelectorAll('.arrow').forEach((btn, i) => {
    btn.addEventListener('click', () => {
      const row  = btn.closest('.dr-row');
      const open = row.classList.toggle('is-open');
      const p    = data.picks[i];
      btn.setAttribute('aria-expanded', String(open));
      btn.setAttribute('aria-label',
        'Show ' + p.fullName + (open ? ' photo' : ' stats'));
    });
  });
}

render(FALLBACK);

if (DATA_URL) {
  fetch(DATA_URL, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => { if (d && d.picks && d.picks.length) render(d); })
    .catch(() => { /* keep the baked board */ });
}
</script>
</body>
</html>
