  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    font-family: "Montserrat", "Arial Black", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .pp {
    padding: 12px 12px 16px;
  }

  .pp-title {
    margin: 0 auto 24px;
    max-width: 580px;
    line-height: 0;
  }

  .pp-title svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .pp-grid {
    list-style: none;
    margin: 0 auto;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--row-gap) var(--gap);
    max-width: calc(5 * var(--col) + 4 * var(--gap));
  }

  .pp-grid li {
    flex: 0 0 var(--col);
    width: var(--col);
  }

  .pp-card {
    display: block;
    text-decoration: none;
    border-radius: 12px;
  }

  .pp-card img {
    display: block;
    width: 100%;
    height: auto;
  }

  .pp-name {
    display: block;
    margin-top: 14px;
    height: 44px;
    line-height: 44px;
    border-radius: 22px;
    background: var(--btn-bg);
    color: var(--btn-text);
    font-family: "Rotundo", "Montserrat", "Arial Black", "Helvetica Neue", Arial, sans-serif;
    font-synthesis: none;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-align: center;
    white-space: nowrap;
    transition: background-color 150ms ease, color 150ms ease;
  }

  .pp-card:hover .pp-name,
  .pp-card:focus-visible .pp-name {
    background: var(--btn-bg-hover);
    color: var(--btn-text-hover);
  }

  .pp-card:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 4px;
  }

  /* Phones and narrow embeds: exactly 2 avatars per row */
  @media (max-width: 600px) {
    :root { --row-gap: 30px; }
    .pp { padding: 16px 12px 24px; }
    .pp-title { margin-bottom: 28px; }
    .pp-grid { max-width: calc(2 * var(--col) + var(--gap)); }
  }

  @media (max-width: 420px) {
    :root {
      --col: 136px;
      --gap: 14px;
      --row-gap: 10px;
    }
    .pp { padding: 10px 12px 10px; }
    .pp-title { margin-bottom: 14px; max-width: 290px; }
    .pp-card img { width: 108px; margin: 0 auto; }
    .pp-name { margin-top: 8px; height: 32px; line-height: 32px; font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pp-name { transition: none; }
  }
</style>
