.tp-wrap{ container-type:inline-size; width:100% }
.tp, .tp *{box-sizing:border-box}
.tp{
  --tp-bar:#1c1c1c;
  --tp-panel:#dedede;
  --tp-card:#ffffff;
  --tp-ink:#2d2d2d;
  --tp-sub:#6d6e71;
  --tp-mute:#9b9b9b;
  --tp-tile:#efefef;
  --tp-hair:#e6e6e6;
  --tp-mint:#88e9bf;

  width:100%;
  border-radius:18px; overflow:hidden;
  font-family:"Laro Soft","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; color:var(--tp-ink);
}

/* ---- dark mode: same palette + 'bb-theme' key as the scoreboard ---- */
.tp.is-dark{
  --tp-panel:#333333;
  --tp-card:#494848;
  --tp-ink:#ffffff;
  --tp-sub:#a5a7aa;
  --tp-mute:#a5a7aa;
  --tp-hair:rgba(255,255,255,.18);
}
/* the avatar tile and position chip stay light in both modes - the face
   illustrations and stroke colors are tuned for a light background, same
   reasoning as the scoreboard's face tiles */
.tp.is-dark .tp__team{ color:#333 }

.tp__bar{
  background:var(--tp-bar); color:#fff;
  display:flex; align-items:center; flex-wrap:wrap;
  gap:8px 14px; padding:11px 20px; min-height:48px;
}
.tp__label{
  font-family:"Rotundo",sans-serif; font-size:14px; letter-spacing:.05em;
  margin:0; margin-right:auto;
}
.tp__label span{ margin-right:8px }
.tp__label b{ font-weight:400; color:var(--tp-mint) }
.tp__status{
  display:flex; align-items:center; gap:9px; margin:0;
  font-size:10.5px; letter-spacing:.10em; text-transform:uppercase; color:#a8a8a8;
}
.tp__dot{
  width:7px; height:7px; border-radius:50%; flex:0 0 auto; background:var(--tp-mint);
  animation:tp-pulse 2.4s ease-out infinite;
}
.tp[data-status="final"] .tp__dot,
.tp[data-status="pregame"] .tp__dot{ background:#7d7d7d; animation:none }
@keyframes tp-pulse{
  0%{box-shadow:0 0 0 0 rgba(136,233,191,.5)}
  70%{box-shadow:0 0 0 7px rgba(136,233,191,0)}
  100%{box-shadow:0 0 0 0 rgba(136,233,191,0)}
}
.tp__state{ font-family:"Rotundo",sans-serif; letter-spacing:.09em; color:#fff }
.tp__ago{
  margin:0; font-size:10.5px; letter-spacing:.10em; text-transform:uppercase;
  color:#a8a8a8; white-space:nowrap;
}
.tp__ago[hidden]{ display:none }

/* ---- dark mode toggle, ported 1:1 from the scoreboard ---- */
.tp__mode{
  flex:0 0 auto; position:relative; width:44px; height:24px; padding:0;
  border:0; border-radius:999px; cursor:pointer;
  background:rgba(255,255,255,.22); transition:background .18s ease;
}
.tp.is-dark .tp__mode{ background:var(--tp-mint) }
.tp__mode:focus-visible{ outline:2px solid var(--tp-mint); outline-offset:3px }
.tp__knob{
  position:absolute; top:3px; left:3px; width:18px; height:18px;
  border-radius:50%; background:#fff;
  display:flex; align-items:center; justify-content:center;
  transition:transform .18s ease, background .18s ease;
}
.tp.is-dark .tp__knob{ transform:translateX(20px); background:#333 }
.tp__knob svg{
  width:11px; height:11px; fill:none; stroke:#6d6e71;
  stroke-width:2; stroke-linecap:round;
}
.tp.is-dark .tp__knob svg{ stroke:var(--tp-mint) }
.tp__knob .moon{ display:none }
.tp.is-dark .tp__knob .sun{ display:none }
.tp.is-dark .tp__knob .moon{ display:block }
@media (prefers-reduced-motion:reduce){
  .tp__mode,.tp__knob{ transition:none }
}

.tp__body{ background:var(--tp-panel); padding:13px 16px 16px }
.tp__desc{
  font-family:"Wix Madefor Text",Arial,sans-serif; font-size:11px; line-height:1.4;
  color:var(--tp-sub); margin:0 0 11px;
}

.tp__filter{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin:0 0 10px }
.tp__tab{
  appearance:none; border:0; cursor:pointer; min-width:0;
  height:26px; padding:0 4px; border-radius:999px; background:var(--tp-card);
  font-family:"Rotundo",sans-serif; font-size:10px; line-height:1; color:var(--tp-ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:background 130ms ease,color 130ms ease;
}
.tp__tab:hover{ background:var(--pos-color, var(--tp-ink)); color:#fff }
.tp__tab[aria-pressed="true"]{ color:#fff }

.tp__card{
  --tp-accent: var(--tp-ink);
  background:var(--tp-card); border-radius:8px; overflow:hidden;
  border:3px solid var(--tp-accent); transition:border-color 160ms ease;
}
.tp__list{ padding:4px 12px 6px }

/* -- rows: rank | avatar+position chip | name/team + stat line | points -- */
.tp__row{
  display:grid; grid-template-columns:14px 32px minmax(0,1fr) auto;
  align-items:center; gap:10px; padding:10px 0;
  border-bottom:2px solid var(--tp-accent, var(--tp-hair));
}
.tp__row:last-child{ border-bottom:0 }
.tp__row--1 .tp__rank{ color:var(--tp-ink); font-weight:600 }
.tp__row--empty{ opacity:.45 }
.tp__rank{ font-family:"Rotundo",sans-serif; font-size:12px; color:var(--tp-mute); text-align:right }

.tp__id{ position:relative; width:32px; height:32px; flex:0 0 auto }
.tp__avatar{
  width:100%; height:100%; border-radius:50%; display:block;
  background:var(--tp-tile); object-fit:cover;
}
.tp__pos{
  position:absolute; right:-5px; bottom:-5px;
  min-width:19px; height:15px; padding:0 3px;
  display:flex; align-items:center; justify-content:center;
  background:#fff; border:2.5px solid var(--pos-color,var(--tp-ink)); border-radius:5px;
  font-family:"Rotundo",sans-serif; font-size:8px; line-height:1;
  color:var(--pos-color,var(--tp-ink));
}

.tp__main{ min-width:0 }
.tp__nameline{ display:flex; align-items:center; gap:5px; min-width:0 }
.tp__name{
  font-family:"Rotundo",sans-serif; font-weight:400; font-size:13px; line-height:1.2;
  text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  min-width:0; flex:0 1 auto;
}
.tp__team{
  flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
  font-family:"Wix Madefor Text",Arial,sans-serif; font-weight:600; font-size:8px;
  letter-spacing:.03em; text-transform:uppercase; line-height:1;
  color:var(--tp-sub); background:var(--tp-tile); padding:2px 4px; border-radius:4px;
}

/* stat line: single row, clipped; JS adds data-scroll + a duplicate .tp__copy
   only when the text is too long for the container, and ticks it like a
   marquee so it stays legible instead of just cutting off */
.tp__stats{
  overflow:hidden; margin-top:3px;
  font-family:"Wix Madefor Text",Arial,sans-serif; font-size:10px;
  color:var(--tp-sub); line-height:1.25;
}
.tp__stats[data-scroll="true"]{
  -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);
  mask-image:linear-gradient(90deg,#000 88%,transparent);
}
.tp__track{ display:inline-flex; white-space:nowrap; will-change:transform }
.tp__stats[data-scroll="true"] .tp__track{ animation-name:tp-ticker; animation-timing-function:linear; animation-iteration-count:infinite }
.tp__copy{ padding-right:26px }
@keyframes tp-ticker{ from{ transform:translateX(0) } to{ transform:translateX(-50%) } }

.tp__pts{
  font-family:"Rotundo",sans-serif; font-size:15px; color:var(--tp-ink);
  font-variant-numeric:tabular-nums; text-align:right;
}

/* mobile target: 290px */
@container (max-width:400px){
  .tp{ border-radius:16px }
  .tp__bar{
    padding:10px 15px; padding-right:60px; /* room for the pinned toggle + status */
    position:relative; row-gap:4px; min-height:65px;
  }
  .tp__label{ flex:1 1 100%; margin-right:0; font-size:13.5px }
  /* mode + status are both pinned to fixed spots, not flex-flowed, so
     'PRESEASON' always sits in the same place under the toggle whether or
     not the 'ago' text next to it is visible yet */
  .tp__mode{ position:absolute; top:11px; right:15px }
  .tp__status{ position:absolute; top:40px; right:15px; margin:0 }
  .tp__body{ padding:11px 12px 12px }
  .tp__filter{ display:flex; overflow-x:auto; scrollbar-width:none; padding-bottom:2px }
  .tp__filter::-webkit-scrollbar{ display:none }
  .tp__tab{ flex:0 0 auto; padding:0 10px; font-size:10.5px }
  .tp__list{ padding:3px 8px 5px }
  .tp__row{ grid-template-columns:12px 25px minmax(0,1fr) auto; gap:7px; padding:8px 0 }
  .tp__id{ width:25px; height:25px }
  .tp__pos{ min-width:15px; height:12px; font-size:7px; border-width:2.5px; right:-4px; bottom:-4px }
  .tp__name{ font-size:11.5px }
  .tp__team{ font-size:7px; padding:1.5px 3px }
  .tp__stats{ font-size:9px }
  .tp__pts{ font-size:13.5px }
}


/* desktop target: 905px - deliberately no .tp__bar/.tp__label override here:
   the scoreboard keeps its header at base size at this width too, so this
   inherits the same 48px-min-height, 14px-label bar as the base rule */
@container (min-width:700px){
  .tp__body{ padding:20px 32px 32px }
  .tp__desc{ font-size:12.5px; margin-bottom:16px }
  .tp__filter{ gap:10px; margin-bottom:16px }
  .tp__tab{ height:30px; font-size:11.5px }
  .tp__list{ padding:6px 24px 12px }
  .tp__row{ grid-template-columns:20px 42px minmax(0,1fr) auto; gap:16px; padding:13px 0 }
  .tp__id{ width:42px; height:42px }
  .tp__pos{ min-width:23px; height:17px; font-size:10px; border-width:2.5px; right:-6px; bottom:-6px }
  .tp__name{ font-size:15px }
  .tp__team{ font-size:9px; padding:2.5px 5px }
  .tp__stats{ font-size:11.5px }
  .tp__pts{ font-size:18px }
}
</style>

<div class="tp-wrap">
<section class="tp" id="tp" data-status="pregame" aria-labelledby="tpLabel">
  <div class="tp__bar">
    <p class="tp__label" id="tpLabel"><span id="tpWeek">WEEK -</span><b>TOP PLAYERS</b></p>
    <p class="tp__status">
      <span class="tp__dot"></span>
      <span class="tp__state" id="tpState">PRESEASON</span>
    </p>
    <p class="tp__ago" id="tpAgo" hidden></p>
    <button class="tp__mode" id="tpMode" type="button" role="switch"
            aria-checked="false" aria-label="Dark mode">
      <span class="tp__knob">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"/></svg>
      </span>
    </button>
  </div>
  <div class="tp__body">
    <p class="tp__desc">The top 5 scorers at each position, from starting lineups only.</p>
    <div class="tp__filter" id="tpFilter"></div>
    <div class="tp__card" id="tpCard">
      <div class="tp__list" id="tpList"></div>
    </div>
  </div>
</section>
</div>

<script>
(function () {
  'use strict';

  var SOURCE = "https://mykal792.github.io/440-data/top-players.json";
  // Avatars live alongside the feed, one <manager-key>.svg per manager -
  // see the /avatars folder that ships with this handoff.
  var AVATAR_BASE = SOURCE.replace(/top-players\.json$/, 'avatars/');
  var TOP_N = 5;
  var REFRESH_MS = 10 * 60 * 1000;
  var TICKER_PX_PER_SEC = 34; // ticker speed for stat lines too long to fit

  var POS_COLOR = { QB:'#ff4858', RB:'#049dd9', WR:'#28b99a',
                    TE:'#ff8a2a', K:'#b157f5', DEF:'#989898' };
  var POS_LABEL = { ALL:'All', QB:'QB', RB:'RB', WR:'WR', TE:'TE', K:'K', DEF:'DEF' };
  var POS_ORDER = ['QB','RB','WR','TE','K','DEF'];
  var STATE_LABEL = { pregame:'PRESEASON', live:'LIVE', final:'FINAL' };
  var INK = '#2d2d2d';

  var players = [];
  var active = 'ALL';
  var updated = Date.now();
  var hasData = false;

  /* --- dark mode: same 'bb-theme' key the scoreboard uses, so a choice
     made on one block carries over to the other --- */
  var tpSection = document.getElementById('tp');
  var modeBtn = document.getElementById('tpMode');
  function setMode(dark) {
    tpSection.classList.toggle('is-dark', dark);
    modeBtn.setAttribute('aria-checked', String(dark));
    try { localStorage.setItem('bb-theme', dark ? 'dark' : 'light'); } catch (e) {}
  }
  (function initMode() {
    var pref = null;
    try { pref = localStorage.getItem('bb-theme'); } catch (e) {}
    if (pref === null && window.matchMedia) {
      pref = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    tpSection.classList.toggle('is-dark', pref === 'dark');
    modeBtn.setAttribute('aria-checked', String(pref === 'dark'));
  })();
  modeBtn.addEventListener('click', function () {
    setMode(!tpSection.classList.contains('is-dark'));
  });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // Always exactly TOP_N rows, so the card's height never depends on how
  // many players have actually scored yet - empty slots render as a dim
  // NAME / 0.00 placeholder instead of shrinking the list.
  function placeholderRow(pos) {
    return { name: 'NAME', position: pos, team: '', manager: '',
             manager_display: '', points: 0, stats: [], placeholder: true };
  }

  function statLine(p) {
    if (!p.stats || !p.stats.length) return p.placeholder ? '' : '\u2014';
    return p.stats.map(function (s) {
      var v = s.value;
      return (Number.isInteger(v) ? v : Number(v).toFixed(1)) + ' ' + s.stat;
    }).join('  \u00b7  ');
  }

  // Fills the stat line; if it's wider than its box, ticks it left in a
  // seamless loop instead of letting it clip.
  function fitTicker(stats, track, text) {
    stats.setAttribute('data-scroll', 'false');
    track.style.animationDuration = '';
    track.textContent = '';
    track.appendChild(el('span', 'tp__copy', text));
    if (!text) return;
    if (track.scrollWidth <= stats.clientWidth + 1) return;
    track.appendChild(el('span', 'tp__copy', text));
    var loopWidth = track.scrollWidth / 2;
    stats.setAttribute('data-scroll', 'true');
    track.style.animationDuration = Math.max(4, loopWidth / TICKER_PX_PER_SEC) + 's';
  }

  function render() {
    var list = document.getElementById('tpList');
    list.textContent = '';

    var rows = active === 'ALL' ? players
             : players.filter(function (p) { return p.position === active; });
    rows = rows.slice(0, TOP_N);
    while (rows.length < TOP_N) rows.push(placeholderRow(active === 'ALL' ? '' : active));

    document.getElementById('tpCard').style.setProperty(
      '--tp-accent', active === 'ALL' ? INK : (POS_COLOR[active] || INK));

    rows.forEach(function (p, i) {
      var row = el('div', 'tp__row' + (i === 0 ? ' tp__row--1' : '') +
                          (p.placeholder ? ' tp__row--empty' : ''));
      row.appendChild(el('span', 'tp__rank', String(i + 1)));

      var idWrap = el('div', 'tp__id');
      if (p.manager) {
        var img = document.createElement('img');
        img.className = 'tp__avatar';
        img.alt = p.manager_display || '';
        img.title = p.manager_display || '';
        img.loading = 'lazy';
        img.src = AVATAR_BASE + p.manager + '.svg';
        img.onerror = function () { this.remove(); };
        idWrap.appendChild(img);
      } else {
        idWrap.appendChild(el('span', 'tp__avatar'));
      }
      // The position chip is only informative in the ALL view, where rows
      // mix positions. Filtered to one position it would just repeat the
      // same pill five times, so skip it there.
      if (p.position && active === 'ALL') {
        var pos = el('span', 'tp__pos', p.position);
        pos.style.setProperty('--pos-color', POS_COLOR[p.position] || INK);
        idWrap.appendChild(pos);
      }
      row.appendChild(idWrap);

      var main = el('div', 'tp__main');
      var nameline = el('div', 'tp__nameline');
      nameline.appendChild(el('span', 'tp__name', p.name));
      if (p.team) nameline.appendChild(el('span', 'tp__team', p.team));
      main.appendChild(nameline);

      var stats = el('div', 'tp__stats');
      var track = el('div', 'tp__track');
      stats.appendChild(track);
      main.appendChild(stats);
      row.appendChild(main);

      row.appendChild(el('span', 'tp__pts', p.points.toFixed(2)));
      list.appendChild(row);

      fitTicker(stats, track, statLine(p));
    });
  }

  function buildFilter() {
    var bar = document.getElementById('tpFilter');
    ['ALL'].concat(POS_ORDER).forEach(function (pos) {
      var b = el('button', 'tp__tab', POS_LABEL[pos]);
      b.type = 'button';
      b.setAttribute('aria-pressed', pos === 'ALL' ? 'true' : 'false');
      var posColor = POS_COLOR[pos] || INK;
      b.style.setProperty('--pos-color', posColor); // read by the :hover rule
      if (pos === 'ALL') b.style.background = INK;
      b.addEventListener('click', function () {
        bar.querySelectorAll('.tp__tab').forEach(function (o) {
          o.setAttribute('aria-pressed', 'false');
          o.style.background = '';
        });
        b.setAttribute('aria-pressed', 'true');
        b.style.background = posColor;
        active = pos;
        if (bar.scrollWidth > bar.clientWidth) {
          bar.scrollTo({ left: Math.max(0, b.offsetLeft - 8), behavior: 'smooth' });
        }
        render();
      });
      bar.appendChild(b);
    });
  }

  function tickAgo() {
    var ago = document.getElementById('tpAgo');
    if (!hasData) { ago.hidden = true; return; }
    ago.hidden = false;
    var m = Math.floor((Date.now() - updated) / 60000);
    var t;
    if (m < 1) t = 'updated just now';
    else if (m === 1) t = 'updated 1 min ago';
    else if (m < 60) t = 'updated ' + m + ' min ago';
    else { var h = Math.floor(m / 60); t = 'updated ' + h + (h === 1 ? ' hr' : ' hrs') + ' ago'; }
    ago.textContent = t;
  }

  function load() {
    fetch(SOURCE, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        players = data.players || [];
        var stamp = Date.parse(data.updated || '');
        updated = isNaN(stamp) ? Date.now() : stamp;
        hasData = true;

        var section = tpSection;
        var status = data.status || 'pregame';
        section.setAttribute('data-status', status);
        document.getElementById('tpState').textContent = STATE_LABEL[status] || status.toUpperCase();
        document.getElementById('tpWeek').textContent = 'WEEK ' + (data.week || '-');

        tickAgo();
        render();
      })
      .catch(function () {
        hasData = false;
        players = [];
        tickAgo();
        render();
      });
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 150);
  });

  buildFilter();
  render();
  load();
  setInterval(tickAgo, 30000);
  setInterval(load, REFRESH_MS);
})();
</script>
