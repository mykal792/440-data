/* ================================================================
   DOT POT — desktop (905px)
   Measured directly off Dot_Pot.svg at 4x, not eyeballed:
   - row height 102px, first row +7.4px (card's own top padding)
   - card radius 27px, stroke ~3px (both per instruction)
   - row divider: SOLID (not dashed), inset 27px each side - same
     value as the corner radius, which reads as a deliberate choice
   - position pill: 70.24 x 34.87, exact colors read off the actual
     pill SVGs (not the values previously used elsewhere):
       QB #ed402e   RB #0c9bd7   WR #2eb57b   TE #f4862c
   ================================================================ */
.dp, .dp *{box-sizing:border-box}
.dp{
  --ink:#333333;
  --panel-gray:#e4e4e4;
  --card:#ffffff;
  --sub:#8a8a8a;
  --qb:#ed402e; --rb:#0c9bd7; --wr:#2eb57b; --te:#f4862c;

  max-width:905px; margin:0 auto;
  font-family:"Rotundo",sans-serif; color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* ---- title (static logo image; the scattered dots are separate
   animated elements layered on top - see .dp__dot below) ---- */
.dp__titlewrap{ display:flex; justify-content:center; margin-bottom:-6px }
.dp__title{ width:820px; height:auto; display:block }

.dp__nav{
  display:flex; align-items:center; justify-content:center; gap:14px;
  margin-bottom:10px;
}
.dp__navbtn{
  width:29px; height:29px; padding:0; border:0; background:none; cursor:pointer;
  color:var(--ink); display:grid; place-items:center;
}
.dp__navbtn svg{width:29px; height:29px; display:block}
.dp__navbtn:disabled{opacity:.35; cursor:default}
.dp__week{font-family:"Rotundo",sans-serif; font-size:28px; letter-spacing:.02em}
.dp__back{
  display:block; margin:4px auto 0; font-family:"Wix Madefor Text",Arial,sans-serif;
  font-size:12.5px; letter-spacing:.02em; text-transform:uppercase; color:#8a8a8a;
  background:none; border:0; cursor:pointer;
}
.dp__back[hidden]{ display:none }   /* explicit override needed - the button's
  own display:block above would otherwise beat the browser's [hidden] rule */
.dp__back:hover{ color:var(--ink) }

.dp__desc{
  text-align:center; font-family:"Wix Madefor Text",Arial,sans-serif; font-weight:500;
  font-size:14px; color:#4a4a4a; margin:0 0 18px;
}

/* ---- filter pills: 5 equal columns, ALL + QB/RB/WR/TE ---- */
.dp__filter{
  display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:18px;
}
.dp__tab{
  height:43px; border-radius:999px; border:0; cursor:pointer;
  background:var(--panel-gray); color:var(--ink);
  font-family:"Rotundo",sans-serif; font-size:17px; letter-spacing:.02em;
  transition:background .15s, color .15s;
}
.dp__tab[aria-pressed="true"]{ color:#fff }
.dp__tab:hover:not([aria-pressed="true"]){ filter:brightness(0.94) }

/* ---- main card ---- */
.dp__card{
  --dp-accent: var(--ink);   /* same mechanism as the old top-players card:
    one variable, set by JS per active tab, that the border AND the row
    dividers both read - so both recolour together automatically */
  background:var(--card); border:3px solid var(--dp-accent); border-radius:27px;
  overflow:hidden; transition:border-color 160ms ease;
}
.dp__row{
  position:relative;
  display:grid; grid-template-columns:46px 60px 1fr auto;
  align-items:center; column-gap:20px;
  padding:0 28px; height:102px;
}
.dp__row:first-child{ height:109.4px }   /* measured: the card's own top
  padding is baked into the first row rather than the divider, per the
  reference - preserved exactly rather than normalised away */
/* the divider is INSET 28px each side (measured off the reference - it does
   not run edge to edge like a plain border would), so it's a positioned bar
   rather than a border-top, and it reads var(--dp-accent) the same way the
   card border does, so both recolour together on tab click */
.dp__row + .dp__row::before{
  content:""; position:absolute; top:0; left:28px; right:28px; height:3px;
  background:var(--dp-accent); transition:background-color 160ms ease;
}
.dp__row--all{ height:127.5px }
.dp__row--all:first-child{ height:134.9px }   /* ALL has 4 rows, not 5 - this
  makes the card the exact same total height either way, matching the
  original top-players.html's same fix for the same reason */

.dp__poscircle{
  width:46px; height:46px; border-radius:50%; flex:0 0 auto;
  display:grid; place-items:center; color:#fff;
  font-family:"Rotundo",sans-serif; font-size:13px; letter-spacing:.01em;
}
.dp__rank{
  width:39px; height:39px; border-radius:8px; display:grid; place-items:center;
  font-family:"Rotundo",sans-serif; font-size:17px; color:#fff; background:var(--dp-accent, var(--ink));
}

.dp__id{ position:relative; width:60px; height:60px; flex:0 0 auto }
.dp__avatar{
  width:60px; height:60px; border-radius:50%; background:#efefef;
  display:block; object-fit:cover;
}
.dp__windot{
  position:absolute; right:-2px; bottom:-2px; width:18px; height:18px;
  border-radius:50%; background:var(--pos-color, var(--ink));
  border:2.5px solid #fff;
}
@keyframes dpWinPulse{
  0%   { box-shadow:0 0 0 0 rgba(var(--pos-rgb,45,45,45),.55) }
  70%  { box-shadow:0 0 0 7px rgba(var(--pos-rgb,45,45,45),0) }
  100% { box-shadow:0 0 0 0 rgba(var(--pos-rgb,45,45,45),0) }
}
.dp__windot:not(.dp__windot--final){ animation:dpWinPulse 1.8s ease-out infinite }

.dp__main{ min-width:0 }
.dp__nameline{ display:flex; align-items:baseline; gap:9px; min-width:0 }
.dp__name{
  font-family:"Rotundo",sans-serif; font-size:22px; letter-spacing:.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1 1 auto;
}
.dp__team{
  font-family:"Wix Madefor Text",Arial,sans-serif; font-weight:600; font-size:12px;
  color:var(--sub); text-transform:uppercase; flex:0 0 auto;
}
.dp__stats{
  margin-top:2px; overflow:hidden; white-space:nowrap;
  font-family:"Wix Madefor Text",Arial,sans-serif; font-size:14px; color:var(--sub);
}
.dp__stats[data-scroll="true"] .dp__track{
  display:inline-block; animation:dpTicker linear infinite;
}
.dp__copy{ padding-right:28px }
@keyframes dpTicker{ from{transform:translateX(0)} to{transform:translateX(-50%)} }

.dp__pts{
  font-family:"Rotundo",sans-serif; font-size:26px; font-variant-numeric:tabular-nums;
  flex:0 0 auto;
}
.dp__row--empty{ opacity:.4 }

/* ---- below the card ---- */
.dp__seelink{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; margin:22px 0; font-family:"Rotundo",sans-serif; font-size:16px; letter-spacing:.02em;
  background:none; border:0; cursor:pointer; color:var(--ink); text-align:center;
}
.dp__seelink svg{ width:9px; height:15px; display:block }   /* plain triangle, no ring */
.dp__seelink:hover{ opacity:.7 }
/* ---- ENTER SQUID GAME HQ ----------------------------------
   Copied verbatim from the scoreboard's implementation - same flood
   mechanism, same variables, same JS. The only requested change is fully
   rounded corners instead of a fixed radius. */
@property --sgx-r {
  syntax: '<length>';
  inherits: true;
  initial-value: 0px;
}
.dp .sgx{
  --sgx-bg:      #e4e4e4;
  --sgx-ink:     #333333;
  --sgx-flood:   #333333;
  --sgx-inverse: #FFFFFF;

  display:block; position:relative; width:100%;
  margin-top:10px; height:74px;
  border-radius:999px; background:var(--sgx-bg);
  overflow:hidden; isolation:isolate; cursor:pointer;
  text-decoration:none; -webkit-tap-highlight-color:transparent;
}

.sgx-face{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center; gap:18px;
  font-family:"Rotundo",sans-serif; font-weight:400; text-transform:uppercase;
  line-height:1; white-space:nowrap; padding:0 24px;
}
.sgx-face .sgx-word{font-size:21.00px; letter-spacing:.04em}
.sgx-face .sgx-hq{font-size:34.00px; letter-spacing:.01em}
.sgx-mark{height:44.10px; width:auto; display:block; flex:none;
          transform:translateY(3.12px)}
.sgx-base{color:var(--sgx-ink)}

.sgx-flood{
  position:absolute; inset:0;
  background:var(--sgx-flood); color:var(--sgx-inverse);
  --sgx-r:0px;
  --x1:50%; --y1:50%; --f1:1;
  --x2:50%; --y2:50%; --f2:.78;
  --x3:50%; --y3:50%; --f3:.64;
  -webkit-mask-image:
    radial-gradient(circle calc(var(--sgx-r) * var(--f1)) at var(--x1) var(--y1), #000 98%, transparent 100%),
    radial-gradient(circle calc(var(--sgx-r) * var(--f2)) at var(--x2) var(--y2), #000 98%, transparent 100%),
    radial-gradient(circle calc(var(--sgx-r) * var(--f3)) at var(--x3) var(--y3), #000 98%, transparent 100%);
  mask-image:
    radial-gradient(circle calc(var(--sgx-r) * var(--f1)) at var(--x1) var(--y1), #000 98%, transparent 100%),
    radial-gradient(circle calc(var(--sgx-r) * var(--f2)) at var(--x2) var(--y2), #000 98%, transparent 100%),
    radial-gradient(circle calc(var(--sgx-r) * var(--f3)) at var(--x3) var(--y3), #000 98%, transparent 100%);
  transition: --sgx-r 1.55s cubic-bezier(.34, .04, .28, 1);
}
.sgx:hover .sgx-flood,
.sgx:focus-visible .sgx-flood{transition-duration:1.55s}
.sgx-flood{transition-duration:.7s}

.sgx:hover .sgx-flood{--sgx-r:var(--sgx-rmax, 760px)}
.sgx:focus-visible .sgx-flood{--sgx-r:760px}
.sgx:focus-visible{outline:3px solid var(--dp-mint,#88e9bf); outline-offset:3px}

.sgx.is-flooding .sgx-flood{--sgx-r:var(--sgx-rmax, 760px); transition-duration:.55s}

@media (prefers-reduced-motion:reduce){
  .sgx-flood,
  .sgx:hover .sgx-flood,
  .sgx.is-flooding .sgx-flood,
  .sgx:focus-visible .sgx-flood{transition-duration:.01s}
}

html,body{ background:transparent; margin:0; padding:0 }
body{ padding:24px 16px }

/* ================================================================
   DOT POT — mobile (<=500px)
   Sized against the original top-players.html's own mobile numbers
   (name 9.5px, stats 8px, avatar 22px, tabs 24px, etc.) rather than a
   blind scale-down of the desktop values, which was illegible at 290px.
   ================================================================ */
@media (max-width:500px){
  .dp{ max-width:290px }

  .dp__titlewrap{ margin-bottom:6px }
  .dp__title{ width:290px }

  .dp__nav{ gap:9px; margin-bottom:6px }
  .dp__navbtn{ width:20px; height:20px }
  .dp__navbtn svg{ width:20px; height:20px }
  .dp__week{ font-size:18px }
  .dp__back{ font-size:10px; margin-top:2px }

  .dp__desc{ font-size:9px; margin-bottom:10px; padding:0 4px }

  .dp__filter{ gap:6px; margin-bottom:10px }
  .dp__tab{ height:26px; font-size:9.5px; border-radius:999px }

  .dp__card{ border-width:2.5px; border-radius:16px }
  .dp__row{
    grid-template-columns:26px 30px 1fr auto; column-gap:8px;
    padding:0 10px; height:58px;
  }
  .dp__row:first-child{ height:62px }
  .dp__row + .dp__row::before{ left:10px; right:10px; height:2px }
  .dp__row--all{ height:72.5px }
  .dp__row--all:first-child{ height:76.5px }   /* same reasoning as desktop:
    ALL has one fewer row, so each of its rows grows by (one row's worth)/4
    to make the total height match the 5-row individual views exactly */

  .dp__poscircle{ width:26px; height:26px; font-size:7.5px }
  .dp__rank{ width:22px; height:22px; border-radius:5px; font-size:10px }

  .dp__id{ width:30px; height:30px }
  .dp__avatar{ width:30px; height:30px }
  .dp__windot{ width:11px; height:11px; border-width:1.8px }

  .dp__name{
    font-family:"Wix Madefor Text",Arial,sans-serif; font-weight:700; font-size:9px;
    /* measured against "Christian McCaffrey", the longest realistic name -
       88px needed at this size, 97px available; nothing should ever truncate */
  }
  .dp__team{ font-size:6.5px }
  .dp__stats{ font-size:7.5px; margin-top:1px }
  .dp__pts{ font-size:13px }

  .dp__seelink{ font-size:9.5px; gap:6px; margin:14px 0 }
  .dp__seelink svg{ width:6px; height:11px }

  .dp .sgx{ height:46px; margin-top:8px }
  .sgx-face{ gap:8px; padding:0 10px }
  .sgx-face .sgx-word{ font-size:8.5px }
  .sgx-face .sgx-hq{ font-size:13.5px }
  .sgx-mark{ height:17.5px; transform:translateY(1.2px) }
}
</style>

<script>
/* ================================================================
   Everything below this line is the SAME engine already deployed -
   ALL/position filtering, placeholder rows, the stat ticker, win-dot
   pending/final state, and the week archive. Only the DOM it builds
   and the CSS classes it uses changed to match the new visual design.
   ================================================================ */
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

var SOURCE = "https://mykal792.github.io/440-data/top-players.json";
var WEEKS_INDEX = "https://mykal792.github.io/440-data/weeks/index.json";
var WEEK_SOURCE = function (n) { return "https://mykal792.github.io/440-data/weeks/w" + n + ".json"; };
var AVATAR_BASE = SOURCE.replace(/top-players\.json$/, 'avatars/');
var TOP_N = 5;
var TICKER_PX_PER_SEC = 34;

var STATE_LABEL = { pregame:'PRESEASON', live:'LIVE', final:'FINAL' };
var INK = '#333333';
var POS_COLOR = { QB:'#ed402e', RB:'#0c9bd7', WR:'#2eb57b', TE:'#f4862c' };
var POS_RGB   = { QB:'237,64,46', RB:'12,155,215', WR:'46,181,123', TE:'244,134,44' };
var POS_LABEL = { ALL:'ALL', QB:'QB', RB:'RB', WR:'WR', TE:'TE' };
var POS_ORDER = ['QB','RB','WR','TE'];
var TAB_ORDER = ['ALL'].concat(POS_ORDER);

var players = [];
var active = 'ALL';
var updated = Date.now();
var hasData = false;

var dpSection = document.getElementById('dp');

function placeholderRow(pos) {
  return { name: 'NAME', position: pos, team: '', manager: '',
           manager_display: '', points: 0, stats: [], placeholder: true };
}

function statLine(p) {
  if (!p.stats || !p.stats.length) return p.placeholder ? '' : '\u2014';
  return p.stats.map(function (s) {
    var v = s.value;
    return (Number.isInteger(v) ? v : Number(v).toFixed(1)) + ' ' + s.stat;
  }).join('  \u00b7  ');
}

function fitTicker(stats, track, text, copyClass) {
  copyClass = copyClass || 'dp__copy';
  stats.setAttribute('data-scroll', 'false');
  track.style.animationDuration = '';
  track.textContent = '';
  track.appendChild(el('span', copyClass, text));
  if (!text) return;
  if (track.scrollWidth <= stats.clientWidth + 1) return;
  track.appendChild(el('span', copyClass, text));
  var loopWidth = track.scrollWidth / 2;
  stats.setAttribute('data-scroll', 'true');
  track.style.animationDuration = Math.max(4, loopWidth / TICKER_PX_PER_SEC) + 's';
}

function render() {
  var list = document.getElementById('dpList');
  list.textContent = '';
  var weekStatus = dpSection.getAttribute('data-status');

  var rows;
  if (active === 'ALL') {
    rows = POS_ORDER.map(function (pos) {
      var top = players.filter(function (p) { return p.position === pos && p.points > 0; })[0];
      return top || placeholderRow(pos);
    });
  } else {
    rows = players.filter(function (p) { return p.position === active && p.points > 0; });
    rows = rows.slice(0, TOP_N);
    while (rows.length < TOP_N) rows.push(placeholderRow(active));
  }

  document.getElementById('dpCard').style.setProperty('--dp-accent', POS_COLOR[active] || INK);

  rows.forEach(function (p, i) {
    var isWinner = active === 'ALL' ? true : i === 0;
    var row = el('div', 'dp__row' + (isWinner ? ' dp__row--1' : '') +
                        (p.placeholder ? ' dp__row--empty' : '') +
                        (active === 'ALL' ? ' dp__row--all' : ''));

    if (active === 'ALL') {
      // a circle instead of the full stadium pill - narrower, so the name
      // column gets more room and stops truncating on longer names
      var posCircle = el('span', 'dp__poscircle', p.position || '');
      posCircle.style.background = POS_COLOR[p.position] || INK;
      row.appendChild(posCircle);
    } else {
      var rankChip = el('span', 'dp__rank', String(i + 1));
      rankChip.style.setProperty('--dp-accent', POS_COLOR[active] || INK);
      row.appendChild(rankChip);
    }

    var idWrap = el('div', 'dp__id');
    if (p.manager) {
      var img = document.createElement('img');
      img.className = 'dp__avatar';
      img.alt = p.manager_display || '';
      img.title = p.manager_display || '';
      img.loading = 'lazy';
      img.src = AVATAR_BASE + p.manager + '.svg';
      img.onerror = function () { this.remove(); };
      idWrap.appendChild(img);
    } else {
      idWrap.appendChild(el('span', 'dp__avatar'));
    }
    if (isWinner && !p.placeholder && weekStatus !== 'pregame') {
      var dotColor = POS_COLOR[active === 'ALL' ? p.position : active] || INK;
      var dotRgb = POS_RGB[active === 'ALL' ? p.position : active] || '45,45,45';
      var winDot = el('span', 'dp__windot' + (weekStatus === 'final' ? ' dp__windot--final' : ''));
      winDot.style.setProperty('--pos-color', dotColor);
      winDot.style.setProperty('--pos-rgb', dotRgb);
      winDot.title = weekStatus === 'final' ? 'Dot won' : 'Currently leading - not final yet';
      idWrap.appendChild(winDot);
    }
    row.appendChild(idWrap);

    var main = el('div', 'dp__main');
    var nameline = el('div', 'dp__nameline');
    nameline.appendChild(el('span', 'dp__name', p.name));
    if (p.team) nameline.appendChild(el('span', 'dp__team', p.team));
    main.appendChild(nameline);

    var stats = el('div', 'dp__stats');
    var track = el('div', 'dp__track');
    stats.appendChild(track);
    main.appendChild(stats);
    row.appendChild(main);

    row.appendChild(el('span', 'dp__pts', p.points.toFixed(2)));
    list.appendChild(row);

    fitTicker(stats, track, statLine(p));   // stats only - names use a fitted
    // font size instead (see the mobile override), not a scrolling ticker
  });
}

function buildFilter() {
  var bar = document.getElementById('dpFilter');
  TAB_ORDER.forEach(function (pos) {
    var b = el('button', 'dp__tab', POS_LABEL[pos]);
    b.type = 'button';
    b.setAttribute('aria-pressed', pos === active ? 'true' : 'false');
    var posColor = POS_COLOR[pos] || INK;
    if (pos === active) b.style.background = posColor;
    b.addEventListener('click', function () {
      bar.querySelectorAll('.dp__tab').forEach(function (o) {
        o.setAttribute('aria-pressed', 'false');
        o.style.background = '';
      });
      b.setAttribute('aria-pressed', 'true');
      b.style.background = posColor;
      active = pos;
      render();
    });
    bar.appendChild(b);
  });
}

function tickAgo() { /* no-op placeholder retained for structural parity */ }

function grab(url) {
  var withBuster = url + (url.indexOf('?') < 0 ? '?t=' : '&t=') + Date.now();
  return fetch(withBuster, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
}

function applyData(data) {
  players = data.players || [];
  var stamp = Date.parse(data.updated || '');
  updated = isNaN(stamp) ? Date.now() : stamp;
  hasData = true;

  var status = data.status || 'pregame';
  dpSection.setAttribute('data-status', status);
  document.getElementById('dpWeek').textContent = 'WEEK ' + (data.week || '-');

  render();
}

function load() {
  if (viewWeek !== null) return;
  fetch(SOURCE, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(applyData)
    .catch(function () {
      hasData = false;
      players = [];
      render();
    });
}

var weeksKnown = [], weekNow = null, viewWeek = null;
var prevBtn = document.getElementById('dpPrev');
var nextBtn = document.getElementById('dpNext');
var backBtn = document.getElementById('dpBack');

function paintNav() {
  var shown = viewWeek || weekNow;
  var older = weeksKnown.filter(function (w) { return w < shown; });
  var newer = weeksKnown.filter(function (w) { return w > shown; });
  prevBtn.disabled = !older.length;
  nextBtn.disabled = !newer.length;
  backBtn.hidden = viewWeek === null;
}

function loadIndex() {
  return grab(WEEKS_INDEX).then(function (idx) {
    weeksKnown = (idx.weeks || []).slice().sort(function (a, b) { return a - b; });
    weekNow = idx.current;
  }).catch(function () { }).then(paintNav);
}

function showWeek(n) {
  if (n === weekNow) { viewWeek = null; paintNav(); return load(); }
  return grab(WEEK_SOURCE(n)).then(function (w) {
    viewWeek = n;
    applyData({ week: w.week, status: w.status, updated: w.updated, players: w.top_players || [] });
    paintNav();
  }).catch(function () { });
}

function step(dir) {
  var shown = viewWeek || weekNow;
  var pool = dir < 0 ? weeksKnown.filter(function (w) { return w < shown; })
                     : weeksKnown.filter(function (w) { return w > shown; });
  if (!pool.length) return;
  showWeek(dir < 0 ? pool[pool.length - 1] : pool[0]);
}
prevBtn.addEventListener('click', function () { step(-1); });
nextBtn.addEventListener('click', function () { step(1); });
backBtn.addEventListener('click', function () { showWeek(weekNow); });

// the original re-runs render() on resize, debounced - needed because the
// stat-line (and formerly name) ticker's fit check depends on the current
// container width, which changes if the window or the Wix box is resized
var resizeTimer;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 150);
});

buildFilter();
loadIndex().then(load);
setInterval(load, 10 * 60 * 1000);
setInterval(loadIndex, 10 * 60 * 1000);



/* Flood from wherever the pointer crossed the edge, and drain back toward
   wherever it left. Falls back to a centred bloom if this never runs.
   Copied verbatim from the scoreboard's implementation. */
function sgxInit(){
  var btn = document.querySelector('.sgx');
  if (!btn || btn.dataset.sgxBound) return;
  var flood = btn.querySelector('.sgx-flood');
  if (!flood) return;
  btn.dataset.sgxBound = '1';

  function jitter(e){
    var r = btn.getBoundingClientRect();
    var x = e.clientX - r.left;
    var y = e.clientY - r.top;

    var far = Math.max(
      Math.hypot(x, y),
      Math.hypot(r.width - x, y),
      Math.hypot(x, r.height - y),
      Math.hypot(r.width - x, r.height - y)
    );
    btn.style.setProperty('--sgx-rmax', (far * 1.06) + 'px');

    var spread = r.height * 0.55;
    for (var i = 1; i <= 3; i++){
      var ox = i === 1 ? 0 : (Math.random() - 0.5) * spread * 2;
      var oy = i === 1 ? 0 : (Math.random() - 0.5) * spread;
      flood.style.setProperty('--x' + i, (x + ox) + 'px');
      flood.style.setProperty('--y' + i, (y + oy) + 'px');
      flood.style.setProperty('--f' + i, i === 1 ? 1 : (0.48 + Math.random() * 0.42).toFixed(2));
    }
  }

  btn.addEventListener('pointerenter', jitter);
  btn.addEventListener('pointerleave', jitter);

  var noHover = window.matchMedia && matchMedia('(hover: none)').matches;
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var leaving = false;
  btn.addEventListener('click', function(e){
    if (!noHover || reduced || leaving) return;
    e.preventDefault();
    jitter(e);
    btn.classList.add('is-flooding');
    leaving = true;
    setTimeout(function(){ btn.click(); }, 620);
  });
}
sgxInit();
</script>
