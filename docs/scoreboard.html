/* ---- LIVE SCORING:CSS start ---- */
.ls, .ls *{box-sizing:border-box}
.ls{
  --ls-bar:#1c1c1c;
  --ls-panel:#dedede;
  --ls-card:#ffffff;
  --ls-ink:#2d2d2d;
  --ls-sub:#6d6e71;
  --ls-mute:#9b9b9b;
  --ls-tile:#efefef;
  --ls-rule:#cdcdcd;
  --ls-hair:#e6e6e6;
  --ls-mint:#88e9bf;
  --ls-mint-ink:#2b9e73;

  max-width:1240px; margin:0 auto;
  border-radius:18px; overflow:hidden;
  font-family:"Laro Soft","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; color:var(--ls-ink);
}

/* ---- black title bar ---- */
.ls__bar{
  background:var(--ls-bar); color:#fff;
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; padding:11px 20px; min-height:48px;
}
.ls__right{display:flex; align-items:center; gap:14px}
.ls__label{
  font-family:"Rotundo",sans-serif; font-size:14px; letter-spacing:.05em; margin:0;
}
.ls__label span{margin-right:8px}
.ls__label b{font-weight:400; color:var(--ls-mint)}
.ls__status{
  display:flex; align-items:center; gap:9px; margin:0;
  font-size:10.5px; letter-spacing:.10em; text-transform:uppercase; color:#a8a8a8;
}
.ls__dot{
  width:7px; height:7px; border-radius:50%; flex:0 0 auto; background:var(--ls-mint);
  animation:ls-pulse 2.4s ease-out infinite;
}
.ls[data-status="final"] .ls__dot,
.ls[data-status="pregame"] .ls__dot{background:#7d7d7d; animation:none}
@keyframes ls-pulse{
  0%{box-shadow:0 0 0 0 rgba(136,233,191,.5)}
  70%{box-shadow:0 0 0 7px rgba(136,233,191,0)}
  100%{box-shadow:0 0 0 0 rgba(136,233,191,0)}
}
.ls__state{font-family:"Rotundo",sans-serif; letter-spacing:.09em; color:#fff; margin-right:6px}
.ls__ago{white-space:nowrap}
.ls__ago[hidden]{display:none}

/* ---- dark mode: the standings palette, so it matches that panel ---- */
.ls.is-dark{
  --ls-panel:#333333;
  --ls-card:#494848;
  --ls-ink:#ffffff;
  --ls-sub:#a5a7aa;
  --ls-mute:#a5a7aa;
  --ls-rule:rgba(255,255,255,.22);
  --ls-hair:rgba(255,255,255,.18);
  --ls-mint-ink:#88e9bf;          /* the darker mint has no contrast on #494848 */
}
.ls.is-dark .ls__game,
.ls.is-dark .race{box-shadow:none}
.ls.is-dark .ls__sect{color:#a5a7aa}
.ls.is-dark .race__row--1{border-color:var(--ls-mint)}
.ls.is-dark .race__pos{background:#ededed; color:#333}
.ls.is-dark .race__row--1 .race__pos{background:var(--ls-mint); color:#333}
/* the face tile stays light in both modes — the illustrations are
   black-outlined and vanish on a dark circle */

/* ---- mode toggle ---- */
.ls__mode{
  flex:0 0 auto; position:relative; width:44px; height:24px; padding:0;
  border:0; border-radius:999px; cursor:pointer;
  background:rgba(255,255,255,.22); transition:background .18s ease;
}
.ls.is-dark .ls__mode{background:var(--ls-mint)}
.ls__mode:focus-visible{outline:2px solid var(--ls-mint); outline-offset:3px}
.ls__knob{
  position:absolute; top:3px; left:3px; width:18px; height:18px;
  border-radius:50%; background:#fff;
  display:flex; align-items:center; justify-content:center;
  transition:transform .18s ease, background .18s ease;
}
.ls.is-dark .ls__knob{transform:translateX(20px); background:#333}
.ls__knob svg{
  width:11px; height:11px; fill:none; stroke:#6d6e71;
  stroke-width:2; stroke-linecap:round;
}
.ls.is-dark .ls__knob svg{stroke:var(--ls-mint)}
.ls__knob .moon{display:none}
.ls.is-dark .ls__knob .sun{display:none}
.ls.is-dark .ls__knob .moon{display:block}
@media (prefers-reduced-motion:reduce){
  .ls__mode,.ls__knob{transition:none}
}

/* ---- gray body ---- */
.ls__body{background:var(--ls-panel); padding:13px 16px 16px}
.ls__sect{
  font-family:"Rotundo",sans-serif; font-size:10.5px; letter-spacing:.05em;
  text-transform:uppercase; color:#8a8a8a; margin:0 0 8px 2px;
}
.ls__sect b{font-weight:400; color:#a8a8a8}
.ls__split{border:0; border-top:2px dashed var(--ls-rule); margin:15px 0 13px}

/* ---- matchups ---- */
.ls__track{
  display:flex; gap:10px; overflow-x:auto; overflow-y:hidden;
  scroll-snap-type:x mandatory; scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.ls__track::-webkit-scrollbar{display:none}
.ls__track[data-overflow="right"]{
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);
}
.ls__track[data-overflow="left"]{
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 40px);
  mask-image:linear-gradient(90deg,transparent,#000 40px);
}
.ls__track[data-overflow="both"]{
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);
}
.ls__game{
  flex:1 0 228px; min-width:0; scroll-snap-align:start;
  background:var(--ls-card); border-radius:14px; padding:11px 13px 12px;
  display:flex; flex-direction:column; gap:7px;
  box-shadow:0 2px 6px -3px rgba(0,0,0,.2);
}
.ls__row{display:flex; align-items:center; gap:9px}
.ls__face{
  flex:0 0 auto; width:34px; height:34px; border-radius:50%;
  background:var(--ls-tile); padding:5px 5px 3px; overflow:hidden;
}
.ls__face svg{width:100%; height:100%; display:block}
.ls__name{
  flex:1 1 auto; min-width:0; font-family:"Rotundo",sans-serif;
  font-size:12.5px; letter-spacing:.02em; color:var(--ls-mute);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ls__pts{
  flex:0 0 auto; font-family:"Rotundo",sans-serif; font-size:14px;
  color:var(--ls-mute); font-variant-numeric:tabular-nums;
  min-width:50px; text-align:right;
}
.ls__row--lead .ls__name,
.ls__row--lead .ls__pts{color:var(--ls-ink)}
.ls__row--lead .ls__face{box-shadow:0 0 0 2px var(--ls-mint-ink)}
.ls__hair{height:1px; border-top:2px dashed var(--ls-hair)}
.ls[data-status="pregame"] .ls__name{color:var(--ls-ink)}
.ls[data-status="pregame"] .ls__pts{color:var(--ls-mute)}
.ls[data-status="pregame"] .ls__row--lead .ls__face{box-shadow:none}

/* ---- bonus races ---- */
.ls__races{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
.race{
  background:var(--ls-card); border-radius:14px; padding:11px 12px 10px;
  box-shadow:0 2px 6px -3px rgba(0,0,0,.2); min-width:0;
}
.race__head{display:flex; align-items:flex-start; gap:10px; padding:0 3px}
.race--noicon .race__head{padding-left:9px}
.race__icon{width:32px; height:32px; flex:0 0 auto}
.race__icon svg{width:32px; height:32px; display:block}
.race__meta{flex:1 1 auto; min-width:0}
.race__top{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.race__name{font-family:"Rotundo",sans-serif; font-size:14px; text-transform:uppercase; line-height:1}
.race__amt{font-family:"Rotundo",sans-serif; font-size:11px; color:var(--ls-mute); line-height:1}
.race__desc{
  font-family:"Wix Madefor Text","Laro Soft",Arial,sans-serif;
  font-size:10.5px; line-height:1.3; color:var(--ls-mute); margin:5px 0 0;
  /* wrap to two lines instead of truncating. min-height reserves the second
     line even for short descriptions, so the two race cards stay the same
     height and the board does not change size week to week. */
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
  overflow:hidden; min-height:2.6em;
}
.race__rows{margin-top:9px}
.race__row{
  display:grid; grid-template-columns:17px minmax(0,1fr) auto;
  align-items:center; gap:10px; padding:0 9px;
  height:46px;              /* fixed, not min-height — see .race__detail */
}
.race__row--1{
  border:2px solid #333; border-radius:10px; padding:0 7px;
}
.race__row--3{border-top:2px dashed var(--ls-hair)}
.race__pos{
  width:17px; height:17px; border-radius:3px; background:#333; color:#fff;
  font-family:"Rotundo",sans-serif; font-size:10.5px; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.race__row--1 .race__pos{color:var(--ls-mint)}
.race__who{min-width:0}
.race__nameline{display:flex; align-items:center; gap:7px; min-width:0}
.race__nameline b{
  font-family:"Rotundo",sans-serif; font-weight:400; font-size:12.5px;
  line-height:1; text-transform:uppercase; white-space:nowrap;
}
.race__check{width:14px; height:14px; flex:0 0 auto; display:none}
.race__check svg{width:100%; height:100%; display:block}
.ls[data-status="final"] .race__row--1 .race__check{display:block}
.race__detail{
  display:block; font-size:10.5px; color:var(--ls-sub); line-height:1.15;
  min-height:12px;          /* reserved even when empty, so the board can't
                               grow when real player names arrive at kickoff */
  margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.race__val{
  font-family:"Rotundo",sans-serif; font-size:14px; line-height:1;
  font-variant-numeric:tabular-nums; text-align:right;
}
.race__empty{font-size:11px; color:var(--ls-mute); padding:14px 9px}
/* preseason has no detail line, so drop the reserved blank and let the
   placeholder name sit centred against its number */
.ls[data-status="pregame"] .race__detail{display:none}

/* ---- ENTER SQUID GAME HQ ----------------------------------
   Lifted from the bonus board. Sits under the two race cards and matches
   them: same card colour, same radius, same gap. On hover the opposite
   colour floods in from wherever the cursor crossed the edge, and the
   wordmark lives inside the flood so it inverts exactly at the boundary. */
@property --sgx-r {
  syntax: '<length>';
  inherits: true;
  initial-value: 0px;
}
.ls .sgx{
  /* base is the card colour, so it sits in the family with the two races */
  --sgx-bg:      var(--ls-card);
  --sgx-ink:     #333333;
  --sgx-flood:   #333333;
  --sgx-inverse: #FFFFFF;

  display:block; position:relative; width:100%;
  margin-top:10px; height:86px;
  border-radius:14px; background:var(--sgx-bg);
  box-shadow:0 2px 6px -3px rgba(0,0,0,.2);
  overflow:hidden; isolation:isolate; cursor:pointer;
  text-decoration:none; -webkit-tap-highlight-color:transparent;
}
.ls.is-dark .sgx{
  --sgx-ink:     #FFFFFF;
  --sgx-flood:   #E4E4E4;
  --sgx-inverse: #333333;
  box-shadow:none;
}

/* two identical faces, exactly stacked; only the mask differs */
.sgx-face{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center; gap:18px;
  font-family:"Rotundo",sans-serif; font-weight:400; text-transform:uppercase;
  line-height:1; white-space:nowrap; padding:0 24px;
}
.sgx-face .sgx-word{font-size:21.00px; letter-spacing:.04em}
.sgx-face .sgx-hq{font-size:34.00px; letter-spacing:.01em}
/* height set so the E in GAME matches the cap height of HQ, then shifted to
   sit on the same baseline */
.sgx-mark{height:44.10px; width:auto; display:block; flex:none;
          transform:translateY(3.12px)}
.sgx-base{color:var(--sgx-ink)}

/* The flood: three overlapping circles that grow from the entry point. Their
   union is lumpier than one circle, and the script jitters their offsets and
   sizes on every hover so it never floods the same way twice. */
.sgx-flood{
  position:absolute; inset:0;
  background:var(--sgx-flood); color:var(--sgx-inverse);
  --sgx-r:0px;
  --x1:50%; --y1:50%; --f1:1;
  --x2:50%; --y2:50%; --f2:.78;
  --x3:50%; --y3:50%; --f3:.64;
  -webkit-mask-image:
    radial-gradient(circle calc(var(--sgx-r) * var(--f1)) at var(--x1) var(--y1), #000 98%, transparent 100%),
    radial-gradient(circle calc(var(--sgx-r) * var(--f2)) at var(--x2) var(--y2), #000 98%, transparent 100%),
    radial-gradient(circle calc(var(--sgx-r) * var(--f3)) at var(--x3) var(--y3), #000 98%, transparent 100%);
  mask-image:
    radial-gradient(circle calc(var(--sgx-r) * var(--f1)) at var(--x1) var(--y1), #000 98%, transparent 100%),
    radial-gradient(circle calc(var(--sgx-r) * var(--f2)) at var(--x2) var(--y2), #000 98%, transparent 100%),
    radial-gradient(circle calc(var(--sgx-r) * var(--f3)) at var(--x3) var(--y3), #000 98%, transparent 100%);
  /* slow, weighted flood in; the drain is quicker so leaving never drags */
  transition: --sgx-r 1.55s cubic-bezier(.34, .04, .28, 1);
}
.sgx:hover .sgx-flood,
.sgx:focus-visible .sgx-flood{transition-duration:1.55s}
.sgx-flood{transition-duration:.7s}

/* Keyboard focus has no cursor to start from, so it blooms from the middle.
   Hover is driven by the script; this is the fallback if it never runs. */
.sgx:hover .sgx-flood{--sgx-r:var(--sgx-rmax, 760px)}
.sgx:focus-visible .sgx-flood{--sgx-r:760px}
.sgx:focus-visible{outline:3px solid var(--ls-mint); outline-offset:3px}

/* Tap on touch: same flood, quicker, because the link follows it. Must come
   after the :hover rules — same specificity, so source order decides. */
.sgx.is-flooding .sgx-flood{--sgx-r:var(--sgx-rmax, 760px); transition-duration:.55s}

@media (prefers-reduced-motion:reduce){
  /* has to out-specify the :hover rule above, or the slow flood survives */
  .sgx-flood,
  .sgx:hover .sgx-flood,
  .sgx.is-flooding .sgx-flood,
  .sgx:focus-visible .sgx-flood{transition-duration:.01s}
}

/* ---- narrow ---- */
@media (max-width:900px){
  .ls{border-radius:16px}
  .ls__bar{padding:10px 15px; min-height:45px}
  .ls__body{padding:11px 12px 13px}
  .ls__game{flex-basis:222px; border-radius:12px; padding:10px 12px 11px}
  .ls__face{width:31px; height:31px; padding:4px 4px 3px}
  .ls__races{grid-template-columns:minmax(0,1fr); gap:9px}
  .ls .sgx{height:60px; border-radius:12px; margin-top:9px}
  .sgx-face{gap:11px; padding:0 14px}
  .sgx-face .sgx-word{font-size:11.05px}
  .sgx-face .sgx-hq{font-size:17.85px}
  .sgx-mark{height:23.15px; transform:translateY(1.64px)}
  .ls__split{margin:13px 0 11px}
}
@media (max-width:560px){
  .ls__bar{
    flex-wrap:wrap; row-gap:4px; column-gap:12px; min-height:65px;
    position:relative; padding-right:60px;   /* room for the pinned toggle */
  }
  .ls__mode{position:absolute; top:11px; right:15px}
  .ls__right{gap:10px}
  .ls__label{font-size:13.5px}
  .ls__status{flex-wrap:wrap; row-gap:3px; font-size:10px; letter-spacing:.07em; min-height:18px}
  /* 18px = the two-line case, so preseason reserves the room the
     timestamp will need once the season starts */
  .ls__state{margin-right:2px}
  .ls__game{flex-basis:214px}
  .ls__name{font-size:12px}
  .ls__pts{font-size:13.5px; min-width:47px}
  .race{border-radius:12px}
  .race__icon,.race__icon svg{width:29px; height:29px}
  .race__name{font-size:13px}
  .race__desc{font-size:10px; line-height:1.32; min-height:2.64em}
  .race__row{min-height:38px; gap:9px}
  .race__nameline b{font-size:12px}
  .race__val{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  .ls__dot{animation:none}
}

<script>
/* ============ LIVE SCORING SCRIPT ============ */

/* SCORE_SOURCE shape:
   { week:1, status:"live"|"final"|"pregame", matchups:[
       { home:{name:"GARRETT", face:"garrett", score:118.42, projected:112.40},
         away:{name:"COYNE",   face:"coyne",   score:96.18,  projected:104.80} }, ... ] }
   `projected` is Yahoo's team_projected_points. It is only shown while
   status is "pregame"; from kickoff on, `score` is used. If it's missing
   the card falls back to `score`.
   face ids: anthony, coyne, gangus, garrett, graham, greg,
             hayden, scarpitti, schilling, scotty

   BONUS_SOURCE is your existing bonus.json — unchanged. This reads
   its `live` object: { state, week, category:{...}, high:{...} } */
const SCORE_SOURCE = "https://mykal792.github.io/440-data/scoreboard.json";
const BONUS_SOURCE = "https://mykal792.github.io/440-data/bonus.json";
const REFRESH_MS   = 10 * 60 * 1000;
const FACE_SPRITE  = "";   // production: "/img/faces-sprite.svg"
const ICON_SPRITE  = "";   // production: "/img/bonus-icons.svg"
const DEMO         = false; // live feeds
/* Wix can't resize an HTML box from code, so instead of growing the box the
   widget shrinks to whatever box you drew. Set false to leave it alone. */
const FIT_TO_BOX   = true;
const MIN_SCALE    = 0.62;   // floor, so it can't shrink to unreadable
const DEMO_STATE   = "pregame";  // preview only: "pregame" | "live" | "final"

const ls = document.getElementById("ls");

/* --- dark mode: same 'bb-theme' key the bonus board used, so anyone who
   already picked a side keeps it --- */
const modeBtn = document.getElementById("lsMode");
function setMode(dark){
  ls.classList.toggle("is-dark", dark);
  modeBtn.setAttribute("aria-checked", String(dark));
  try { localStorage.setItem("bb-theme", dark ? "dark" : "light"); } catch(e){}
}
(function initMode(){
  let pref = null;
  try { pref = localStorage.getItem("bb-theme"); } catch(e){}
  if (pref === null && window.matchMedia)
    pref = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  ls.classList.toggle("is-dark", pref === "dark");
  modeBtn.setAttribute("aria-checked", String(pref === "dark"));
})();
modeBtn.addEventListener("click", () => setMode(!ls.classList.contains("is-dark")));

const track = document.getElementById("lsTrack");
const races = document.getElementById("lsRaces");
let updated = Date.now(), status = "pregame", hasData = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n).toFixed(2);

/* --- matchup card --- */
function teamRow(t, leading, pre){
  /* before kickoff there is no score worth showing, so the card carries the
     projection instead; once games start it swaps to the real number */
  const shown = (pre && t.projected != null) ? t.projected : t.score;
  return `<div class="ls__row${leading ? " ls__row--lead" : ""}">
    <span class="ls__face"><svg aria-hidden="true"><use href="${FACE_SPRITE}#face-${t.face}"></use></svg></span>
    <span class="ls__name">${esc(t.name)}</span>
    <span class="ls__pts">${fmt(shown)}</span>
  </div>`;
}

/* --- one bonus race --- */
function race(r){
  if (!r) return "";
  const hasIcon = !!document.getElementById("ic-" + r.key);
  const rows = (r.leaders || []).slice(0,3).map((l,i) => `
    <div class="race__row race__row--${i+1}">
      <span class="race__pos">${i+1}</span>
      <span class="race__who">
        <span class="race__nameline"><b>${esc(l.manager)}</b>${i === 0
          ? '<span class="race__check"><svg aria-hidden="true"><use href="' + ICON_SPRITE + '#ic-check"></use></svg></span>'
          : ''}</span>
        <span class="race__detail">${l.detail ? esc(l.detail) : "&nbsp;"}</span>
      </span>
      <span class="race__val">${esc(l.value)}</span>
    </div>`).join("") || '<p class="race__empty">Nothing scored yet.</p>';

  return `<div class="race${hasIcon ? "" : " race--noicon"}">
    <div class="race__head">
      ${hasIcon ? `<span class="race__icon"><svg aria-hidden="true"><use href="${ICON_SPRITE}#ic-${esc(r.key)}"></use></svg></span>` : ""}
      <div class="race__meta">
        <div class="race__top">
          <span class="race__name">${esc(r.label)}</span>
          ${r.amount ? `<span class="race__amt">$${esc(r.amount)}</span>` : ""}
        </div>
        <p class="race__desc">${esc(r.description || "")}</p>
      </div>
    </div>
    <div class="race__rows">${rows}</div>
  </div>`;
}

function render(data){
  const pre = data.status === "pregame";
  ls.dataset.status = data.status;
  document.getElementById("lsWeek").textContent = "WEEK " + data.week;
  document.getElementById("lsState").textContent =
    data.status === "live" ? "LIVE" : data.status === "final" ? "FINAL" : "PRESEASON";

  /* label the projections so nobody reads them as points already scored */
  document.getElementById("lsSect").innerHTML =
    pre ? 'Matchups <b>— projected</b>' : "Matchups";

  track.innerHTML = (data.matchups || []).map(m => {
    const homeUp = m.home.score >= m.away.score;
    return `<div class="ls__game" role="listitem">
      ${teamRow(m.home, homeUp && !pre, pre)}
      <span class="ls__hair"></span>
      ${teamRow(m.away, !homeUp && !pre, pre)}
    </div>`;
  }).join("");

  const b = data.bonus || {};
  races.innerHTML = race(b.category) + race(b.high);

  /* the feed's own write time, not the moment the browser fetched it: if the
     cron stalls, re-fetching the same stale file must not reset the clock */
  const stamp = Date.parse(data.updated || "");
  updated = isNaN(stamp) ? Date.now() : stamp;
  hasData = true;
  status = data.status;
  tickAgo();
  edges();
  fitToBox();
}

/* Flood from wherever the pointer crossed the edge, and drain back toward
   wherever it left. Falls back to a centred bloom if this never runs. */
function sgxInit(){
  var btn = document.querySelector('.sgx');
  if (!btn || btn.dataset.sgxBound) return;
  var flood = btn.querySelector('.sgx-flood');
  if (!flood) return;
  btn.dataset.sgxBound = '1';

  function jitter(e){
    var r = btn.getBoundingClientRect();
    var x = e.clientX - r.left;
    var y = e.clientY - r.top;

    // radius that still covers the far corner from this entry point
    var far = Math.max(
      Math.hypot(x, y),
      Math.hypot(r.width - x, y),
      Math.hypot(x, r.height - y),
      Math.hypot(r.width - x, r.height - y)
    );
    btn.style.setProperty('--sgx-rmax', (far * 1.06) + 'px');

    // three lobes scattered around the entry point
    var spread = r.height * 0.55;
    for (var i = 1; i <= 3; i++){
      var ox = i === 1 ? 0 : (Math.random() - 0.5) * spread * 2;
      var oy = i === 1 ? 0 : (Math.random() - 0.5) * spread;
      flood.style.setProperty('--x' + i, (x + ox) + 'px');
      flood.style.setProperty('--y' + i, (y + oy) + 'px');
      flood.style.setProperty('--f' + i, i === 1 ? 1 : (0.48 + Math.random() * 0.42).toFixed(2));
    }
  }

  btn.addEventListener('pointerenter', jitter);
  btn.addEventListener('pointerleave', jitter);   // drain toward the exit point

  /* Touch devices never hover, so a tap used to show a speck of the flood
     before the link took over. Play it from the finger, then follow. */
  var noHover = window.matchMedia && matchMedia('(hover: none)').matches;
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var leaving = false;
  btn.addEventListener('click', function(e){
    if (!noHover || reduced || leaving) return;   // desktop keeps the hover behaviour
    e.preventDefault();
    jitter(e);                                    // flood from where the finger landed
    btn.classList.add('is-flooding');
    leaving = true;                               // second pass falls through to the link
    setTimeout(function(){ btn.click(); }, 620);
  });
}
sgxInit();

/* Scale the widget down until it fits the box height. The width is divided
   by the same factor first, so the scaled result still fills the box edge to
   edge instead of leaving gutters. Two passes: a wider layout can be shorter,
   so the first guess is usually too aggressive. */
const fit = document.getElementById("lsFit");
function fitToBox(){
  if (!FIT_TO_BOX || !fit) return;
  fit.style.width = "100%";
  fit.style.transform = "none";

  const avail = window.innerHeight;
  let natural = ls.getBoundingClientRect().height;
  if (!avail || !natural || natural <= avail + 1) return;   // already fits

  let s = Math.max(MIN_SCALE, avail / natural);
  fit.style.width = (100 / s) + "%";
  fit.style.transform = "scale(" + s + ")";

  const relaid = ls.getBoundingClientRect().height / s;
  if (relaid > 0 && Math.abs(relaid - natural) > 2){
    natural = relaid;
    s = Math.min(1, Math.max(MIN_SCALE, avail / natural));
    fit.style.width = (100 / s) + "%";
    fit.style.transform = "scale(" + s + ")";
  }
}
window.addEventListener("resize", fitToBox);

function tickAgo(){
  const ago = document.getElementById("lsAgo");
  /* stays hidden until a feed actually lands, so a failed fetch can never
     read as "updated just now" over stale or empty content */
  if (!hasData) { ago.hidden = true; return; }
  ago.hidden = false;
  const m = Math.floor((Date.now() - updated) / 60000);
  let t;
  if (m < 1)       t = "updated just now";
  else if (m === 1) t = "updated 1 min ago";
  else if (m < 60)  t = "updated " + m + " min ago";
  else {
    const h = Math.floor(m / 60);
    t = "updated " + h + (h === 1 ? " hr" : " hrs") + " ago";
  }
  ago.textContent = t;
}
setInterval(tickAgo, 30000);

function edges(){
  const max = track.scrollWidth - track.clientWidth;
  const left = track.scrollLeft > 4, right = track.scrollLeft < max - 4;
  track.dataset.overflow = left && right ? "both" : left ? "left" : right ? "right" : "none";
}
track.addEventListener("scroll", edges, { passive:true });
window.addEventListener("resize", edges);

/* --- both feeds, merged --- */
async function grab(url){
  const res = await fetch(url + (url.indexOf("?") < 0 ? "?t=" : "&t=") + Date.now(), { cache:"no-store" });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

async function load(){
  const [s, b] = await Promise.allSettled([grab(SCORE_SOURCE), grab(BONUS_SOURCE)]);
  const scores = s.status === "fulfilled" ? s.value : null;
  const bonus  = b.status === "fulfilled" ? (b.value.live || null) : null;

  if (!scores && !bonus) { if (DEMO) render(demoData()); return; }

  render({
    week:   scores ? scores.week   : bonus.week,
    status: scores ? scores.status : (bonus.state === "final" ? "final" : "live"),
    matchups: scores ? scores.matchups : [],
    bonus: bonus ? { category: bonus.category, high: bonus.high } : null
  });
}
load();
setInterval(load, REFRESH_MS);
