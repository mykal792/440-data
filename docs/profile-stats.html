<!--
  440 & Friends - player profile blocks. Two blocks, one file:

    profile-stats.html?p=schilling                  header + 2026 season
    profile-stats.html?p=schilling&block=career     career stats

  Reads docs/profiles/<p>.json (build_profiles.py, refreshed by the live
  workflow), docs/avatars-profile/<p>.svg (the framed avatar art) and
  docs/songs/<p>.mp3 (the team song behind the play button).

  Everything is drawn as one SVG in the Illustrator artboards' own
  coordinates (2026_Stats_-_Profile.svg, 406.02 wide; Profile_Desktop.svg /
  Profile_Mobile.svg for the career boxes), so boxes, radii, strokes and
  baselines are copied from the artwork and scale with the Wix block.

  Each block is its own rounded panel. The panel's corner radius is the
  white cards' radius plus the gap between card and panel edge, so the
  outer and inner corners are concentric.

  The team name comes from Yahoo every week and links to the team's Yahoo
  page, so a rename shows up on its own. The blank space right of the
  avatar is left for the three Wix pop-up buttons laid over the block.
-->

// ---- scrolling ---------------------------------------------------------------
// A list longer than its card (4+ high scores, 5+ weekly bonuses) scrolls
// inside the card: wheel, trackpad or a finger drag, with a thin scrollbar.
// The block is SVG, so this is a clipped group moved by hand, in artboard units.
function scroller(g, box, axis, contentLen, bar, state){
  // box: [x, y, w, h] visible window; axis "y" or "x"; contentLen: full length;
  // bar: {track, thumb} rect attrs or null; state: {get, set} to keep the offset
  var id = "clip" + Math.random().toString(36).slice(2, 8);
  var cp = el("clipPath", {id: id}, g);
  el("rect", {x: box[0], y: box[1], width: box[2], height: box[3]}, cp);
  var outer = el("g", {"clip-path": "url(#" + id + ")"}, g);
  el("rect", {x: box[0], y: box[1], width: box[2], height: box[3], fill: "#fff", "fill-opacity": 0,
              style: "touch-action:" + (axis === "y" ? "none" : "pan-y")}, outer);
  var inner = el("g", {}, outer);
  var view = axis === "y" ? box[3] : box[2], max = Math.max(0, contentLen - view), off = 0;
  if (!max) return inner;
  var track, thumb, tlen, thl;
  if (bar) {
    track = el("rect", bar.track, g); thumb = el("rect", bar.thumb, g);
    tlen = axis === "y" ? bar.track.height : bar.track.width;
    thl = Math.max(tlen * view / contentLen, 8);
    thumb.setAttribute(axis === "y" ? "height" : "width", thl);
  }
  var set = function(v){
    off = Math.max(0, Math.min(max, v));
    if (state) state.set(off);
    inner.setAttribute("transform", axis === "y" ? "translate(0," + (-off) + ")" : "translate(" + (-off) + ",0)");
    if (bar) thumb.setAttribute(axis === "y" ? "y" : "x", (axis === "y" ? bar.track.y : bar.track.x) + (tlen - thl) * off / max);
  };
  set(state ? state.get() : 0);
  var svg = g.ownerSVGElement, unit = function(){        // screen px -> artboard units
    return svg.viewBox.baseVal.width / svg.getBoundingClientRect().width;
  };
  outer.addEventListener("wheel", function(e){
    var d = (axis === "y" ? e.deltaY : (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY)) * unit();
    var before = off; set(off + d);
    if (off !== before) e.preventDefault();               // let the page scroll once we hit an end
  }, {passive: false});
  // drag to scroll; a drag of more than a few pixels swallows the click that
  // follows, so dragging the year bar doesn't also pick a year
  var start = null, moved = false;
  outer.addEventListener("pointerdown", function(e){ start = {p: axis === "y" ? e.clientY : e.clientX, o: off, id: e.pointerId}; moved = false; });
  outer.addEventListener("pointermove", function(e){
    if (!start) return;
    var d = (axis === "y" ? e.clientY : e.clientX) - start.p;
    if (!moved && Math.abs(d) > 4) { moved = true; try { outer.setPointerCapture(start.id); } catch (x) {} }
    if (moved) set(start.o - d * unit());
  });
  var end = function(){ start = null; };
  outer.addEventListener("pointerup", end);
  outer.addEventListener("pointercancel", end);
  outer.addEventListener("click", function(e){ if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  outer.style.cursor = "grab";
  return inner;
}

  txt(g, "num", x + 11.39, y + 55.58, "s", money(s.bank), {fill: ART.money});
  var sum = function(t){ return b.filter(function(q){ return q.type === t; })
                                  .reduce(function(a2, q){ return a2 + (q.amount || 0); }, 0); };
  var parts = [{k: "WEEKLY BONUS", t: "category", v: sum("category"), c: ART.bonus},
               {k: "HIGH SCORE",   t: "high",     v: sum("high"),     c: ART.high},
               {k: "DOT POT",      t: "dot",      v: sum("dot"),      c: ART.dot}];
  // legend with how many of each were won: WEEKLY BONUS - 3
  var cnt = function(t){ return b.filter(function(q){ return q.type === t; }).length; };
  var lx = x + w - 70.65;
  parts.forEach(function(pt, j){
    el("circle", {cx: lx, cy: y + 37.8 + j * 7.815, r: 2.15, fill: pt.c}, g);
    txt(g, "tiny", lx + 5.01, y + 39.5 + j * 7.83, "s", pt.k + " - " + cnt(pt.t));
  });
  var bx = x + 10.74, bw = w - 20.83, by = y + 70.59, bh = 13.67;
  var total = parts.reduce(function(a2, q){ return a2 + q.v; }, 0);
  var id = "bar" + Math.random().toString(36).slice(2, 8);
  var clip = el("clipPath", {id: id}, g);
  el("rect", {x: bx, y: by, width: bw, height: bh, rx: 4.85}, clip);
  var bg = el("g", {"clip-path": "url(#" + id + ")"}, g);
  el("rect", {x: bx, y: by, width: bw, height: bh, fill: C.div}, bg);
  var cxb = bx;
  parts.forEach(function(pt){
    if (!pt.v) return;

    if (lt.getComputedTextLength() * STY.bar.sx + 5 > sw) g.removeChild(lt);
    cxb += sw;
  });
}

function highScoresCard(g, x, y, w, s){
  var b = s.bonuses || [], res = {};
  (s.results || []).forEach(function(r){ res[r.week] = r; });
  card(g, x, y, w, 94.04, 10.8);
  txt(g, "lab", x + 17.67, y + 15.81, "s", "HIGH SCORES");
  var highs = b.filter(function(q){ return q.type === "high"; }).sort(function(a1, b1){ return a1.week - b1.week; });
  txt(g, "cnt", x + w - 17.4, y + 15.82, "e", String(highs.length));
  rule(g, x + 10.46, x + w - 9.92, y + 23.19);
  var pitch = 18.175, first = 38.53;
  // rows past the third scroll; the window is the three rows' band
  var list = highs.length > 3
    ? scroller(g, [x + 4, y + 27.4, w - 8, 56.2], "y", (highs.length - 3) * pitch + 56.2,
               {track: {x: x + w - 7.3, y: y + 30.5, width: 2.2, height: 50, rx: 1.1, fill: "#f0f0f0"},
                thumb: {x: x + w - 7.3, y: y + 30.5, width: 2.2, height: 10, rx: 1.1, fill: "#c4c4c4"}})
    : g;
  var rowsN = Math.max(3, highs.length);
  for (var k = 0; k < rowsN; k++) {
    var cy = y + first + k * pitch, h = highs[k];
    if (h) {
      el("circle", {cx: x + 17.21, cy: cy, r: 5.23, fill: "#333"}, list);
      el("path", {d: STAR, fill: "#8aebc1", transform: "translate(" + (x + 17.21 - 34.1) + "," + (cy - 467.9) + ")"}, list);
      var wk = res[h.week];
      txt(list, "cnt", x + 29.17, cy + 3.49, "s", "WK " + h.week);
      if (wk) txt(list, "sub3", x + 63.35, cy + 3.26, "s", "VS " + wk.opponent_name);
      txt(list, "cnt", x + w - 17.63, cy + 3.49, "e", wk ? wk.points.toFixed(2) : "");
    } else {                                   // placeholder row, as drawn in the art
      el("circle", {cx: x + 17.21, cy: cy, r: 5.23, fill: C.div}, list);
      el("circle", {cx: x + 17.21, cy: cy, r: 4.48, fill: "#e4e4e4"}, list);
      [[30.04, 28.11], [65.26, 28.11], [w - 19.79 - 28.11, 28.11]].forEach(function(pl){
        el("rect", {x: x + pl[0], y: cy - 3.72, width: pl[1], height: 7.44, rx: 3.72, fill: "#e4e4e4"}, list);
      });
    }
  }
}

function dotPotCard(g, x, y, w, s, perRow){

  var nd = Math.max(16, dots.length), rows, rowGap = 17.2, h;
  var cardAt = el("g", {}, g);                       // card drawn once its height is known
  txt(g, "lab", x + 15.08, y + 18.01, "s", "DOT POT");

  var dp = Math.min(22.24, (w - 20.81 - 18.71) / (per - 1)), rd = Math.min(6.66, dp / 2 - 1.2);
  card(cardAt, x, y, w, h, 10.8);
  var rowW = (per - 1) * dp, x0 = perRow >= 999 ? x + 20.81 : x + (w - rowW) / 2;

// formatting
function rank(r){ return r ? "RANK: #" + r : ""; }
function dec2(n){ return n === null || n === undefined ? "-" : n.toFixed(2); }
function money(n){
  if (n === null || n === undefined) return "-";
  var s = Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (n < 0 ? "-$" : "$") + s;
}
function rec(o){ return o.wins + "-" + o.losses + (o.ties ? "-" + o.ties : ""); }
function pct(n){ return n >= 1 ? "1.000" : n.toFixed(3).replace(/^0/, ""); }
function vs(r){ return r ? r.season + " VS " + r.opponent_name : ""; }
function ord(n){
  if (!n) return "-";
  var s = ["TH","ST","ND","RD"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

                  year: c.combined ? String(c.combined.season) : "",
                  sub3: c.combined ? (p.name || "").toUpperCase() + " " + dec2(c.combined.points) + "  -  " + c.combined.opponent_name.toUpperCase() + " " + dec2(c.combined.opp_points) : ""},

// ---------------------------------------------------------------------------
// SEASON HISTORY (Season_History_All.svg / Season_History_By_Year.svg).
// One fixed-height block: a year bar that scrolls sideways, an ALL view (the
// year-by-year table) and a view per season (stats, schedule, bank, bonus,
// high/low). Anything longer than its card scrolls inside the card.
// ---------------------------------------------------------------------------
var HIST = {sel: "all", scroll: {}};
STY.hW   = {size: 12.91, fill: "#333",    ls: 0.5};    // 9 — 6 in the table
STY.hAvg = {size: 9.13,  fill: "#333",    ls: 0.2};    // 121.59
STY.hHd  = {size: 6.6,   fill: "#333",    ls: 0.45};   // YEAR  W — L  PA ...
STY.hFin = {size: 7.8,   fill: "#333",    ls: 0.38};   // finish number
STY.sWk  = {size: 8.03,  fill: "#333",    ls: 0.35};   // WEEK 1
STY.sSc  = {size: 8.2,   fill: "#333",    ls: 0.28};   // 119.04
STY.sWL  = {size: 13.1,  fill: "#333",    ls: 0};      // W / L in the schedule
STY.sOpp = {size: 5.09,  fill: "#bababa", ls: 0.17};   // VS GANGUS, 137.48
var CHECK = function(cx, cy){ return "M" + (cx - 2.11) + "," + (cy + 1.24) + " l1.57,1.57 l3.12,-4.99"; };

// scroll offsets survive the redraw that a click triggers
function keep(key){ return {get: function(){ return HIST.scroll[key] || 0; }, set: function(v){ HIST.scroll[key] = v; }}; }

function yearTabs(g, p, L){
  var seasons = p.seasons || [];
  var tabs = [{k: "all", label: "ALL"}].concat(seasons.map(function(s){ return {k: s.season, label: String(s.season),
    place: s.in_progress ? null : s.finish}; }));
  var len = tabs.length * L.tabPitch - (L.tabPitch - L.tabW);
  var row = len > L.tabRoom
    ? scroller(g, [L.tabX - 2, L.tabY - 2, L.tabRoom + 4, L.tabH + 4], "x", len + 4, null, keep("tabs"))
    : g;
  tabs.forEach(function(t, i){
    var x = L.tabX + i * L.tabPitch, on = HIST.sel === t.k;
    var tg = el("g", {style: "cursor:pointer"}, row);
    el("rect", {x: x, y: L.tabY, width: L.tabW, height: L.tabH, rx: L.tabH / 2, fill: "#fff",
                stroke: on ? "#bababa" : "none", "stroke-width": 2}, tg);
    var cx = x + L.tabW / 2;
    var medal = {1: "#f6c835", 2: "#e2e2e2", 3: "#cd905e"}[t.place];
    if (medal) {                                 // gold / silver / bronze: a trophy that year
      el("circle", {cx: x + 9.36, cy: L.tabY + 10.15, r: 2.57, fill: medal}, tg);
      cx += 3.03;
    }
    txt(tg, "lab", cx, L.tabY + 12.72, "m", t.label);
    tg.addEventListener("click", function(){
      HIST.sel = t.k; HIST.scroll.table = 0; HIST.scroll.sched = 0; render();
    });
  });
}

// ---- ALL: the year-by-year table ---------------------------------------------------
function allTable(g, p, L){
  var seasons = p.seasons || [], T = L.table;
  card(g, T.x, T.y, T.w, T.h, 10.8);
  var c = T.col, HD = T.head;
  // column titles, fixed above the scrolling rows
  var hy = T.y + 15.6, hs = T.fs ? {"font-size": 5.5, "letter-spacing": 0.3} : null;
  txt(g, "hHd", c.yr, hy, "m", "YEAR", hs);
  var wc = c.dash - (c.l - c.dash) - 4.6, lc = c.l + 4.6;   // W and L column centers
  txt(g, "hHd", wc, hy, "m", "W", hs);
  el("line", {x1: c.dash - 4.85, x2: c.dash + 4.85, y1: hy - 2.4, y2: hy - 2.4, stroke: "#a2a0a0", "stroke-width": 1.5, "stroke-linecap": "round"}, g);
  txt(g, "hHd", lc, hy, "m", "L", hs);
  txt(g, "hHd", c.po, hy, "m", "PA", hs);
  txt(g, "hHd", c.avg, hy, "m", "AVG PTS", hs);
  if (c.ag) txt(g, "hHd", c.ag, hy, "m", "PTS AG", hs);
  txt(g, "hHd", c.fin, hy, "m", "FINISH", hs);
  el("line", {x1: T.x + 10.5, x2: T.x + T.w - 10.5, y1: T.y + HD - 1.5, y2: T.y + HD - 1.5, stroke: "#8f8f8f", "stroke-width": 2.2, "stroke-linecap": "round"}, g);
  var boxH = T.h - HD - 3;
  if (T.fill) {                     // mobile: spread the rows to fill the card, then scroll
    var pitch = Math.max(T.pitch, Math.min(T.fill, (boxH - 8) / Math.max(seasons.length, 1)));
    T = Object.create(T); T.pitch = pitch; T.first = T.y + HD + pitch / 2 + 0.8;
  }
  var len = seasons.length * T.pitch + 8;
  var list = len > boxH
    ? scroller(g, [T.x + 2, T.y + HD, T.w - 4, boxH], "y", len, {
        track: {x: T.x + T.w - 7.3, y: T.y + HD + 6, width: 2.2, height: boxH - 16, rx: 1.1, fill: "#f0f0f0"},
        thumb: {x: T.x + T.w - 7.3, y: T.y + HD + 6, width: 2.2, height: 10, rx: 1.1, fill: "#c4c4c4"}}, keep("table"))
    : g;
  var PW = T.pill ? T.pill[0] : 39.78, PH = T.pill ? T.pill[1] : 16.8;
  seasons.forEach(function(s, i){
    var cy = T.first + i * T.pitch, done = !s.in_progress;
    var rg = el("g", {style: "cursor:pointer"}, list);
    el("rect", {x: T.x + 4, y: cy - T.pitch / 2, width: T.w - 8, height: T.pitch, fill: "#fff"}, rg);
    el("rect", {x: c.yr - PW / 2, y: cy - PH / 2, width: PW, height: PH, rx: PH / 2, fill: "#e2e2e2"}, rg);
    txt(rg, "lab", c.yr, cy + (T.pill ? T.pill[2] * 0.34 : 2.37), "m", String(s.season), T.pill ? {"font-size": T.pill[2], "letter-spacing": 0.2} : null);
    var fw = T.fs ? {"font-size": T.fs.w, "letter-spacing": 0.3} : null, fa = T.fs ? {"font-size": T.fs.avg, "letter-spacing": 0.1} : null;
    txt(rg, "hW", wc, cy + 5.14, "m", String(s.wins), fw);
    el("line", {x1: c.dash - 4.85, x2: c.dash + 4.85, y1: cy, y2: cy, stroke: "#a2a0a0", "stroke-width": 1.5, "stroke-linecap": "round"}, rg);
    txt(rg, "hW", lc, cy + 5.14, "m", String(s.losses), fw);
    if (!done) el("circle", {cx: c.po, cy: cy, r: 8.4, fill: "#e2e2e2"}, rg);   // season still going
    if (done) {
      el("circle", {cx: c.po, cy: cy, r: 8.4, fill: s.playoffs ? ART.green : "#e2e2e2"}, rg);
      if (s.playoffs) el("path", {d: CHECK(c.po, cy), fill: "none", stroke: "#000", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round"}, rg);
      else el("path", {d: "M" + (c.po + 2.37) + "," + (cy - 2.37) + " l-4.73,4.73 M" + (c.po + 2.37) + "," + (cy + 2.37) + " l-4.73,-4.73",
                       stroke: "#000", "stroke-width": 2, "stroke-linecap": "round"}, rg);
    }
    txt(rg, "hAvg", c.avg, cy + 4.0, "m", dec2(s.avg), fa);
    if (c.ag) txt(rg, "hAvg", c.ag, cy + 4.0, "m", dec2(s.avg_against), fa);
    if (done) {
      var f = s.finish;
      el("circle", {cx: c.fin, cy: cy, r: 8.4, fill: f === 1 ? "#f6c835" : f === 2 ? "#a2a0a0" : f === 3 ? "#cd905e" : "#e2e2e2"}, rg);
      txt(rg, "hFin", c.fin, cy + 2.83, "m", String(f), {fill: f === 2 ? "#fff" : "#333"});
    } else {
      txt(rg, "sOpp", c.fin, cy + 1.8, "m", "LIVE", {fill: ART.money, "font-size": 6});
    }
    if (i < seasons.length - 1)
      el("line", {x1: T.x + 17.6, x2: T.x + T.w - 17.72, y1: cy + T.pitch / 2 - 0.72, y2: cy + T.pitch / 2 - 0.72, stroke: C.div, "stroke-width": 1.5, "stroke-linecap": "round"}, rg);
    rg.addEventListener("click", function(){ HIST.sel = s.season; HIST.scroll.sched = 0; render(); });
  });
}

// ---- one season ----------------------------------------------------------------------
function scheduleCard(g, x, y, w, h, s){
  card(g, x, y, w, h, 10.8);
  txt(g, "lab", x + 12.49, y + 14.3, "s", s.season + " SCHEDULE");
  rule(g, x + 7.36, x + w - 7.61, y + 21.75);
  var pitch = 35.665, len = s.games.length * pitch + 4, top = y + 28.62;
  var list = len > h - 32
    ? scroller(g, [x + 3, y + 25.5, w - 6, h - 29], "y", len + 3.1, {
        track: {x: x + w - 6.2, y: y + 30, width: 2.2, height: h - 38, rx: 1.1, fill: "#f0f0f0"},
        thumb: {x: x + w - 6.2, y: y + 30, width: 2.2, height: 10, rx: 1.1, fill: "#c4c4c4"}}, keep("sched"))
    : g;
  var tw = w - 14.97;
  s.games.forEach(function(gm, i){
    var ty = top + i * pitch, tx = x + 7.36;
    var tg = el("g", {}, list);
    var po = gm.type !== "regular";
    el("rect", {x: tx, y: ty, width: tw, height: 30.14, rx: 7.91, fill: po ? "#fbf6e4" : "#f6f6f6"}, tg);
    el("rect", {x: tx + 4.28, y: ty + 3.84, width: 22.46, height: 22.46, rx: 4.11,
                fill: gm.result === "W" ? ART.green : gm.result === "T" ? "#f6c835" : "#e4e4e4"}, tg);
    txt(tg, "sWL", tx + 15.51, ty + 19.33, "m", gm.result);
    var lab = gm.type === "regular" ? "WEEK " + gm.week : gameLabel(s, gm);
    txt(tg, "sWk", tx + 34.69, ty + 15.06, "s", lab, po ? {fill: "#b68a00"} : null);
    txt(tg, "sOpp", tx + 34.66, ty + 22.47, "s", "VS " + gm.opponent_name);
    var sc = txt(tg, "sSc", tx + tw - 6.53, ty + 15.07, "e", gm.points.toFixed(2));
    txt(tg, "sOpp", tx + tw - 6.52, ty + 22.47, "e", gm.opp_points.toFixed(2));
    if (gm.high_score) {
      var scx = tx + tw - 6.53 - sc.getComputedTextLength() - 10.57 + 0.4, scy = ty + 11.76;
      el("circle", {cx: scx, cy: scy, r: 5.23, fill: "#333"}, tg);
      el("path", {d: STAR, fill: "#8aebc1", transform: "translate(" + (scx - 34.1) + "," + (scy - 467.9) + ")"}, tg);
    }
  });
}
function gameLabel(season, gm){
  if (gm.type === "consolation") return "CONSOLATION";
  var po = season.games.filter(function(q){ return q.type === "playoff"; });
  if (po.indexOf(gm) === 0) return "SEMIFINAL";
  return po[0] && po[0].result === "L" ? "3RD PLACE" : "FINAL";
}

function seasonBank(g, x, y, w, s, live, p){
  // Live season: the ledger. Past seasons: prize-history.json, where the third
  // row is Squid Game + DraftKings (there was no Dot Pot before 2026).
  card(g, x, y, w, 94.05, 10.8);
  txt(g, "lab", x + 14.12, y + 13.13, "s", "BANK");
  var buyIn = live ? p.season.buy_in : (s.buy_in !== undefined ? s.buy_in : null);
  txt(g, "sub3", x + 13.82, y + 20.5, "s", "BUY IN: " + (buyIn !== null && buyIn !== undefined ? "$" + buyIn : "-"));
  var b = live ? (p.season.bonuses || []) : (s.bonuses || null);
  txt(g, "rank", x + w - 16.05, y + 13.81, "e", live ? rank((p.season.ranks || {}).bank) : (s.ranks && s.ranks.bank ? rank(s.ranks.bank) : ""));
  var sum = function(t){ return (b || []).filter(function(q){ return q.type === t; }).reduce(function(a, q){ return a + (q.amount || 0); }, 0); };
  var parts = [{k: "WEEKLY BONUS", v: sum("category"), c: ART.bonus},
               {k: "HIGH SCORE",   v: sum("high"),     c: ART.high},
               live ? {k: "DOT POT", v: sum("dot"), c: ART.dot}
                    : {k: "SIDE GAMES", v: sum("squid") + sum("dk") + sum("thanksgiving"), c: COL.TE},
               {k: "PLAYOFF",      v: sum("playoff"),  c: live ? COL.TE : ART.dot}];
  // legend with each category's dollars ("PLAYOFF: $500"), right-aligned to
  // the card; the big total shrinks if it would run into the legend
  var cash = function(v){ return "$" + (v % 1 ? v.toFixed(2) : String(v)); };
  var lg = el("g", {}, g), lw = 0;
  parts.forEach(function(pt, j){
    el("circle", {cx: 0, cy: y + 29.54 + j * 7.9, r: 2.15, fill: pt.c}, lg);
    var lt = txt(lg, "tiny", 5.01, y + 31.25 + j * 7.9, "s", pt.k + ": " + (b ? cash(pt.v) : "-"));
    lw = Math.max(lw, lt.getComputedTextLength());
  });
  var lx = Math.min(x + w - 63.32, x + w - 13 - 5.01 - lw);
  lg.setAttribute("transform", "translate(" + lx + ",0)");
  var total = parts.reduce(function(a, q){ return a + q.v; }, 0);
  var all = (b || []).reduce(function(a, q){ return a + (q.amount || 0); }, 0);
  var big = txt(g, "num", x + 11.38, y + 55.59, "s", b ? money(all) : "-", {fill: ART.money});
  var room = lx - 2.15 - 6 - (x + 11.38), bw0 = big.getComputedTextLength() * (STY.num.sx || 1);
  if (bw0 > room) big.setAttribute("font-size", (STY.num.size * room / bw0).toFixed(2));
  var bx = x + 10.74, bw = w - 20.83, by = y + 70.59, bh = 13.67;
  var id = "hb" + Math.random().toString(36).slice(2, 8);
  var clip = el("clipPath", {id: id}, g);
  el("rect", {x: bx, y: by, width: bw, height: bh, rx: 4.85}, clip);
  var bg = el("g", {"clip-path": "url(#" + id + ")"}, g);
  el("rect", {x: bx, y: by, width: bw, height: bh, fill: C.div}, bg);
  var cx = bx;
  parts.forEach(function(pt){
    if (!pt.v) return;
    var sw = bw * pt.v / total;
    el("rect", {x: cx, y: by, width: sw + 0.2, height: bh, fill: pt.c}, bg);
    var lt = txt(g, "bar", cx + sw / 2, y + 80.32, "m", "$" + (Math.round(pt.v * 100) / 100));
    if (lt.getComputedTextLength() * STY.bar.sx + 5 > sw) g.removeChild(lt);
    cx += sw;
  });
}

function hiLoSmall(g, x, y, w, label, v, rk, ri){

}

    var ry = boxY + 2 + i * rowH, cy = ry + rowH / 2, m = x.points - x.opp_points, po = x.type === "playoff";
    if (i) el("line", {x1: rx + 14, x2: rx + rw - 16, y1: ry, y2: ry, stroke: "#f0f0f0", "stroke-width": 1}, lg);
    el("rect", {x: rx + 14, y: cy - 7, width: 14, height: 14, rx: 3.7,
                fill: x.result === "W" ? VS_G : x.result === "T" ? "#f6c835" : ART.lossFill}, lg);
    txt(lg, "wl", rx + 21, cy + 3.1, "m", x.result, {"font-size": 7.6});
    // year in bold; the week (or PLAYOFF / CHAMP) smaller beside it
    var yt = txt(lg, "vsg", rx + 36, cy + 2.9, "s", String(x.season));
    txt(lg, "vsl", rx + 36 + yt.getComputedTextLength() * STY.vsg.sx + 5, cy + 2.3, "s", gameTag(x),
        {fill: po ? VS_GOLD : "#a2a0a0", "font-size": 5.6});
    txt(lg, "vsg", rx + rw * 0.63, cy + 2.9, "m", x.points.toFixed(2) + " - " + x.opp_points.toFixed(2));
    txt(lg, "vsg", rx + rw - 16, cy + 2.9, "e", signed(m), {fill: m >= 0 ? VS_GT : VS_R});
  });
}

function draw(p){
  var root = document.getElementById("root");
  root.innerHTML = "";
  if (block === "career") {
    // Career Stats and Season History share one Wix block: the two panels
    // stacked, with a gap between them in the same units as the art
    var mob = root.clientWidth < 500;
    drawCareer(root, p, mob ? MOB : DESK);
    var n = root.children.length;
    drawPlayoffs(root, p, mob);
    drawHistory(root, p, mob);
    // one gray panel: square off the corners where the two meet
    function corners(svg, top, bottom){
      var r = svg && svg.querySelector('rect[fill="var(--panel)"]');
      if (!r) return;
      var x = +r.getAttribute("x"), y = +r.getAttribute("y"), w = +r.getAttribute("width"), h = +r.getAttribute("height"), R = +r.getAttribute("rx");
      var a = top ? R : 0, b = bottom ? R : 0;
      var d = "M" + x + "," + (y + a) + (a ? " A" + a + "," + a + " 0 0 1 " + (x + a) + "," + y : "") +
              " H" + (x + w - a) + (a ? " A" + a + "," + a + " 0 0 1 " + (x + w) + "," + (y + a) : "") +
              " V" + (y + h - b) + (b ? " A" + b + "," + b + " 0 0 1 " + (x + w - b) + "," + (y + h) : "") +
              " H" + (x + b) + (b ? " A" + b + "," + b + " 0 0 1 " + x + "," + (y + h - b) : "") + " Z";
      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d); path.setAttribute("fill", "var(--panel)");
      r.parentNode.replaceChild(path, r);
    }
    var cs = root.children[n - 1], ps = root.children[n], hs = root.children[n + 1];
    corners(cs, true, false); corners(ps, false, false); corners(hs, false, true);
    // pull each section up over the one above's bottom padding, so the gap
    // above every heading matches the gap under it
    [ps, hs].forEach(function(sv){
      if (sv) sv.style.marginTop = "calc(" + (-15 / (mob ? 254.33 : 406.02) * 100) + "% - 1px)";
    });
  }
  else if (block === "history") drawHistory(root, p, root.clientWidth < 500);
  else if (block === "bonus") drawBonus(root, p, root.clientWidth < 500);
  else if (block === "versus") drawVersus(root, p, root.clientWidth < 500);
  else drawProfile(root, p, who, root.clientWidth < 500);
}

var params = new URLSearchParams(location.search);
var who = (params.get("p") || "").toLowerCase().replace(/[^a-z]/g, "");
var block = (params.get("block") || "profile").toLowerCase();
var root = document.getElementById("root");
if (!who) {
  // Opened without a player - e.g. clicking the file itself on GitHub. The Wix
  // blocks always add ?p=, so this only shows when the file is viewed directly.
  root.innerHTML = '<div class="msg">This file draws one player\'s profile. Add ?p= and a manager to the address, e.g. profile-stats.html?p=schilling (add &amp;block=career or &amp;block=history for the other sections).</div>';
  return;
}

var data = null, lastW = 0;
function render(){ if (data) { lastW = root.clientWidth; draw(data); } }
document.fonts.load('10px "Rotundo"').then(function(){
  return fetch("profiles/" + who + ".json", {cache: "no-cache"});
}).then(function(r){
  if (!r.ok) throw new Error(r.status);
  return r.json();
}).then(function(p){ data = p; render(); })
  .catch(function(e){ root.innerHTML = '<div class="msg">Stats unavailable (' + who + ': ' + e.message + ')</div>'; });
window.addEventListener("resize", function(){
  if (!data) return;
  var w = root.clientWidth;
  if ((w < 500) !== (lastW < 500)) render();   // redraw only when crossing the breakpoint
});
})();
</script>
</body>
</html>
