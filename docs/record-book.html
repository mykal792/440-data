<title>The Hall of Records</title>
<!--
  440 & Friends - Record Book. One Wix embed:
      record-book.html
  Reads docs/records.json (build_records.py, refreshed by the live workflow)
  the round avatars in docs/avatars/, and the framed ones without an outline in
  docs/avatars-box/ (old framed art in docs/avatars-profile/ as a fallback).

  Drawn as one SVG in board units like profile-stats.html (desktop board
  406.02 wide, phone 254.33; under 500px = phone), so the block keeps one
  height-to-width ratio and scales with the Wix embed.

  THE HALL OF RECORDS header (Michael's art, redrawn) floating above the gray
  panel (?hdr=card puts it in its own white card instead).
  ALL-TIME STANDINGS: full width; tap a name to light up his rows in every
  record (and a green dot in the menu beside each record he's on). Under it,
  PLAYER SPOTLIGHT: the tapped manager's art and line, or faces to tap.
  BOX SCORE: under the records. In a single-game or playoff-game record,
  tap a row and its box score (docs/boxscores/<id>.json, pull_boxscores.py)
  shows here in Michael's box score layout, with the week on the ribbon.
  Fonts: Rotundo for names, titles and big numbers; Wix Made for Text for
  table figures and the small lines.
  RECORDS - desktop: left third = the menu (categories open to show their
  records); right two thirds = the picked record, up to 10 places, all rows
  the same size. Phone: a picker bar (opens the same menu in the record's
  place), the record, then previous / next (or swipe the record).
  Same look as the player profiles: Rotundo, gray subs, solid gray rules.
-->

<div id="root"></div>
<script>
(function(){
"use strict";

// ---- palette (Michael's swatches) --------------------------------------------
var K = {red: "#ed402e", orange: "#f4862c", mint: "#8aebc1", green: "#2eb57b", blue: "#0c9bd7",
         ink: "#333333", mid: "#bababa", light: "#e4e4e4", white: "#ffffff", gold: "#f2b705",
         silver: "#bababa", bronze: "#c08457"};
var GRID = {d: {L: 17.5, R: 389, G: 9.5}, m: {L: 16.61, R: 237.72, G: 10.5}};
var RIBBON = "M222.73,217.6c1.12-.83.47-2.48-.97-2.48H29.8c-1.44,0-2.09,1.65-.97,2.48l12.98,9.64-12.98,9.64c-1.12.83-.47,2.48.97,2.48h191.96c1.44,0,2.09-1.65.97-2.48l-12.98-9.64,12.98-9.64Z";
var RIB = {cx: 126.27, cy: 227.24, w: 194.9, h: 24.24};
var NO_ROUND = {patrick: 1, steve: 1, chipper: 1};          // no docs/avatars/<name>.svg

var NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent){
  var e = document.createElementNS(NS, name);
  for (var a in attrs) e.setAttribute(a, attrs[a]);
  if (parent) parent.appendChild(e);
  return e;
}
var ANCH = {s: "start", m: "middle", e: "end"};
function T(g, cls, x, y, anchor, str, size, fill, extra){
  var t = el("text", {x: x, y: y, "text-anchor": ANCH[anchor || "s"], "font-size": size, fill: fill || K.ink}, g);
  if (cls) t.setAttribute("class", cls);
  if (extra) for (var k in extra) t.setAttribute(k, extra[k]);
  t.textContent = str;
  return t;
}
// Safari leaves letter-spacing out of getComputedTextLength: measure the glyphs
function textW(t){
  var w = t.getComputedTextLength(), n = t.getNumberOfChars();
  try { if (n) w = Math.max(w, t.getEndPositionOfChar(n - 1).x - t.getStartPositionOfChar(0).x); } catch (e) {}
  try { w = Math.max(w, t.getBBox().width); } catch (e) {}
  return w;
}
function fitLine(t, w, min){                       // shrink to fit, then trim with an ellipsis
  var fs = parseFloat(t.getAttribute("font-size")) || 5, s = t.textContent;
  while (textW(t) > w && fs > min) { fs -= 0.1; t.setAttribute("font-size", fs); }
  while (textW(t) > w && s.length > 3) { s = s.slice(0, -1); t.textContent = s.replace(/\s+$/, "") + "…"; }
}
function rrect(g, x, y, w, h, rx, fill, extra){
  var r = el("rect", {x: x, y: y, width: w, height: h, rx: rx, ry: rx, fill: fill}, g);
  if (extra) for (var k in extra) r.setAttribute(k, extra[k]);
  return r;
}
function avatar(g, who, cx, cy, r){
  function initial(){
    el("circle", {cx: cx, cy: cy, r: r, fill: K.light}, g);
    T(g, null, cx, cy + r * 0.38, "m", (NAMES[who] || who).charAt(0), r * 1.05, K.mid);
  }
  function framed(){
    var id = "av" + Math.random().toString(36).slice(2, 8), cp = el("clipPath", {id: id}, g);
    el("circle", {cx: cx, cy: cy, r: r}, cp);
    var bg = el("circle", {cx: cx, cy: cy, r: r, fill: K.light}, g), k = 2.35 * r;
    var im = el("image", {href: "avatars-profile/" + who + ".svg", x: cx - k / 2, y: cy - k * 0.47, width: k, height: k, "clip-path": "url(#" + id + ")"}, g);
    im.addEventListener("error", function(){ im.remove(); bg.remove(); initial(); }, {once: true});
  }
  if (NO_ROUND[who]) { framed(); return; }
  var im = el("image", {href: "avatars/" + who + ".svg", x: cx - r, y: cy - r, width: 2 * r, height: 2 * r}, g);
  im.addEventListener("error", function(){ im.remove(); framed(); }, {once: true});
}

// ---- vertical scroller (from profile-stats.html: wheel, drag, touch with
// momentum, chunky bar; hands the swipe back to the page at either end) ------
var HEADER = (new URLSearchParams(location.search)).get("hdr") === "card" ? "card" : "float";
var MOB = false, STATE = {cat: 0, rec: 0, open: 0, menu: false, who: null, game: null, era: {}, scroll: {}};
function scroller(g, box, contentLen, barX, key){
  var id = "clip" + Math.random().toString(36).slice(2, 8);
  var cp = el("clipPath", {id: id}, g);
  el("rect", {x: box[0], y: box[1], width: box[2], height: box[3]}, cp);
  var outer = el("g", {"clip-path": "url(#" + id + ")"}, g);
  el("rect", {x: box[0], y: box[1], width: box[2], height: box[3], fill: "#fff", "fill-opacity": 0}, outer);
  var inner = el("g", {}, outer);
  var view = box[3], max = Math.max(0, contentLen - view), off = 0;
  if (!max) return inner;
  var w = 4.6, tlen = view, t0 = box[1], thl = Math.max(tlen * view / contentLen, 16);
  rrect(g, barX, t0, w, tlen, w / 2, "#efefef");
  var thumb = rrect(g, barX, t0, w, thl, w / 2, "#a2a0a0");
  var set = function(v){
    off = Math.max(0, Math.min(max, v)); STATE.scroll[key] = off;
    inner.setAttribute("transform", "translate(0," + (-off) + ")");
    thumb.setAttribute("y", t0 + (tlen - thl) * off / max);
  };
  set(STATE.scroll[key] || 0);
  var svg = g.ownerSVGElement, unit = function(){ return svg.viewBox.baseVal.width / svg.getBoundingClientRect().width; };
  var anim = null, stop = function(){ if (anim) cancelAnimationFrame(anim); anim = null; };
  outer.addEventListener("wheel", function(e){
    var before = off; stop(); set(off + e.deltaY * unit());
    if (off !== before) e.preventDefault();
  }, {passive: false});
  var start = null, moved = false;
  outer.addEventListener("pointerdown", function(e){
    if (e.pointerType === "touch") return;
    stop(); start = {p: e.clientY, o: off, id: e.pointerId}; moved = false;
  });
  outer.addEventListener("pointermove", function(e){
    if (!start || e.pointerType === "touch") return;
    var d = e.clientY - start.p;
    if (!moved && Math.abs(d) > 4) { moved = true; try { outer.setPointerCapture(start.id); } catch (x) {} }
    if (moved) set(start.o - d * unit());
  });
  var end = function(){ start = null; };
  outer.addEventListener("pointerup", end); outer.addEventListener("pointercancel", end);
  var Tt = null;
  outer.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) { Tt = null; return; }
    stop(); var t = e.touches[0];
    Tt = {x: t.clientX, y: t.clientY, o: off, mode: null, u: unit(), hist: [[t.clientY, Date.now()]]}; moved = false;
  }, {passive: true});
  outer.addEventListener("touchmove", function(e){
    if (!Tt || e.touches.length !== 1) return;
    var t = e.touches[0], dy = t.clientY - Tt.y, dx = t.clientX - Tt.x;
    if (!Tt.mode) {
      if (Math.abs(dy) < 6 && Math.abs(dx) < 6) return;
      var out = (dy > 0 && off <= 0) || (dy < 0 && off >= max);
      Tt.mode = Math.abs(dy) >= Math.abs(dx) && !out ? "list" : "page";
      if (Tt.mode === "list") { Tt.p = t.clientY; Tt.o = off; moved = true; }
    }
    if (Tt.mode !== "list") return;
    if (e.cancelable) e.preventDefault();
    set(Tt.o - (t.clientY - Tt.p) * Tt.u);
    Tt.hist.push([t.clientY, Date.now()]); if (Tt.hist.length > 6) Tt.hist.shift();
  }, {passive: false});
  outer.addEventListener("touchend", function(){
    if (!Tt) return;
    var h = Tt.hist, a = h[0], b = h[h.length - 1], dt = b[1] - a[1];
    if (Tt.mode === "list" && dt > 0 && Date.now() - b[1] < 80) {
      var v = -((b[0] - a[0]) / dt) * Tt.u, last = Date.now();
      var step = function(){
        var now = Date.now(), ms = now - last; last = now;
        set(off + v * ms); v *= Math.pow(0.995, ms);
        anim = (Math.abs(v) > 0.01 && off > 0 && off < max) ? requestAnimationFrame(step) : null;
      };
      anim = requestAnimationFrame(step);
    }
    Tt = null;
  });
  outer.addEventListener("click", function(e){ if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  return inner;
}

// ---- profile look: Rotundo everywhere, gray subs, solid gray rules ------------------
var C = {line: "#a2a0a0", div: "#e1e1e1", sub: "#a2a0a0", mint: "#acf0d2", tile: "#f3f3f3"};   // mint = #88e9bf, 30% lighter
function Wx(g, x, y, anchor, str, size, fill, bold, extra){        // Wix Made for Text: the secondary font
  return T(g, bold ? "wixb" : "wix", x, y, anchor, str, size, fill || K.ink, extra);
}
function R(g, x, y, anchor, str, size, fill, ls, extra){          // Rotundo text, profile letter-spacing
  var e = {"letter-spacing": ls === undefined ? size * 0.04 : ls};
  if (extra) for (var k in extra) e[k] = extra[k];
  return T(g, null, x, y, anchor, str, size, fill || K.ink, e);
}
function rule(g, x1, x2, y, w){
  el("line", {x1: x1, x2: x2, y1: y, y2: y, stroke: C.div, "stroke-width": w || 1.5, "stroke-linecap": "round"}, g);
}
function titledRule(g, left, right, y, label){                     // CAREER STATS-style section header
  var cx = (left + right) / 2, t = R(g, cx, y + 3.78, "m", label, 9.2, K.ink, 0.25), w = textW(t);
  el("line", {x1: left, x2: cx - w / 2 - 7.4, y1: y, y2: y, stroke: C.line, "stroke-width": 2, "stroke-linecap": "round"}, g);
  el("line", {x1: cx + w / 2 + 6.4, x2: right, y1: y, y2: y, stroke: C.line, "stroke-width": 2, "stroke-linecap": "round"}, g);
}
function pill(g, x, cy, w, h, fill){ return rrect(g, x, cy - h / 2, w, h, h / 2, fill); }

// ---- THE HALL OF RECORDS (Michael's header art, redrawn: 1865 x 348 artboard) ----
var HDR = {x0: 95, y0: 34, w: 1690, h: 272};
function header(g, x, y, w){
  var k = w / HDR.w, hg = el("g", {transform: "translate(" + x + "," + y + ") scale(" + k + ") translate(" + (-HDR.x0) + "," + (-HDR.y0) + ")"}, g);
  function arch(x1, top){                     // a squared-off bar with rounded corners, 71 wide outside, 12 stroke
    var a = x1 + 6, b = x1 + 65, r = 14, t = top + 6;
    el("path", {d: "M" + a + ",258 V" + (t + r) + " A" + r + "," + r + " 0 0 1 " + (a + r) + "," + t + " H" + (b - r) +
                   " A" + r + "," + r + " 0 0 1 " + b + "," + (t + r) + " V258",
                fill: "none", stroke: K.mid, "stroke-width": 12, "stroke-linecap": "round"}, hg);
  }
  [[111, 118], [202, 82], [293, 43], [1516, 43], [1607, 82], [1698, 118]].forEach(function(p){ arch(p[0], p[1]); });
  [[110, 364], [1515, 1769]].forEach(function(p){
    el("line", {x1: p[0], x2: p[1], y1: 292.5, y2: 292.5, stroke: K.ink, "stroke-width": 11, "stroke-linecap": "round"}, hg);
  });
  var top = T(hg, "laro5", 939.5, 100, "m", "THE HALL OF", 78, K.ink, {"letter-spacing": 7});
  top.setAttribute("font-size", 78 * 577 / textW(top));
  var rec = T(hg, null, 964, 272, "m", "RECORDS", 200, K.ink, {"letter-spacing": 4});
  rec.setAttribute("font-size", 200 * 998 / textW(rec));
  return HDR.h * k;
}

// ---- ALL-TIME STANDINGS: full width, tap a name to light him up everywhere ---------
function standings(g, x, y, w, S){
  var L = x + S.pad, Rr = x + w - S.pad, cols = S.cols(L, Rr);
  var h = S.head + 10 * S.rh + S.pad * 0.6;
  rrect(g, x, y, w, h, 10.8, K.white);

  var clear = el("g", {style: "cursor:pointer"}, g);
  clear.addEventListener("click", function(){ STATE.who = null; render(); });
  var tx, tY, cols, tW, gap;
  if (S.grid) {
    // phone: round face + name and line across the top, four tiles 2 x 2 across the full width
    var r = S.face2, fy = y + S.pad + r;
    el("circle", {cx: L + r, cy: fy, r: r + 1.2, fill: "#fff"}, clear);
    avatar(clear, who, L + r, fy, r);
    tx = L + 2 * r + 10;
    R(g, tx, fy - S.name * 0.25, "s", NAMES[who], S.name, K.ink, S.name * 0.03);
    Wx(g, tx, fy + S.line * 1.25, "s", ordinal(rank) + " ALL-TIME  ·  " + pctS(s.pct) + " WIN %", S.line, "#555", true);
    Wx(g, tx, fy + S.line * 2.75, "s", "ON THE BOOK " + b.on + " TIMES", S.line, "#555", true);
    cols = 2; gap = 6; tW = (Rr - L - gap) / 2; tY = y + S.h - S.pad - 2 * S.tileH - gap; tx = L;
  } else {
    // desktop: framed art with the name under it on the left; the line and four tiles on the right,
    // tiles from the line down to the bottom of the name
    var artW = S.art * 98.44 / 97, ay = y + S.pad;
    el("rect", {x: L, y: ay, width: artW, height: S.art + S.name * 2.2, fill: "#fff", "fill-opacity": 0}, clear);
    boxAvatarIn(clear, who, L, ay, artW, S.art);
    var nm = R(clear, L + artW / 2, ay + S.art + S.name * 1.55, "m", NAMES[who], S.name, K.ink, S.name * 0.03);
    fitLine(nm, artW + 10, S.name * 0.6);
    tx = L + artW + 18;
    Wx(g, tx, ay + S.line * 1.2, "s", ordinal(rank) + " ALL-TIME  ·  " + pctS(s.pct) + " WIN %  ·  ON THE BOOK " + b.on + " TIMES", S.line, "#555", true);
    Wx(g, Rr, ay + S.line * 1.2, "e", "TAP AGAIN TO CLEAR", S.line * 0.8, K.mid, true);
    cols = 4; gap = 7; tW = (Rr - tx - 3 * gap) / 4;
    tY = ay + S.line * 2.9;
    S = Object.assign({}, S, {tileH: ay + S.art + S.name * 1.55 + 1 - tY});
  }
  var probe = el("g", {}, g), vs = S.tileVal;
  tiles.forEach(function(t){ var w0 = textW(R(probe, 0, 0, "s", t[1], S.tileVal, K.ink, 0.2)); if (w0 > tW - 10) vs = Math.min(vs, S.tileVal * (tW - 10) / w0); });
  probe.remove();
  tiles.forEach(function(t, i){
    var tx0 = tx + (i % cols) * (tW + gap), ty0 = tY + Math.floor(i / cols) * (S.tileH + gap);
    rrect(g, tx0, ty0, tW, S.tileH, 8, C.tile);
    var lb = R(g, tx0 + tW / 2, ty0 + S.labY, "m", t[0], S.tileLab, K.ink, 0.25);
    fitLine(lb, tW - 8, S.tileLab * 0.7);
    var ruleY = ty0 + S.labY + S.tileLab * 0.75;
    el("line", {x1: tx0 + 9, x2: tx0 + tW - 9, y1: ruleY, y2: ruleY, stroke: C.div, "stroke-width": 1.5, "stroke-linecap": "round"}, g);
    R(g, tx0 + tW / 2, ruleY + (ty0 + S.tileH - ruleY) / 2 + vs * 0.36, "m", t[1], vs, K.ink, 0.2);
  });
  return S.h;
}

// framed avatars with no dark outline (docs/avatars-box/<name>.svg, 432 x 432 art; the gray frame's
// top-left sits at AVBOX[name] in the art and is 318.32 x 299.9). Draw with the frame at fx, fy, fw
// wide - the head pops out above it. Anyone without one gets the old framed art, then an initial.
var AVBOX = {anthony: [56.84, 84.21], coyne: [56.84, 84.51], gangus: [56.84, 84.87], garrett: [56.84, 83.34], graham: [56.84, 84.42],
             greg: [60.94, 78.52], hayden: [56.84, 84.06], scarpitti: [56.84, 84.77], schilling: [57.8, 84.51], scotty: [56.84, 87.33]};
function boxAvatar(g, who, fx, fy, fw){
  var k = fw / 318.32, fh = 299.9 * k, o = AVBOX[who];
  function initial(){
    rrect(g, fx, fy, fw, fh, fw * 0.13, K.light);
    R(g, fx + fw / 2, fy + fh / 2 + fw * 0.12, "m", (NAMES[who] || who).charAt(0), fw * 0.34, K.mid, 0);
  }
  if (!o) {
    var ph = fw * 97 / 98.44, im0 = el("image", {href: "avatars-profile/" + who + ".svg", x: fx, y: fy + fh - ph, width: fw, height: ph}, g);
    im0.addEventListener("error", function(){ im0.remove(); initial(); }, {once: true});
    return;
  }
  el("image", {href: "avatars-box/" + who + ".svg", x: fx - o[0] * k, y: fy - o[1] * k, width: 432 * k, height: 432 * k}, g);
}
function boxAvatarIn(g, who, x, y, w, h){ boxAvatar(g, who, x, y + h - w * 299.9 / 318.32, w); }   // frame bottom on the box's bottom

// ---- BOX SCORE: Michael's box score card, for the game picked in a record ------------------
var BOX = {};                                   // id -> box score json, "missing", or "loading"
var SBOX = {
  d: {h: 352, pad: 14, art: 54, year: 16, week: 6.0, mid: 84, score: 8.6, name: 9.0, head: 140, rh: 21.4, first: 3.9, last: 5.6, stat: 4.1, pts: 5.4, badge: 4.6, stats: true},
  m: {h: 284, pad: 10, art: 46, year: 12, week: 4.8, nw: 72, sgap: 4, score: 6.4, name: 6.0, head: 80, rh: 21.0, first: 3.6, last: 5.2, stat: 0, pts: 5.0, badge: 4.2, stats: false},
};
function gameRows(rec){ var rows = recordRows(rec); return rows.length && rows[0].g ? rows : null; }
function pickedGame(){
  var cat = D.categories[STATE.cat], rec = cat.records[STATE.rec], rows = gameRows(rec);
  if (!rows) return null;
  var hit = rows.filter(function(r){ return r.g === STATE.game; })[0];
  if (!hit) { hit = rows[0]; STATE.game = hit.g; }
  return {rec: rec, row: hit, place: hit.r};
}
function loadBox(id){
  if (BOX[id]) return;
  BOX[id] = "loading";
  fetch("boxscores/" + id + ".json", {cache: "no-cache"})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(b){ BOX[id] = b; render(); })
    .catch(function(){ BOX[id] = "missing"; render(); });
}
function boxScore(g, x, y, w, S){
  rrect(g, x, y, w, S.h, 10.8, K.white);
  var L = x + S.pad, Rr = x + w - S.pad, cx = x + w / 2, W0 = Rr - L, pick = pickedGame();
  function message(title, line){
    R(g, cx, y + S.h / 2 - 4, "m", title, 7.5, K.ink, 0.3);
    var t = Wx(g, cx, y + S.h / 2 + 8, "m", line, 5.2, "#8f8f8f");
    fitLine(t, w - 2 * S.pad, 3.8);
  }
  if (!pick) { message("BOX SCORES", "Pick a Single Game or Playoffs record, then tap a game to see its box score."); return S.h; }
  var b = BOX[pick.row.g];
  if (!b) { loadBox(pick.row.g); b = "loading"; }
  if (b === "loading") { message("BOX SCORE", "Loading…"); return S.h; }
  if (b === "missing") { message("BOX SCORE", "This one is still on its way from Yahoo - it shows up after the next update."); return S.h; }

  // where it came from, top left
  var from = Wx(g, L, y + S.pad + 2, "s", pick.rec.title + "  ·  #" + String(pick.place).replace("T-", ""), S.stats ? 4.4 : 4.0, C.sub, true);
  fitLine(from, w * 0.4, 3.4);

  // header. Desktop: one band - each team in a light panel (face on the outside, name and score
  // on the inside), the year between rules and WEEK n in gray in the middle. Phone: faces over
  // their name bars, scores beside the faces, year between rules with WEEK n under it.
  var A = b.a, B = b.b, win = A.points > B.points ? "a" : B.points > A.points ? "b" : "";
  var artW = S.art * 98.44 / 97;
  function yearBlock(cyr, ruleLen){
    var yt = R(g, cx, cyr + S.year * 0.36, "m", String(b.season), S.year, K.ink, 0.3), yw = textW(yt);
    [[cx - yw / 2 - 5 - ruleLen, cx - yw / 2 - 5], [cx + yw / 2 + 5, cx + yw / 2 + 5 + ruleLen]].forEach(function(p){
      el("line", {x1: p[0], x2: p[1], y1: cyr, y2: cyr, stroke: C.line, "stroke-width": 1.6, "stroke-linecap": "round"}, g);
    });
    R(g, cx, cyr + S.year * 0.36 + S.week * 2.1, "m", "WEEK " + b.week, S.week, C.sub, 0.35);
  }
  function scoreBox(k, sx, sy, sw, sh, size){
    var on = win === k;
    rrect(g, sx, sy - sh / 2, sw, sh, 4, on ? K.ink : K.white, on ? {} : {stroke: C.div, "stroke-width": 1.2});
    R(g, sx + sw / 2, sy + size * 0.36, "m", b[k].points.toFixed(2), size, on ? K.white : K.ink, 0.2);
  }
  if (S.stats) {
    // Michael's Desktop_Box_Score_Header.svg, drawn in its own 534.01 x 168.41 units and scaled to the card
    var s = W0 / 534.01, hy0 = y + S.pad + 12, X0 = L;
    function hx(v){ return X0 + v * s; } function hyy(v){ return hy0 + v * s; }
    [["a", 49.55], ["b", 366.08]].forEach(function(p){ boxAvatar(g, b[p[0]].manager, hx(p[1]), hyy(11.78), 118.38 * s); });
    R(g, hx(267), hyy(65.2), "m", String(b.season), 23 * s, K.ink, 0.6 * s);
    [[187.79, 224.76], [309.73, 346.7]].forEach(function(p){
      el("line", {x1: hx(p[0]), x2: hx(p[1]), y1: hyy(57.18), y2: hyy(57.18), stroke: K.light, "stroke-width": 2.38 * s, "stroke-linecap": "round"}, g);
    });
    R(g, hx(267), hyy(82.3), "m", "WEEK " + b.week, 13 * s, K.mid, 1.1 * s);
    [["a", 179.93], ["b", 287.75]].forEach(function(p){
      var on = win === p[0];
      rrect(g, hx(p[1]), hyy(101.85), 67.39 * s, 21.99 * s, 4.56 * s, "#fff", {stroke: on ? K.ink : K.light, "stroke-width": 1.5 * s});
      R(g, hx(p[1] + 33.7), hyy(112.85) + 14 * s * 0.36, "m", b[p[0]].points.toFixed(2), 14 * s, K.ink, 0.3 * s);
    });
    var nsz2 = 18.5 * s, probe2 = el("g", {}, g);
    ["a", "b"].forEach(function(k){ var w0 = textW(R(probe2, 0, 0, "s", NAMES[b[k].manager] || b[k].manager.toUpperCase(), 18.5 * s, K.ink, 0.6 * s)); if (w0 > 200 * s) nsz2 = Math.min(nsz2, 18.5 * s * 200 * s / w0); });
    probe2.remove();
    [["a", 0], ["b", 315.02]].forEach(function(p){
      rrect(g, hx(p[1]), hyy(137.19), 218.99 * s, 31.22 * s, 4.78 * s, K.light);
      R(g, hx(p[1] + 109.5), hyy(152.8) + nsz2 * 0.36, "m", NAMES[b[p[0]].manager] || b[p[0]].manager.toUpperCase(), nsz2, K.ink, 0.6 * s);
    });
    R(g, hx(267), hyy(152.8) + 18.5 * s * 0.36, "m", "VS", 18.5 * s, K.ink, 0.6 * s);
  } else {
    var ay = y + S.pad + 8, nw = S.nw;
    var pillX = {a: L, b: Rr - nw}, sideX = {a: L + nw / 2 - artW / 2, b: Rr - nw / 2 - artW / 2};
    ["a", "b"].forEach(function(k){
      boxAvatarIn(g, b[k].manager, sideX[k], ay, artW, S.art);
    });
    yearBlock(ay + S.year * 0.55, 9);
    var sw2 = S.score * 5.4, sh2 = S.score * 1.85, sy2 = ay + S.art * 0.76;
    scoreBox("a", sideX.a + artW + S.sgap, sy2, sw2, sh2, S.score);
    scoreBox("b", sideX.b - S.sgap - sw2, sy2, sw2, sh2, S.score);
    var ny = ay + S.art + S.name * 1.3, nh = S.name * 2.1;
    ["a", "b"].forEach(function(k){
      rrect(g, pillX[k], ny - nh / 2, nw, nh, 4, K.light);
      var t = R(g, pillX[k] + nw / 2, ny + S.name * 0.36, "m", NAMES[b[k].manager] || b[k].manager.toUpperCase(), S.name, K.ink, 0.3);
      fitLine(t, nw - 6, S.name * 0.6);
    });
    R(g, cx, ny + S.name * 0.36, "m", "VS", S.name, K.ink, 0.3);
  }

  // the lineups
  var top = y + S.head + 6, rows = Math.max(A.players.length, B.players.length), rh = Math.min(S.rh, (y + S.h - S.pad - top) / Math.max(rows, 1));
  rrect(g, L - 4, top - 4, Rr - L + 8, rows * rh + 8, 8, "none", {stroke: C.div, "stroke-width": 1.2});
  var W = Rr - L, c = S.stats
    ? {nameL: L + 4, statL: L + W * 0.205, ptsL: L + W * 0.418, badge: cx, ptsR: cx + W * 0.082, nameR: cx + W * 0.142, statR: cx + W * 0.312, v: [L + W * 0.197, L + W * 0.36, cx + W * 0.14 - 4, cx + W * 0.304], segL: [L, L + W * 0.465], segR: [cx + W * 0.035, Rr]}
    : {nameL: L + 3, ptsL: cx - W * 0.1, badge: cx, ptsR: cx + W * 0.1, nameR: cx + W * 0.19, v: [cx - W * 0.17, cx + W * 0.17], segL: [L, cx - W * 0.06], segR: [cx + W * 0.06, Rr]};
  c.v.forEach(function(vx){ el("line", {x1: vx, x2: vx, y1: top + 2, y2: top + rows * rh - 2, stroke: C.div, "stroke-width": 1}, g); });
  for (var i = 0; i < rows; i++) {
    var ry0 = top + i * rh, my = ry0 + rh / 2, pa = A.players[i] || {}, pb = B.players[i] || {};
    if (i) [c.segL, c.segR].forEach(function(sg){ el("line", {x1: sg[0], x2: sg[1], y1: ry0, y2: ry0, stroke: C.div, "stroke-width": 1}, g); });
    var slot = pa.slot || pb.slot || "", label = slot === "DEF" ? "DST" : slot === "W/R/T" ? "W/R/T" : slot;
    var bw = S.badge * (label.length > 3 ? 4.6 : 3.8);
    rrect(g, c.badge - bw / 2, my - S.badge * 1.05, bw, S.badge * 2.1, S.badge * 0.5, K.light);
    R(g, c.badge, my + S.badge * 0.36, "m", label, S.badge, K.ink, 0.2);
    [[pa, c.nameL, c.statL, c.ptsL, S.stats ? c.v[0] - 3 : c.v[0] - 3, c.v[1] - 3, "e"], [pb, c.nameR, c.statR, c.ptsR, S.stats ? c.v[3] - 3 : Rr - 2, Rr - 2, "s"]].forEach(function(s){
      var p = s[0]; if (!p.slot && !p.last) return;
      var nameRoom = s[4] - s[1];
      if (p.first) {
        var f = Wx(g, s[1], my - S.last * 0.25, "s", p.first, S.first, "#555", true); fitLine(f, nameRoom, S.first * 0.7);
        var l = R(g, s[1], my + S.last * 0.75, "s", p.last, S.last, K.ink, 0.15); fitLine(l, nameRoom, S.last * 0.6);
      } else { var l2 = R(g, s[1], my + S.last * 0.36, "s", p.last, S.last, K.ink, 0.15); fitLine(l2, nameRoom, S.last * 0.6); }
      Wx(g, s[3], my + S.pts * 0.36, "m", p.pts === null || p.pts === undefined ? "—" : Number(p.pts).toFixed(2), S.pts, K.ink, true);
      if (S.stats && p.line) {                                    // one or two lines, centred on the row
        var sg = el("g", {}, g), n = wrapWx(sg, s[2], my + S.stat * 0.36, s[5] - s[2] - 2, p.line.split(", "), ", ", S.stat, p.alert ? K.red : "#555", S.stat * 1.3, 2);
        if (n > 1) sg.setAttribute("transform", "translate(0," + (-(n - 1) * S.stat * 0.65) + ")");
      }
    });
  }
  return S.h;
}

// horizontal drag on a group (touch: horizontal swipes only, vertical goes to the page)
function dragX(node, move, begin){
  var s = null;
  node.style.touchAction = "pan-y";
  node.addEventListener("pointerdown", function(e){ s = {x: e.clientX, y: e.clientY, id: e.pointerId, h: null}; if (begin) begin(); });
  node.addEventListener("pointermove", function(e){
    if (!s) return;
    var dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (s.h === null) { if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return; s.h = Math.abs(dx) > Math.abs(dy);
      if (s.h) try { node.setPointerCapture(s.id); } catch (x) {} }
    if (s.h) move(dx, false);
  });
  var end = function(e){ if (s && s.h) move(e.clientX - s.x, true); s = null; };
  node.addEventListener("pointerup", end); node.addEventListener("pointercancel", function(){ if (s && s.h) move(0, true); s = null; });
}

// ---- entry ------------------------------------------------------------------------
var D = null, NAMES = {}, root = document.getElementById("root"), lastMob = null;
function render(){
  if (!D) return;
  MOB = root.clientWidth < 500; lastMob = MOB;
  root.innerHTML = "";
  var svg = el("svg", {role: "img", "aria-label": "440 and Friends hall of records"}, root);
  (MOB ? drawPhone : drawDesktop)(svg);
}
var q = new URLSearchParams(location.search);
if (q.get("cat")) STATE.cat = STATE.open = +q.get("cat") || 0;
if (q.get("rec")) STATE.rec = +q.get("rec") || 0;
if (q.get("menu")) STATE.menu = true;
if (q.get("who")) STATE.who = q.get("who");
if (q.get("game")) STATE.game = q.get("game");
Promise.all([document.fonts.load('10px "Rotundo"'), document.fonts.load('500 10px "Laro Soft"'),
             document.fonts.load('500 10px "Wix Made for Text"'), document.fonts.load('700 10px "Wix Made for Text"')])
  .then(function(){ return fetch("records.json", {cache: "no-cache"}); })
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(d){ D = d; NAMES = d.names || {}; render(); })
  .catch(function(e){ root.innerHTML = '<div class="msg">Record book unavailable (' + e.message + ')</div>'; });
window.addEventListener("resize", function(){ if (D && (root.clientWidth < 500) !== lastMob) render(); });
})();
