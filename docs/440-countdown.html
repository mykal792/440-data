/* ==========================================================================
   440 & FRIENDS — split-flap kickoff countdown

   ONE LINE AT 290px
   Eight cards plus three colons have to share whatever width there is, so
   below 520px the card stops being a clamp and becomes pure arithmetic:

     4 groups x 2.07w  +  3 separators x 0.385w  =  9.435w

   Dividing the available width by 9.8 leaves about 4% headroom for font
   metric variance in the colon. At 290px that puts each card near 28px, so
   the digits are ~27px tall — small, but the whole clock holds one line.
   Labels and the matchup row scale off the same --cw so nothing drifts.

   THE FOLD BUG, FIXED
   The lower fold used animation-fill-mode: forwards with a .27s delay. Before
   a delayed animation starts, forwards applies nothing, so for the whole first
   half of the flip that panel sat un-rotated on top of the static lower half,
   showing the new number while the top was still dropping. It now uses `both`
   (backwards applies the from-state during the delay) plus an explicit resting
   rotateX(90deg), so it stays edge-on and invisible until its turn.

   FONTS
   'Laro' (Larin Type Co.) is commercial, so it can't load from a CDN. Upload
   the .woff2 to Wix and point the @font-face src at it, or drop the file next
   to this page. Until then it falls back to Wix Madefor Text.
   ========================================================================== */

@font-face{
  font-family:'Laro';
  src:url('Laro-Bold.woff2') format('woff2');
  font-weight:700;
  font-style:normal;
  font-display:swap;
}

:root{
  --tile:#e4e4e4;
  --ink:#333333;
  --seam:rgba(0,0,0,.14);
  --label:#8e8e8e;
  --sub:#6d6e71;
  --rule:#c9c9c9;

  /* logo sizing. The Seahawks mark is a 2.49:1 crop against the
     Patriots' 2.02:1, so matching their heights makes it read wider.
     --sea trims it back until the two feel like the same weight. */
  --logo:clamp(20px,2.6vw,30px);
  --sea:.86;

  --display:'Rotundo','Arial Black','Helvetica Neue',Impact,sans-serif;
  --unit:'Laro','Wix Madefor Text',ui-sans-serif,system-ui,sans-serif;
  --body:'Wix Madefor Text',ui-sans-serif,system-ui,sans-serif;

  /* one knob: card width. Everything else derives from it. */
  --cw:clamp(46px,8.2vw,96px);
  --ch:calc(var(--cw) * 1.34);
  --r:calc(var(--cw) * .12);
  --dig:calc(var(--ch) * .72);
}

*{box-sizing:border-box}
/* page shell — inside a Wix HTML box the iframe viewport IS the box, so no
   margins and no scrollbars. height:100% instead of min-height:100vh: 100vh
   is the viewport, and if it ever resolves a pixel taller than the box you
   get the inner scrollbar. */
html,body{background:transparent;height:100%;overflow:hidden;margin:0;padding:0}
body{
  color:var(--ink);
  font-family:var(--body);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
}

.kick{display:inline-block}

/* ---------- KICK OFF between two rules ---------- */
.kick__head{
  display:flex;align-items:center;gap:clamp(12px,1.8vw,22px);
  margin:0 0 clamp(18px,2.6vw,30px);
}
.kick__head::before,
.kick__head::after{
  content:'';flex:1 1 0;height:3px;background:var(--rule);border-radius:1.5px;
}
.kick__title{
  font-family:var(--display);
  font-size:clamp(20px,3vw,34px);line-height:1;letter-spacing:.04em;
  font-weight:400;margin:0;white-space:nowrap;
}

/* ---------- the clock ---------- */
.clock{
  display:flex;align-items:flex-start;justify-content:center;
  gap:clamp(10px,1.8vw,22px);
}
.group{display:flex;flex-direction:column;align-items:center}
.cards{display:flex;gap:calc(var(--cw) * .07)}
.group__cap{
  margin-top:calc(var(--cw) * .24);
  font-family:var(--unit);font-weight:700;
  font-size:clamp(9.5px,1.1vw,13px);letter-spacing:.15em;
  color:var(--label);white-space:nowrap;
}
.sep{
  font-family:var(--display);line-height:1;
  font-size:calc(var(--ch) * .42);color:var(--label);
  padding-top:calc(var(--ch) * .29);
}

/* ---------- the card ---------- */
.card{
  position:relative;
  width:var(--cw);height:var(--ch);
  perspective:calc(var(--ch) * 2.2);
  font-family:var(--display);
  font-size:var(--dig);line-height:1;
  font-variant-numeric:tabular-nums;
}
.half{
  position:absolute;left:0;width:100%;height:50%;
  overflow:hidden;background:var(--tile);
}
.half span{
  position:absolute;left:0;width:100%;height:var(--ch);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);
}
.half.up{top:0;border-radius:var(--r) var(--r) 0 0;border-bottom:1px solid var(--seam)}
.half.up span{top:0}
.half.dn{bottom:0;border-radius:0 0 var(--r) var(--r)}
.half.dn span{top:calc(var(--ch) * -.5)}

/* the two animating copies sit on top and are edge-on or hidden at rest */
.fold{visibility:hidden;z-index:2;backface-visibility:hidden}
.fold.up{transform-origin:bottom center;transform:rotateX(0deg)}
.fold.dn{transform-origin:top center;transform:rotateX(90deg)}

.card.go .fold{visibility:visible}
.card.go .fold.up{animation:foldDown .27s cubic-bezier(.4,0,.7,.4) both}
.card.go .fold.dn{animation:foldUp .27s .27s cubic-bezier(.3,.6,.6,1) both}

@keyframes foldDown{
  from{transform:rotateX(0deg)}
  to{transform:rotateX(-90deg)}
}
@keyframes foldUp{
  from{transform:rotateX(90deg)}
  to{transform:rotateX(0deg)}
}

/* ---------- matchup + date ---------- */
.match{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(10px,1.5vw,18px);flex-wrap:nowrap;white-space:nowrap;
  margin:clamp(26px,3.2vw,38px) 0 0;
}
.team{display:flex;align-items:center;gap:10px}
.team svg{display:block;height:var(--logo);width:auto;flex:none}
.team--sea svg{height:calc(var(--logo) * var(--sea))}
.team__name{
  font-family:var(--display);
  font-size:clamp(13px,1.7vw,20px);line-height:1;letter-spacing:.02em;
}
.match__at{
  font-family:var(--unit);font-weight:700;
  font-size:clamp(11px,1.3vw,15px);letter-spacing:.12em;color:var(--label);
}

.kick__when{
  margin:clamp(12px,1.5vw,16px) 0 0;text-align:center;
  font-family:var(--unit);font-weight:700;
  font-size:clamp(10.5px,1.2vw,13px);letter-spacing:.16em;color:var(--sub);
}

/* ==========================================================================
   MOBILE — everything stays on one line. Holds to ~270px.
   ========================================================================== */
@media (max-width:520px){
  :root{
    --cw:min(64px, calc((100vw - 18px) / 9.8));
    --logo:clamp(15px, calc(var(--cw) * .62), 26px);
  }

  .kick{display:block;width:100%}
  .kick__head{gap:10px;margin-bottom:16px}
  .kick__title{font-size:clamp(16px,5.4vw,22px)}

  .clock{gap:calc(var(--cw) * .12)}
  .sep{
    font-size:calc(var(--ch) * .36);
    padding-top:calc(var(--ch) * .3);
  }
  .group__cap{
    margin-top:calc(var(--cw) * .26);
    font-size:clamp(7.5px, calc(var(--cw) * .27), 13px);
    letter-spacing:.05em;
  }

  .match{gap:calc(var(--cw) * .28);margin-top:22px}
  .team{gap:calc(var(--cw) * .2)}
  .team__name{font-size:clamp(11px, calc(var(--cw) * .47), 18px)}
  .match__at{font-size:clamp(9.5px, calc(var(--cw) * .38), 14px);letter-spacing:.08em}

  .kick__when{
    font-size:clamp(8.5px,2.9vw,11px);letter-spacing:.09em;margin-top:13px;
  }
}

@media (prefers-reduced-motion:reduce){
  .card.go .fold{visibility:hidden;animation:none}
}
</style>
</head>
<body>

<section class="kick" aria-label="Countdown to kickoff">

  <div class="kick__head">
    <h2 class="kick__title">KICK OFF</h2>
  </div>

  <div class="clock" id="clock" role="timer" aria-live="off"></div>

<script>
const KICKOFF = new Date('2026-09-09T20:20:00');
const UNITS = [
  { key:'d', cap:'DAYS'    },
  { key:'h', cap:'HOURS'   },
  { key:'m', cap:'MINUTES' },
  { key:'s', cap:'SECONDS' }
];
const FOLD_MS = 560;

const clock = document.getElementById('clock');
const cards = {};

UNITS.forEach((u, i) => {
  if (i) {
    const sep = document.createElement('span');
    sep.className = 'sep';
    sep.setAttribute('aria-hidden','true');
    sep.textContent = ':';
    clock.appendChild(sep);
  }

  const group = document.createElement('div');
  group.className = 'group';

  const row = document.createElement('div');
  row.className = 'cards';

  cards[u.key] = [0,1].map(() => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.v = '0';
    card.innerHTML =
      '<div class="half up"><span>0</span></div>' +
      '<div class="half dn"><span>0</span></div>' +
      '<div class="half up fold"><span>0</span></div>' +
      '<div class="half dn fold"><span>0</span></div>';
    row.appendChild(card);
    return card;
  });

  const cap = document.createElement('div');
  cap.className = 'group__cap';
  cap.textContent = u.cap;

  group.appendChild(row);
  group.appendChild(cap);
  clock.appendChild(group);
});

function flip(card, val){
  if (card.dataset.v === val) return;
  const old = card.dataset.v;
  const [staticUp, staticDn, foldUp, foldDn] = card.querySelectorAll('span');

  foldUp.textContent   = old;   /* old top, drops away          */
  foldDn.textContent   = val;   /* new bottom, swings up after  */
  staticUp.textContent = val;   /* revealed behind the dropping panel */
  staticDn.textContent = old;   /* holds the old value until the fold lands */

  card.dataset.v = val;
  card.classList.remove('go');
  void card.offsetWidth;
  card.classList.add('go');

  clearTimeout(card._t);
  card._t = setTimeout(() => {
    staticDn.textContent = val;
    card.classList.remove('go');
  }, FOLD_MS);
}

function setUnit(key, n){
  const s = String(n).padStart(2,'0');
  flip(cards[key][0], s[0]);
  flip(cards[key][1], s[1]);
}

function tick(){
  const diff = KICKOFF - new Date();
  if (diff <= 0){
    ['d','h','m','s'].forEach(k => setUnit(k, 0));
    return;
  }
  const t = Math.floor(diff / 1000);
  setUnit('d', Math.floor(t / 86400));
  setUnit('h', Math.floor(t % 86400 / 3600));
  setUnit('m', Math.floor(t % 3600 / 60));
  setUnit('s', t % 60);
}

tick();
setInterval(tick, 1000);
</script>
