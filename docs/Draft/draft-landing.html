.dl {
  container-type:inline-size; width:100%; max-width:905px; margin:0 auto;
  -webkit-text-size-adjust:100%;
  --ink:#222; --mute:#8f8f8f; --hair:#e4e4e4;
  --up:#76C8B5; --down:#F18892;      /* 60% screens of #1aa483 / #e8394a */
  --green:#8AEBC1; --folder:#E5E6E7; --dark:#333333;
}
.dl * { box-sizing:border-box; }

/* ---------- headings ---------------------------------------------------- */

.dl-sec { margin:0 0 4px; }

.dl-h2 {
  font-family:'Rotundo',system-ui,sans-serif;
  font-size:clamp(21px,3cqw,30px); color:var(--ink); margin:0;
}

/* The rule picks up the active position colour, which is the one place the
   filter state shows up outside the pills themselves. */
.dl-rule { border:0; height:3px; background:var(--ink); margin:9px 0 0;
           transition:background 160ms ease; }

/* A matching rule below the pills, so the filter sits between two bars that
   both take the position's colour — the state is hard to miss. */
.dl-rule--under { margin:14px 0 0; }

.dl-eyebrow {
  font-family:'Laro Soft',system-ui,sans-serif; font-weight:700; font-style:italic;
  font-size:clamp(12px,1.5cqw,13.5px); letter-spacing:0.05em; line-height:1;
  color:#bdbdbd; text-transform:uppercase; margin:0 0 -1px;
}

.dl-block { margin:0 0 24px; }

/* Equal air above and below the folder strip. */
.dl-block--years { margin-bottom:20px; }

/* ---------- year folders ------------------------------------------------ */

/* Five folders in view; the rest scroll. Snap points keep a folder from
   parking half-off the edge. */
.dl-folders {
  display:flex; gap:18px; margin-top:20px;
  overflow-x:auto; scroll-snap-type:x proximity; overscroll-behavior-x:contain;
  scrollbar-width:none; padding-bottom:2px;
}
.dl-folders::-webkit-scrollbar { display:none; }

.dl-folder {
  position:relative; flex:0 0 calc((100% - 6 * 18px) / 6.4);
  aspect-ratio:233.64 / 172.39; scroll-snap-align:start;
  display:flex; align-items:center; justify-content:center;
  text-decoration:none; color:var(--folder);          /* the folder body */
  transition:color 140ms ease;
}

@container (max-width:700px) { .dl-folder { flex-basis:calc((100% - 4 * 18px) / 5.2); } }
@container (max-width:479px) { .dl-folders { gap:12px; }
                               .dl-folder { flex-basis:calc((100% - 3 * 12px) / 3.5); } }

.dl-folder svg { position:absolute; inset:0; width:100%; height:100%; fill:currentColor; }

.dl-folder span {
  position:relative; margin-top:6%;
  font-family:'Rotundo',system-ui,sans-serif;
  font-size:clamp(12px,1.85cqw,17px); color:var(--ink);
  transition:color 140ms ease;
}

.dl-folder:hover,
.dl-folder--now { color:var(--dark); }

/* No page yet: still legible, but nothing to click. */
.dl-folder--soon { cursor:default; opacity:0.55; }
.dl-folder--soon:hover { color:var(--folder); }
.dl-folder--soon:hover span { color:var(--ink); }
.dl-folder:hover span,
.dl-folder--now span { color:var(--green); }

/* ---------- manager heads ----------------------------------------------- */

.dl-teams { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:14px; }

.dl-team {
  display:grid; justify-items:center; gap:8px; padding:10px 3px;
  min-width:0;                       /* let the tile shrink instead of pushing the grid wide */
  border-radius:14px; text-decoration:none; transition:background 120ms ease;
}
.dl-team:hover { background:#f4f4f4; }

.dl-face { width:clamp(46px,8.4cqw,76px); aspect-ratio:1; border-radius:50%;
           background:#e4e4e4; display:flex; align-items:center; justify-content:center;
           overflow:hidden; font-family:'Rotundo',system-ui,sans-serif; color:#8f8f8f; }
.dl-face--art { background:transparent; }
.dl-face svg, .dl-face img { width:100%; height:100%; display:block; }

.dl-team span {
  font-family:'Rotundo',system-ui,sans-serif;
  font-size:clamp(8.5px,1.28cqw,12.5px); letter-spacing:0.01em; color:var(--ink);
  max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ---------- lists ------------------------------------------------------- */

.dl-cols { display:grid; grid-template-columns:1fr 1fr; gap:38px; }
@container (max-width:640px) { .dl-cols { grid-template-columns:1fr; gap:18px; } }

/* Two across on mobile, name beside the face — five stacked rows of one
   would run the section far too long. */
@container (max-width:640px) {
  .dl-teams { grid-template-columns:repeat(2,1fr); gap:6px; }
  .dl-team { grid-auto-flow:column; grid-template-columns:auto 1fr;
             justify-items:start; align-items:center; gap:11px; padding:8px 10px; }
  .dl-team .dl-face { width:46px; }
  .dl-team span { font-size:13px; }
}

/* Wix's mobile box is 290px: SCARPITTI and SCHILLING need ~80px and only had
   65, so the tile gives back padding, gap and avatar to make room. */
@container (max-width:480px) {
  .dl-teams { gap:5px; }
  .dl-team { gap:8px; padding:7px 6px; }
  .dl-team .dl-face { width:40px; }
  .dl-team span { font-size:11.5px; letter-spacing:0; }
}

.dl-colhead {
  font-family:'Laro Soft',system-ui,sans-serif; font-weight:700; font-style:italic;
  font-size:clamp(12px,1.5cqw,13.5px); letter-spacing:0.05em;
  text-transform:uppercase; margin:12px 0 4px;
}

.dl-colhead--up { color:var(--up); }
.dl-colhead--down { color:var(--down); }

/* No boxes: rows are separated by a hairline, which is quieter and gives the
   names the full column width. */
.dl-row {
  display:grid; align-items:center; gap:10px;
  grid-template-columns:auto 1fr auto;
  padding:11px 2px; border-top:2px solid var(--hair); text-decoration:none;
}
.dl-colhead + .dl-row { border-top:0; }
a.dl-row:hover { background:#fafafa; }

.dl-rank {
  font-family:'Laro Soft',system-ui,sans-serif; font-weight:700;
  font-size:clamp(11px,1.4cqw,13px); color:#cfcfcf; min-width:11px; text-align:center;
}

.dl-badge {
  display:flex; align-items:center; justify-content:center;
  width:clamp(36px,4.5cqw,42px); height:clamp(20px,2.4cqw,23px);
  padding:0; border-radius:6px;
  font-family:'Rotundo',system-ui,sans-serif;
  font-size:clamp(9px,1.15cqw,10.5px); letter-spacing:0.04em; color:#fff;
}

.dl-main { min-width:0; }

/* Rotundo for the name that leads the row. */
.dl-name {
  display:block; font-family:'Laro Soft',system-ui,sans-serif; font-weight:500;
  font-size:clamp(13px,1.75cqw,17px); color:var(--ink); line-height:1.1;
  text-transform:uppercase; letter-spacing:0.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.dl-name em { font-style:normal; color:#b4b4b4; }

/* Overall drafts: place, manager and year all on one line. */
.dl-row--flat { padding:9px 2px; }
.dl-row--flat .dl-name {
  display:flex; align-items:baseline; gap:9px;
  font-family:'Rotundo',system-ui,sans-serif; font-weight:400;
  font-size:clamp(15px,1.95cqw,19px);
}
.dl-row--flat .dl-name u {
  text-decoration:none; font-family:'Laro Soft',system-ui,sans-serif;
  font-weight:400; font-size:0.72em; color:var(--mute);
}

/* Laro for the supporting line. */
.dl-meta {
  display:flex; align-items:center; gap:5px; margin-top:3px;
  font-family:'Laro Soft',system-ui,sans-serif; font-weight:400;
  font-size:clamp(10.5px,1.28cqw,12px); color:var(--mute);
  white-space:nowrap; overflow:hidden;
}
.dl-meta b { font-weight:400; color:#6f6f6f; }
.dl-meta i { font-style:normal; color:#d2d2d2; }

.dl-val {
  font-family:'Laro Soft',system-ui,sans-serif; font-weight:700;
  font-size:clamp(15px,1.95cqw,19px); white-space:nowrap; letter-spacing:-0.01em;
}
.dl-val--up { color:var(--up); }
.dl-val--down { color:var(--down); }
.dl-val small { font-weight:400; font-size:0.58em; color:#c8c8c8; letter-spacing:0; }

/* ---------- who shows up most ------------------------------------------- */

.dl-cols--tally { margin-top:10px; }

.dl-count {
  display:grid; grid-template-columns:auto auto 1fr auto; align-items:center;
  gap:10px; padding:7px 2px; border-top:2px solid var(--hair);
  text-decoration:none;
}
.dl-colhead + .dl-count { border-top:0; }


.dl-cface { width:27px; height:27px; border-radius:50%; overflow:hidden; flex:none;
            background:#e4e4e4; }
.dl-cface svg { width:100%; height:100%; display:block; }

.dl-cname {
  font-family:'Rotundo',system-ui,sans-serif;
  font-size:clamp(12px,1.5cqw,14px); color:var(--ink);
}

.dl-cnum {
  font-family:'Laro Soft',system-ui,sans-serif; font-weight:700;
  font-size:clamp(14px,1.8cqw,17px);
  /* Offset by the width of the "/10" suffix above, so the counts end where
     the score digits end rather than where the suffix does. */
  padding-right:clamp(11px, 1.75cqw, 17px);
}

/* ---------- position filter --------------------------------------------- */

/* Spelled out and spread across the full width on desktop; abbreviated and
   evenly gridded on mobile. */
.dl-filter { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin:16px 0 0; }

.dl-tab {
  appearance:none; border:0; cursor:pointer; min-width:0;
  height:30px; padding:0 8px; border-radius:999px; background:#f0f0f0;
  font-family:'Rotundo',system-ui,sans-serif;
  font-size:clamp(9.5px,1.25cqw,12.5px); line-height:1; color:#8f8f8f;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:background 130ms ease,color 130ms ease;
}
.dl-tab:hover { background:#e4e4e4; color:var(--ink); }
.dl-tab[aria-pressed="true"] { color:#fff; }

.dl-tab .abbr { display:none; }

/* Narrow: rather than squeezing seven tabs into circles, keep them as long
   thin pills and let the strip scroll. */
@container (max-width:640px) {
  .dl-filter {
    display:flex; gap:7px; overflow-x:auto; overscroll-behavior-x:contain;
    scrollbar-width:none; padding-bottom:2px;
  }
  .dl-filter::-webkit-scrollbar { display:none; }
  .dl-tab { flex:0 0 auto; padding:0 16px; font-size:12px; }
}

</style>

    /* Rows for years without a page yet stay inert rather than dead-ending. */
    var r = el(o.href ? 'a' : 'div', 'dl-row' + (o.flat ? ' dl-row--flat' : ''));
    if (o.href) { r.href = o.href; openInTop(r); }
    r.appendChild(el('span', 'dl-rank', String(i + 1)));

    if (o.badge) {
      var b = el('span', 'dl-badge', o.badge);
      b.style.background = o.color;
      r.insertBefore(b, null);
      r.style.gridTemplateColumns = 'auto auto 1fr auto';
    }

    var main = el('span', 'dl-main');
    var name = el('span', 'dl-name');
    name.appendChild(document.createTextNode(o.name + ' '));
    if (o.suffix) { name.appendChild(el('em', null, '(' + o.suffix + ')')); }
    main.appendChild(name);

    if (o.flat) {
      name.appendChild(el('u', null, o.year));
      main.appendChild(name);
      r.appendChild(main);
      var fv = el('span', 'dl-val ' + (o.good ? 'dl-val--up' : 'dl-val--down'));
      fv.appendChild(document.createTextNode(o.value));
      fv.appendChild(el('small', null, '/10'));
      r.appendChild(fv);
      return r;
    }

    var meta = el('span', 'dl-meta');
    o.meta.forEach(function (part, k) {
      if (k) { meta.appendChild(el('i', null, '\u00b7')); }
      meta.appendChild(part.bold ? el('b', null, part.t) : el('span', null, part.t));
    });
    main.appendChild(meta);
    r.appendChild(main);

    var v = el('span', 'dl-val ' + (o.good ? 'dl-val--up' : 'dl-val--down'));
    v.appendChild(document.createTextNode(o.value));
    v.appendChild(el('small', null, '/10'));
    r.appendChild(v);
    return r;
  }

  function column(title, rows, good) {
    var w = el('div');
    w.appendChild(el('p', 'dl-colhead ' +
      (good ? 'dl-colhead--up' : 'dl-colhead--down'), title));
    rows.forEach(function (r) { w.appendChild(r); });
    return w;
  }

  function renderPicks(pos) {
    var box = document.getElementById('dlPicks');
    box.textContent = '';
    var tint = pos === 'ALL' ? '' : POS_COLOR[pos];
    document.getElementById('dlSelRule').style.background = tint;
    document.getElementById('dlSelRule2').style.background = tint;

    [['best', true], ['worst', false]].forEach(function (side) {
      var rows = DATA[pos][side[0]].map(function (r, i) {
        var mgr = TEAM_MGR[r[5]] || r[5];
        return row(i, {
          /* No href: this section is for browsing, not for leaving the page. */
          /* The badge only earns its place in the mixed list — once a
             position is chosen it repeats the filter five times over. */
          badge: pos === 'ALL' ? r[1] : null,
          color: POS_COLOR[r[1]] || POS_COLOR.DEF,
          name: r[0], suffix: r[2], mgr: mgr,
          meta: [{ t: mgr, bold: true }, { t: String(r[3]) },
                 { t: 'Pick ' + r[4] }],
          value: pickScore(r[6]).toFixed(1),
          good: side[1]
        });
      });
      box.appendChild(column(
        (side[1] ? 'Best ' : 'Worst ') +
        (pos === 'ALL' ? 'picks' : POS_LABEL[pos].toLowerCase() + ' picks'),
        rows, side[1]));
    });
  }

  function renderOverall() {
    var box = document.getElementById('dlOverall');
    [['best', true], ['worst', false]].forEach(function (side) {
      var rows = OVERALL[side[0]].map(function (r, i) {
        return row(i, {
          flat: true, name: r[0], year: String(r[1]),
          value: r[2].toFixed(1), good: side[1], href: teamURL(r[0])
        });
      });
      box.appendChild(column(
        side[1] ? 'Best overall draft' : 'Worst overall draft', rows, side[1]));
    });
  }

  /* Counts every appearance across the six position lists — not the ALL
     view, which is a merge of them and would double-count. */
  function tally(side) {
    var n = {};
    POS_ORDER.forEach(function (p) {
      DATA[p][side].forEach(function (r) {
        var m = TEAM_MGR[r[5]] || r[5];
        n[m] = (n[m] || 0) + 1;
      });
    });
    return Object.keys(n).map(function (m) { return [m, n[m]]; })
             .sort(function (a, b) { return b[1] - a[1] || a[0].localeCompare(b[0]); })
             .slice(0, 5);
  }

  function renderTally() {
    var box = document.getElementById('dlTally');
    [['best', 'Most top-5 picks', true], ['worst', 'Most bottom-5 picks', false]]
      .forEach(function (cfg) {
        var w = el('div');
        w.appendChild(el('p', 'dl-colhead ' +
          (cfg[2] ? 'dl-colhead--up' : 'dl-colhead--down'), cfg[1]));
        tally(cfg[0]).forEach(function (t, i) {
          var a = el('div', 'dl-count');
          a.appendChild(el('span', 'dl-rank', String(i + 1)));
          a.appendChild(faceFor(t[0], 'dl-cface'));
          a.appendChild(el('span', 'dl-cname', t[0]));
          var n = el('span', 'dl-cnum ' + (cfg[2] ? 'dl-val--up' : 'dl-val--down'),
                     String(t[1]));
          a.appendChild(n);
          w.appendChild(a);
        });
        box.appendChild(w);
      });
  }

  function filter() {
    var bar = document.getElementById('dlFilter');
    ['ALL'].concat(POS_ORDER).forEach(function (pos) {
      var b = el('button', 'dl-tab');
      b.type = 'button';
      b.appendChild(el('span', 'full', POS_LABEL[pos]));
      b.appendChild(el('span', 'abbr', pos));
      b.setAttribute('aria-pressed', pos === 'ALL' ? 'true' : 'false');
      b.addEventListener('click', function () {
        bar.querySelectorAll('.dl-tab').forEach(function (o) {
          o.setAttribute('aria-pressed', 'false');
          o.style.background = '';
        });
        b.setAttribute('aria-pressed', 'true');
        b.style.background = POS_COLOR[pos] || '#333';
        /* On a phone the strip scrolls, so bring the chosen pill to the left
           edge — that also reveals whatever comes after it. */
        if (bar.scrollWidth > bar.clientWidth) {
          bar.scrollTo({ left: Math.max(0, b.offsetLeft - 8), behavior: 'smooth' });
        }
        renderPicks(pos);
      });
      if (pos === 'ALL') { b.style.background = '#333'; }
      bar.appendChild(b);
    });
  }

  function init() { nav(); renderOverall(); filter(); renderPicks('ALL'); renderTally(); }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
</body>
</html>
