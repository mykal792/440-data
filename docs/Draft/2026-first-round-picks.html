/* ---------- outer container --------------------------------------------- */

/* The viewport is the query container; the board reads its width through
   container-query units, so the whole component scales as one piece. */
.db-viewport {
  container-type: inline-size;
  width: 100%;
  max-width: 1226.98px;
  margin: 0 auto;
}

/* Everything on the page shares one design unit. */
.db-inner { --u: calc(100cqw / 1226.98); }

.draft-board {
  position: relative;
  box-sizing: border-box;
  width: 100%;
  background: #e4e4e4;                                  /* board rect fill    */
  border-radius: calc(38.89 * var(--u));                /* board rect radius  */
  padding:
    calc(27.74 * var(--u))                              /* top                */
    calc(32.31 * var(--u))                              /* right              */
    calc(25.64 * var(--u))                              /* bottom             */
    calc(32.02 * var(--u));                             /* left               */
}

/* ---------- header ------------------------------------------------------ */

.db-header {
  position: relative;
  height: calc(147.79 * var(--u));
  background: #fff;
  border-radius: calc(23 * var(--u));
  overflow: hidden;
}

/* The lockup is title + illustration side by side over a rule, and it is
   centred as one piece, so a longer or shorter year title stays balanced in
   the header instead of drifting away from the illustration.

   --lk scales the whole lockup at the narrow breakpoints; every number below
   is in --lu, so the title, the gap, the illustration and the rule all shrink
   together and keep the proportions measured off the original artwork. */
.db-lockup {
  --lk: 1;
  --lu: calc(var(--u) * var(--lk));

  position: absolute;
  left: 50%;
  top: calc(30.01 * var(--u));
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: auto auto;
  column-gap: calc(13.035 * var(--lu));
}

/* Title and illustration share the top row; the rule spans both. */
.db-title {
  grid-row: 1;
  margin: calc(15.932 * var(--lu)) calc(-1.4391 * var(--lu)) 0 0;   /* cap-top offset; trailing tracking removed */
  font-family: 'Rotundo', system-ui, sans-serif;
  font-weight: 400;
  font-size: calc(50.9465 * var(--lu));
  line-height: 1;
  letter-spacing: 0.02825em;
  color: #333;
  white-space: nowrap;
  text-box: trim-both cap alphabetic;
}

/* Rotundo declares USE_TYPO_METRICS, so every engine lays it out on an ascent
   of 0.8em over its 0.7em caps: without the trim the box starts 0.1em above
   the cap. */
@supports not (text-box: trim-both cap alphabetic) {
  .db-title { margin-top: calc(10.837 * var(--lu)); }
}

.db-illus {
  grid-row: 1;
  display: block;
  width: calc(173.625 * var(--lu));
  height: calc(70.5 * var(--lu));
  user-select: none;
  -webkit-user-drag: none;
}

.db-rule {
  grid-column: 1 / -1;
  grid-row: 2;
  height: calc(3.73 * var(--lu));
  margin: calc(-0.475 * var(--lu)) calc(-10 * var(--lu)) 0;  /* the artwork runs it just under the laptop base */
  border-radius: calc(1.865 * var(--lu));
  background: #bababa;
}

/* ---------- grid -------------------------------------------------------- */

.db-grid {
  margin-top: calc(25.47 * var(--u));
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  column-gap: calc(20 * var(--u));
  row-gap: calc(21.7 * var(--u));
}

/* ---------- card -------------------------------------------------------- */

.draft-card {
  /* reset the <button> */
  appearance: none;
  -webkit-appearance: none;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  font: inherit;
  color: inherit;
  text-align: inherit;

  display: block;
  width: 100%;
  aspect-ratio: 216 / 367.02;          /* the supplied card viewBox           */
  perspective: calc(1000 * var(--u));
  cursor: pointer;
  border-radius: calc(25.16 * var(--u));
  -webkit-tap-highlight-color: transparent;
}

.draft-card:focus-visible {
  outline: calc(3 * var(--u)) solid #0c9bd7;
  outline-offset: calc(3 * var(--u));
}

.draft-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 520ms cubic-bezier(0.22, 0.68, 0.28, 1);
  will-change: transform;
}

.draft-card.is-flipped .draft-card-inner {
  transform: rotateY(180deg);
}

.draft-card-front,
.draft-card-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: translateZ(0);            /* keeps Safari from z-fighting        */
}

.draft-card-back {
  transform: rotateY(180deg) translateZ(0);
}

/* Front face: the supplied artwork, untouched. The SVG's aspect ratio is
   identical to the card box, so `contain` scales it edge to edge with no
   letterboxing while still guaranteeing it can never be stretched. */
.draft-card-front > img,
.draft-card-back > svg {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* ---------- responsive --------------------------------------------------- */

/* The board is one rigid artboard, so a smaller screen simply means a smaller
   reference width: --u shrinks, the 5x2 grid holds, nothing reflows. Below the
   point where five columns stop being legible we drop to three, then two, and
   re-base --u so radii, padding and type stay in proportion.

   Both fallbacks keep the card close to its reference 216-unit width, so the
   back-face type never has to be re-tuned:
     3 columns over a 760-unit board  -> (760 - 64.33 - 40) / 3 = 218.56
     2 columns over a 520-unit board  -> (520 - 64.33 - 20) / 2 = 217.84   */

@container (max-width: 719px) {
  .db-inner { --u: calc(100cqw / 760); }
  .db-grid     { grid-template-columns: repeat(3, 1fr); }

  /* 760-unit board, 695.67 of usable header: the 975.6-unit lockup comes down
     to 0.77 of itself to leave an inset either side. */
  .db-header   { height: calc(110 * var(--u)); }
  .db-lockup   { --lk: 0.77; top: calc(24 * var(--u)); }
}

@container (max-width: 479px) {
  .db-inner { --u: calc(100cqw / 520); }
  .db-grid     { grid-template-columns: repeat(2, 1fr); }

  /* 520-unit board, 455.67 of usable header. On a phone the lockup is the
     words alone: the illustration and the rule both stand down, which lets the
     heading run about a fifth larger than it could with the laptop in the row.
     With the rule gone the lockup is just the cap band, so the header closes up
     around it rather than leaving the rule's old space empty. */
  .db-header   { height: calc(54 * var(--u)); }
  .db-lockup   { --lk: 0.60; top: calc(16 * var(--u)); }
  .db-illus    { display: none; }
  .db-rule     { display: none; }
  .db-title    { margin-top: 0; }
}

/* ---------- year navigation --------------------------------------------- */

/* Sits above the board, flush with its edges, so the tabs read as the tabs of
   this drawer rather than as a separate widget. */
.yr-nav { margin-bottom: clamp(28px, 4.2cqw, 52px); }

/* Same sizing as the draft landing page: six folders in view with a seventh
   showing its edge as the scroll cue, five below 700, three on a phone. Snap
   points stop a folder parking half off the edge. */
.yr-folders {
  display: flex;
  gap: 18px;
  margin-top: 0;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.yr-folders::-webkit-scrollbar { display: none; }

.yr-folder {
  position: relative;
  flex: 0 0 calc((100% - 6 * 18px) / 6.4);
  aspect-ratio: 233.64 / 172.39;
  scroll-snap-align: start;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: #E5E6E7;                      /* the folder body */
  transition: color 140ms ease;
}

.yr-folder svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: currentColor; }

.yr-folder span {
  position: relative;
  margin-top: 6%;                      /* the tab makes the shape top-heavy */
  font-family: 'Rotundo', system-ui, sans-serif;
  font-size: clamp(12px, 1.85cqw, 17px);
  color: #222;
  transition: color 140ms ease;
}

.yr-folder:hover,
.yr-folder--now { color: #333; }
.yr-folder:hover span,
.yr-folder--now span { color: #8AEBC1; }

/* No page for that year yet: still legible, but nothing to click. */
.yr-folder--soon { cursor: default; opacity: 0.55; }
.yr-folder--soon:hover { color: #E5E6E7; }
.yr-folder--soon:hover span { color: #222; }

.yr-folder:focus-visible { outline: 2px solid #0c9bd7; outline-offset: 2px; border-radius: 4px; }

/* The way back to the landing page is a folder like any other; its label is two
   short lines rather than one long one, so it keeps the tab's proportions
   instead of forcing every folder wider. */
.yr-folder--home span {
  margin-top: 8%;
  font-size: clamp(9.5px, 1.52cqw, 14px);
  line-height: 1.14;
  text-align: center;
  letter-spacing: 0.02em;
}

@container (max-width: 700px) { .yr-folder { flex-basis: calc((100% - 4 * 18px) / 5.2); } }
@container (max-width: 479px) { .yr-folders { gap: 12px; }
                                .yr-folder  { flex-basis: calc((100% - 3 * 12px) / 3.5); } }

.yr-sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Fallback for engines without container-query units: pin the board to its
   intended desktop size rather than collapsing to zero. */
@supports not (width: 1cqw) {
  .db-inner { --u: 1px; width: 1226.98px; }
}

/* ---------- reduced motion ---------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  .draft-card-inner {
    transition-duration: 1ms;          /* flip still happens, just instantly  */
  }
}

/* -------------------------------------------------------------- navigation

     The widget runs inside Wix's iframe, so a link has to break out of that
     frame or the destination loads inside the embed. target="_top" says to do
     that, but the embed's sandbox has to allow top-level navigation for it to
     happen, and when it does not the browser blocks the click silently - no
     error, no navigation, a dead button.

     A click therefore takes the first of three routes that works:

       1. ask the Wix page to navigate, by postMessage. A few lines of Velo on
          that page turn this into an ordinary same-tab navigation - see VELO
          at the foot of this script. If nothing is listening this is a no-op,
          so it is safe to send either way.
       2. set window.top.location, which is what target="_top" does.
       3. still here a moment later means both were blocked, so open the page
          in a new tab rather than leave the click dead.

     Routes 1 and 2 unload this frame, and the host's acknowledgement cancels
     the timer outright, so route 3 only runs when nothing else could. Links
     keep their href, so right-click, copy link and middle-click all still
     behave normally. */

  var NAV_MSG = '440:navigate';

  /* What happens when the host page does not answer - no Velo listener, and a
     sandbox that blocks top navigation. The three possible behaviours are a
     new tab, loading inside the embed, or nothing; 'none' ships because the
     other two are the ones we are trying to avoid. With the Velo snippet in
     place this never comes up. */
  var NAV_FALLBACK = 'none';          /* 'none' | 'tab' | 'iframe' */

  var navTimer = null;

  function cancelNav() { if (navTimer) { clearTimeout(navTimer); navTimer = null; } }

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === NAV_MSG + ':ok') { cancelNav(); }
  });
  window.addEventListener('pagehide', cancelNav);
  window.addEventListener('beforeunload', cancelNav);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { cancelNav(); }
  });

  function goTo(url) {
    if (!url) { return; }
    cancelNav();

    /* Route 1: ask the Wix page to navigate. Velo answers this and the page
       changes in the same tab, which is the behaviour we want. */
    try { window.parent.postMessage({ type: NAV_MSG, url: url }, '*'); } catch (e) {}

    /* Route 2: do it ourselves. Works only where the embed's sandbox allows
       top-level navigation, which Wix's does not - harmless where it does. */
    try { (window.top || window).location.href = url; } catch (e) {}

    if (NAV_FALLBACK === 'none') { return; }
    navTimer = setTimeout(function () {
      navTimer = null;
      if (NAV_FALLBACK === 'tab') { window.open(url, '_blank', 'noopener'); }
      else if (NAV_FALLBACK === 'iframe') { window.location.href = url; }
    }, 1500);
  }

  /* Leaves the href in place and only takes over the plain left click. */
  function openInTop(a) {
    a.target = '_top';
    a.addEventListener('click', function (ev) {
      if (ev.defaultPrevented || ev.button !== 0 ||
          ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) { return; }
      ev.preventDefault();
      goTo(a.href);
    });
    return a;
  }

/* VELO - REQUIRED. Wix's embed blocks top-level navigation, so this is the
   only way these links can change the page without opening a tab or loading
   inside the embed. Turn on Dev Mode in the Wix editor, click the embed to
   read its element ID from the properties panel, and paste this into the page
   code of every page carrying one of these embeds, with #html1 swapped for
   that ID:

     import wixLocation from 'wix-location';

     $w.onReady(() => {
       $w('#html1').onMessage((event) => {
         const msg = event.data;
         if (msg && msg.type === '440:navigate' && typeof msg.url === 'string') {
           $w('#html1').postMessage({ type: '440:navigate:ok' });
           wixLocation.to(msg.url);
         }
       });
     });
*/

  function buildNav() {
    var title = document.getElementById('dbTitle');
    if (title) { title.textContent = YEAR + ' DRAFT RESULTS'; }

    var strip = document.getElementById('yrFolders');
    if (!strip) { return; }

    /* First folder in the row is the way back to the landing page. It is the
       one link here that opens a new tab rather than replacing this one. */
    var home = document.createElement('a');
    home.className = 'yr-folder yr-folder--home';
    home.href = HOME_URL;
    home.target = '_blank';
    home.rel = 'noopener';
    home.setAttribute('aria-label', 'Draft home (opens in a new tab)');
    home.appendChild(folderShape());
    var hs = document.createElement('span');
    hs.appendChild(document.createTextNode('DRAFT'));
    hs.appendChild(document.createElement('br'));
    hs.appendChild(document.createTextNode('HOME'));
    home.appendChild(hs);
    strip.appendChild(home);

    YEARS.forEach(function (y) {
      var here = (y === YEAR);
      var href = YEAR_PAGE[y];

      /* The year you are already on is a marker, not a link. */
      var node = document.createElement(here || !href ? 'div' : 'a');
      node.className = 'yr-folder' +
        (here ? ' yr-folder--now' : (href ? '' : ' yr-folder--soon'));

      if (here) {
        node.setAttribute('aria-current', 'page');
        node.setAttribute('aria-label', y + ' draft results, this page');
      } else if (href) {
        node.href = href;
        openInTop(node);
        node.setAttribute('aria-label', y + ' draft results');
      } else {
        node.setAttribute('aria-disabled', 'true');
        node.setAttribute('aria-label', y + ' draft results, coming soon');
      }

      node.appendChild(folderShape());
      var span = document.createElement('span');
      span.textContent = String(y);
      node.appendChild(span);
      strip.appendChild(node);
    });

    /* Open with this year's folder in view even when it is far down the list.
       The home folder still shows: the scroll stops one folder short of it. */
    var now = strip.querySelector('.yr-folder--now');
    if (now && now.offsetLeft + now.offsetWidth > strip.clientWidth) {
      strip.scrollLeft = now.offsetLeft - now.offsetWidth - 18;
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildNav);
  } else {
    buildNav();
  }
})();
  </script>

/* =============================================================================
   draft-board.js — renders the board and handles the flip interaction.
   Vanilla JS, no dependencies. Expects players.js to have loaded first.
   ============================================================================ */

(function () {
  'use strict';

  /* ---------------------------------------------------------------------------
     BACK-CARD SPEC
     ---------------------------------------------------------------------------
     Measured directly out of Back_Card_Example.svg. Every glyph in that file is
     an outline, so the numbers below were recovered by matching each outline
     against the supplied OTFs: the fitted sizes reproduce the original glyph
     heights to within 0.01 units, which is what pins down the weights.

       first name   Laro Soft Bold      18.84   x-scale 0.923   baseline 34.80
       last  name   Rotundo Regular     25.97   x-scale 1.000   baseline 61.00
       pill label   Laro Soft Bold      11.12   x-scale 0.920
       row label    Laro Soft Regular   12.00   x-scale 0.951   #808285
       row value    Laro Soft Bold      12.00   x-scale 0.950   #2d2d2d

     The artwork applies a slight horizontal squeeze to each text run (an
     Illustrator horizontal-scale setting); `scaleX` reproduces it rather than
     substituting a condensed weight.
  -------------------------------------------------------------------------- */

  var BACK = {
    W: 216,
    H: 367.02,
    R: 25.16,

    ink: '#2d2d2d',
    muted: '#808285',
    pillInk: '#333',
    pillBg: '#e4e4e4',
    paper: '#fff',

    firstName: { family: 'Laro Soft', weight: 700, size: 18.84, scaleX: 0.923, ls: 0.98, y: 34.80 },
    lastName:  { family: 'Rotundo',   weight: 400, size: 25.97, scaleX: 1.000, ls: 0.86, y: 61.00 },
    pillLabel: { family: 'Laro Soft', weight: 700, size: 11.12, scaleX: 0.920, ls: 0.33 },
    rowLabel:  { family: 'Laro Soft', weight: 400, size: 12.00, scaleX: 0.951, ls: 0.35 },
    rowValue:  { family: 'Laro Soft', weight: 700, size: 12.00, scaleX: 0.950, ls: 0.38 },

    pill: { x: 13.33, w: 189.33, h: 25.53, r: 12.765, yBio: 75.38, yStats: 211.88 },
    pillLabelY: { bio: 92.04, stats: 228.54 },

    centerX: 108,
    labelX: 19.80,            // left text origin for both sections
    bioValueX: 113.25,        // bio values are left-aligned in a second column
    statValueRight: 191.60,   // stat values are right-aligned to this guide

    bioY: [135.01, 161.79, 188.76],
    statY: [263.92, 290.70, 317.66],

    nameMaxWidth: 190,        // names stay inside the pill's left/right inset
    valueMaxRight: 202.67     // bio values stop at the pill's right edge
  };

  /* ---------- helpers ----------------------------------------------------- */

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /**
   * One SVG <text> run.
   *
   * The horizontal squeeze is applied as transform="scale(k,1)", so the x
   * coordinate is divided by k while y passes through untouched. Browsers add
   * letter-spacing after the final glyph too, which nudges middle/end anchored
   * runs; the anchor compensation below cancels that out.
   */
  function textRun(opts) {
    var f = opts.font;
    var k = f.scaleX;
    var x = opts.x / k;

    if (opts.anchor === 'middle') { x += f.ls / 2; }
    if (opts.anchor === 'end')    { x += f.ls; }

    return '<text class="' + (opts.cls || '') + '"' +
      ' transform="scale(' + k + ',1)"' +
      ' x="' + x.toFixed(4) + '" y="' + opts.y + '"' +
      ' text-anchor="' + (opts.anchor || 'start') + '"' +
      ' font-family="' + f.family + '"' +
      ' font-weight="' + f.weight + '"' +
      ' font-size="' + f.size + '"' +
      ' letter-spacing="' + f.ls + '"' +
      ' fill="' + opts.fill + '"' +
      ' xml:space="preserve">' + esc(opts.text) + '</text>';
  }

  function pill(y) {
    return '<rect x="' + BACK.pill.x + '" y="' + y +
      '" width="' + BACK.pill.w + '" height="' + BACK.pill.h +
      '" rx="' + BACK.pill.r + '" ry="' + BACK.pill.r +
      '" fill="' + BACK.pillBg + '"/>';
  }

  /* ---------- back face --------------------------------------------------- */

  function buildBackFace(player) {
    var bioRows = [
      { label: 'HT/WT',      value: player.bio.htWt },
      { label: 'BIRTH DATE', value: player.bio.birthDate },
      { label: 'COLLEGE',    value: player.bio.college }
    ];

    var statRows = [
      { label: player.stats.stat1Label, value: player.stats.stat1Value },
      { label: player.stats.stat2Label, value: player.stats.stat2Value },
      { label: player.stats.stat3Label, value: player.stats.stat3Value }
    ];

    var out = [];

    out.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' +
      BACK.W + ' ' + BACK.H + '" role="img" aria-label="' +
      esc(player.fullName) + ' player bio and 2025 statistics">');

    // card body — same dimensions and corner radius as the front artwork
    out.push('<rect x="0" y="0" width="' + BACK.W + '" height="' + BACK.H +
      '" rx="' + BACK.R + '" ry="' + BACK.R + '" fill="' + BACK.paper + '"/>');

    // name lockup
    out.push(textRun({
      x: BACK.centerX, y: BACK.firstName.y, anchor: 'middle',
      font: BACK.firstName, fill: BACK.ink, text: player.firstName, cls: 'db-fit-name'
    }));
    out.push(textRun({
      x: BACK.centerX, y: BACK.lastName.y, anchor: 'middle',
      font: BACK.lastName, fill: BACK.ink, text: player.lastName, cls: 'db-fit-name'
    }));

    // ---- PLAYER BIO --------------------------------------------------------
    out.push(pill(BACK.pill.yBio));
    out.push(textRun({
      x: BACK.centerX, y: BACK.pillLabelY.bio, anchor: 'middle',
      font: BACK.pillLabel, fill: BACK.pillInk, text: BACK_CARD_SECTIONS.bio
    }));

    bioRows.forEach(function (row, i) {
      out.push(textRun({
        x: BACK.labelX, y: BACK.bioY[i], anchor: 'start',
        font: BACK.rowLabel, fill: BACK.muted, text: row.label
      }));
      out.push(textRun({
        x: BACK.bioValueX, y: BACK.bioY[i], anchor: 'start',
        font: BACK.rowValue, fill: BACK.ink, text: row.value, cls: 'db-fit-value'
      }));
    });

    // ---- 2025 STATS --------------------------------------------------------
    out.push(pill(BACK.pill.yStats));
    out.push(textRun({
      x: BACK.centerX, y: BACK.pillLabelY.stats, anchor: 'middle',
      font: BACK.pillLabel, fill: BACK.pillInk, text: BACK_CARD_SECTIONS.stats
    }));

    statRows.forEach(function (row, i) {
      out.push(textRun({
        x: BACK.labelX, y: BACK.statY[i], anchor: 'start',
        font: BACK.rowLabel, fill: BACK.muted, text: row.label
      }));
      out.push(textRun({
        x: BACK.statValueRight, y: BACK.statY[i], anchor: 'end',
        font: BACK.rowValue, fill: BACK.ink, text: row.value
      }));
    });

    out.push('</svg>');
    return out.join('');
  }

  /**
   * Long names ("MCCAFFREY") and long values ("5'11", 215 LBS") would run past
   * the card edge at the reference type size. Shrink only those runs, only as
   * far as needed — everything that already fits keeps the measured size.
   */
  function fitOverlongText(svg) {
    var scaleOf = function (node) {
      var m = /scale\(([-\d.]+)/.exec(node.getAttribute('transform') || '');
      return m ? parseFloat(m[1]) : 1;
    };

    Array.prototype.forEach.call(svg.querySelectorAll('.db-fit-name'), function (node) {
      var k = scaleOf(node);
      var width = node.getComputedTextLength() * k;
      if (width > BACK.nameMaxWidth) {
        var size = parseFloat(node.getAttribute('font-size'));
        node.setAttribute('font-size', (size * BACK.nameMaxWidth / width).toFixed(3));
      }
    });

    Array.prototype.forEach.call(svg.querySelectorAll('.db-fit-value'), function (node) {
      var k = scaleOf(node);
      var right = BACK.bioValueX + node.getComputedTextLength() * k;
      if (right > BACK.valueMaxRight) {
        var size = parseFloat(node.getAttribute('font-size'));
        var avail = BACK.valueMaxRight - BACK.bioValueX;
        node.setAttribute('font-size', (size * avail / (right - BACK.bioValueX)).toFixed(3));
      }
    });
  }

  /* ---------- card -------------------------------------------------------- */

  function buildCard(player) {
    var card = document.createElement('button');
    card.type = 'button';
    card.className = 'draft-card';
    card.dataset.pick = player.pick;
    card.setAttribute('aria-pressed', 'false');
    card.setAttribute('aria-label', 'Flip card for ' + player.fullName + ' statistics');

    var inner = document.createElement('div');
    inner.className = 'draft-card-inner';

    // FRONT — the supplied SVG, used as-is. Never redrawn in HTML.
    var front = document.createElement('div');
    front.className = 'draft-card-front';
    var img = document.createElement('img');
    img.src = player.art;
    img.alt = '';                        // decorative: the button carries the label
    img.setAttribute('aria-hidden', 'true');
    img.draggable = false;
    front.appendChild(img);

    // BACK — rebuilt from the supplied Back_Card_Example.svg template.
    var back = document.createElement('div');
    back.className = 'draft-card-back';
    back.innerHTML = buildBackFace(player);

    inner.appendChild(front);
    inner.appendChild(back);
    card.appendChild(inner);

    // <button> already handles click, Enter and Space.
    card.addEventListener('click', function () {
      var flipped = card.classList.toggle('is-flipped');
      card.setAttribute('aria-pressed', String(flipped));
      card.setAttribute(
        'aria-label',
        (flipped ? 'Flip card back to ' : 'Flip card for ') + player.fullName +
        (flipped ? ' artwork' : ' statistics')
      );
    });

    return card;
  }

  /* ---------- boot -------------------------------------------------------- */

  function render(root) {
    var grid = root.querySelector('.db-grid');
    var frag = document.createDocumentFragment();

    PLAYERS.forEach(function (player) {
      frag.appendChild(buildCard(player));
    });

    grid.appendChild(frag);

    // getComputedTextLength() needs the real font, so wait for it to load.
    var fit = function () {
      Array.prototype.forEach.call(grid.querySelectorAll('.draft-card-back svg'), fitOverlongText);
    };

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fit);
    } else {
      window.addEventListener('load', fit);
    }
  }

  function init() {
    var board = document.querySelector('.draft-board');
    if (board) { render(board); }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

  </script>
</body>
</html>
