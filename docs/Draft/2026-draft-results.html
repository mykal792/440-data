/* ---------- page shell -------------------------------------------------- */

.dr-viewport {
  container-type: inline-size;
  width: 100%;
  max-width: 905px;        /* the site's content column */
  margin: 0 auto;
  -webkit-text-size-adjust: 100%;
}

.dr-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);   /* desktop: two rounds per row */
  gap: clamp(16px, 3.2cqw, 30px);
}

/* Mobile: one round per row, scrolled through top to bottom. */
@container (max-width: 640px) {
  .dr-grid { grid-template-columns: 1fr; }
}

/* ---------- one round block --------------------------------------------- */

/* The wrapper is the query container; the block reads its own width through
   it, so a round scales as one rigid artboard. (A container cannot query
   itself, hence the extra element.) */
.dr-block { container-type: inline-size; }

.dr-round {
  /* 1 design unit. 100cqw is the block width, 379.825 is the artboard. */
  --u: calc(100cqw / 379.825);
  box-sizing: border-box;
  width: 100%;
  background: #e4e4e4;
  border-radius: calc(26.379 * var(--u));
  padding: calc(14.4 * var(--u));
}

.dr-panel {
  box-sizing: border-box;
  background: #fff;
  border-radius: calc(11.979 * var(--u));
  padding: 0 calc(7.53 * var(--u)) calc(12.99 * var(--u));
}

/* ---------- shared column grid ------------------------------------------ */

.dr-head,
.dr-row {
  display: grid;
  grid-template-columns: calc(27.54 * var(--u)) calc(56.445 * var(--u)) minmax(0, 1fr) calc(28.224 * var(--u)) calc(71.51 * var(--u));
  box-sizing: border-box;
}

/* ---------- header ------------------------------------------------------ */

.dr-head {
  height: calc(37.056 * var(--u));
  align-items: end;                       /* baselines matched via padding  */
  border-bottom: calc(1.5 * var(--u)) solid #ccc;
}

.dr-head__title {
  grid-column: 1 / 3;
  padding-left: calc(7.518 * var(--u));
  padding-bottom: calc(6.566 * var(--u));
  font-family: 'Rotundo', system-ui, sans-serif;
  font-size: calc(14 * var(--u));
  line-height: 1;
  letter-spacing: 0.02em;
  color: #333;
  white-space: nowrap;
}

.dr-head__lbl {
  padding-bottom: calc(7.266 * var(--u));
  font-family: 'Rotundo', system-ui, sans-serif;
  font-size: calc(7 * var(--u));
  line-height: 1;
  letter-spacing: 0.05em;
  color: #333;
  white-space: nowrap;
}


.dr-hl-name { padding-left: calc(15.57 * var(--u)); }
.dr-hl-pos  { justify-self: center; }
.dr-hl-team { justify-self: center; }

/* ---------- rows -------------------------------------------------------- */

.dr-row {
  height: calc(32.4347 * var(--u));
  align-items: center;
  border-bottom: calc(1.5 * var(--u)) solid #ccc;
}

.dr-row:last-child { border-bottom: 0; }

.dr-cell { min-width: 0; }

.dr-pick {
  text-align: center;
  font-family: 'Rotundo', system-ui, sans-serif;
  font-size: calc(7 * var(--u));
  line-height: 1;
  letter-spacing: 0.04em;
  color: #333;
}

/* manager chip */
.dr-mgr { display: flex; justify-content: flex-start; }

.dr-chip {
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: calc(56.445 * var(--u));
  height: calc(16.217 * var(--u));
  border-radius: calc(4.204 * var(--u));
  background: #e4e4e4;
  font-family: 'Rotundo', system-ui, sans-serif;
  font-size: calc(7 * var(--u));
  line-height: 1;
  letter-spacing: 0.04em;
  color: #333;
  white-space: nowrap;
}

/* player name */
.dr-name {
  display: flex;                                 /* no inherited 16px text strut */
  align-items: center;
  padding-left: calc(15.57 * var(--u));
  padding-right: calc(6 * var(--u));             /* keeps names off the badge      */
  white-space: nowrap;
  overflow: hidden;
}

.dr-nm {
  display: inline-block;
  flex: none;
  font-family: 'Laro Soft', system-ui, sans-serif;
  font-weight: 500;
  font-size: calc(10 * var(--u));
  line-height: 1;
  letter-spacing: 0.03em;
  color: #333;
  text-transform: uppercase;
  white-space: nowrap;
}

/* position badge */
.dr-pos { display: flex; justify-content: center; }

.dr-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: calc(28.224 * var(--u));
  height: calc(16.923 * var(--u));
  border-radius: calc(5.786 * var(--u));
  font-family: 'Rotundo', system-ui, sans-serif;
  font-size: calc(10 * var(--u));
  line-height: 1;
  letter-spacing: 0.04em;
  color: #fff;
}

/* nfl team — centred on the column axis, matching the TEAM label */
.dr-team {
  justify-self: center;
  font-family: 'Rotundo', system-ui, sans-serif;
  font-size: calc(10 * var(--u));
  line-height: 1;
  letter-spacing: 0.03em;
  color: #333;
  white-space: nowrap;
}


/* ---------- one line through the row ------------------------------------

   Measured, not guessed. Rotundo declares USE_TYPO_METRICS, so every engine
   lays it out on an ascent of 0.8em over a descent of 0.2em, while its caps
   are 0.7em tall. A line-height:1 box centred in the pill therefore centres
   that 0.8/0.2 box, not the caps, and the caps land 0.05em above centre:
   measured in Chromium at 20x scale the badge ran 4.45u of air above the cap
   and 5.49u below it, against a pill 16.923u tall.

   `text-box: trim-both cap alphabetic` makes each box exactly the cap band —
   cap-top to baseline, no ascender space above, no descender space below — so
   centring the box centres the caps. Measured after the change: 4.96u above,
   4.96u below, for every label. The Q's tail hangs past the baseline by
   0.14em and is deliberately ignored, the same way a typesetter ignores it.

   The same trim puts the pick number, the manager chip, the player name, the
   badge and the NFL team on one optical line, whatever size each is set at.
   ----------------------------------------------------------------------- */

.dr-pick,
.dr-team,
.dr-nm,
.dr-chip__t,
.dr-badge__t {
  text-box: trim-both cap alphabetic;
}

/* Text inside a pill is centred in its pill; free text in the row shares one
   baseline, the way the printed board sets it. The pick number is 7u against
   10u names and teams, so centring its cap band would leave it half the
   cap-height difference high - 1.05u brings it down onto their baseline. */
.dr-pick { transform: translateY(calc(1.05 * var(--u))); }

/* The header lines up on a baseline instead: a trimmed box bottoms out on the
   baseline, so aligning the ends of these boxes aligns the baselines. */
.dr-head { align-items: end; }

.dr-head__title,
.dr-head__lbl {
  text-box: trim-both cap alphabetic;
  padding-bottom: calc(7.966 * var(--u));
}

@supports not (text-box: trim-both cap alphabetic) {
  /* Firefox for now. Same correction arrived at arithmetically: Rotundo needs
     0.05em down (0.85em - 0.80em), Laro Soft - which does not set
     USE_TYPO_METRICS, so it lays out on 1.3/0.5 - needs 0.05em up. */
  .dr-team,
  .dr-chip__t,
  .dr-badge__t { transform: translateY(0.05em); }
  .dr-pick     { transform: translateY(calc(1.05 * var(--u) + 0.05em)); }
  .dr-nm       { transform: translateY(-0.05em); }

  .dr-head__title { padding-bottom: calc(6.566 * var(--u)); }
  .dr-head__lbl   { padding-bottom: calc(7.266 * var(--u)); }
}

/* Engines without container-query units: pin a block to its artboard size
   rather than letting --u collapse to zero. */
@supports not (width: 1cqw) {
  .dr-round { --u: 1px; }
}

</style>
</head>
<body style="margin:0;background:transparent;">

<div class="dr-viewport">
  <div class="dr-grid" id="drGrid"></div>
</div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------- config */

  /* Round 1 lives in the flip-card board above this widget, so the blocks
     start at round 2. Set to 1 to render a round-1 block here as well. */
  var START_ROUND = 2;
  var END_ROUND   = 15;

  /* Position badge colours, sampled from the supplied artwork. */
  var POS_COLOR = {
    QB:  '#ff4858',
    RB:  '#049dd9',
    WR:  '#28b99a',
    TE:  '#ff8a2a',
    K:   '#b157f5',
    DEF: '#989898'
  };

  /* [manager, player, position, nfl team] in draft order, snake applied. */
  var DRAFT = {"1":[["GARRETT","Jahmyr Gibbs","RB","DET"],["ANTHONY","Bijan Robinson","RB","ATL"],["GRAHAM","Puka Nacua","WR","LAR"],["SCOTTY","Ja’Marr Chase","WR","CIN"],["SCARPITTI","Jaxon Smith-Njigba","WR","SEA"],["GREG","James Cook","RB","BUF"],["GANGUS","Amon-Ra St. Brown","WR","DET"],["COYNE","Jonathan Taylor","RB","IND"],["HAYDEN","Derrick Henry","RB","BAL"],["SCHILLING","Christian McCaffrey","RB","SF"]],"2":[["SCHILLING","CeeDee Lamb","WR","DAL"],["HAYDEN","Kenneth Walker III","RB","KC"],["COYNE","Ashton Jeanty","RB","LV"],["GANGUS","Saquon Barkley","RB","PHI"],["GREG","Chase Brown","RB","CIN"],["SCARPITTI","George Pickens","WR","DAL"],["SCOTTY","De’Von Achane","RB","MIA"],["GRAHAM","Justin Jefferson","WR","MIN"],["ANTHONY","Omarion Hampton","RB","LAC"],["GARRETT","Drake London","WR","ATL"]],"3":[["GARRETT","Rashee Rice","WR","KC"],["ANTHONY","A.J. Brown","WR","NE"],["GRAHAM","Kyren Williams","RB","LAR"],["SCOTTY","Chris Olave","WR","NO"],["SCARPITTI","Josh Allen","QB","BUF"],["GREG","Nico Collins","WR","HOU"],["GANGUS","Javonte Williams","RB","DAL"],["COYNE","DeVonta Smith","WR","PHI"],["HAYDEN","Brock Bowers","TE","LV"],["SCHILLING","Josh Jacobs","RB","GB"]],"4":[["SCHILLING","Jaylen Waddle","WR","DEN"],["HAYDEN","Zay Flowers","WR","BAL"],["COYNE","Jeremiyah Love","RB","ARI"],["GANGUS","Trey McBride","TE","ARI"],["GREG","Tee Higgins","WR","CIN"],["SCARPITTI","Breece Hall","RB","NYJ"],["SCOTTY","Malik Nabers","WR","NYG"],["GRAHAM","Travis Etienne Jr.","RB","NO"],["ANTHONY","Drake Maye","QB","NE"],["GARRETT","Cam Skattebo","RB","NYG"]],"5":[["GARRETT","D’Andre Swift","RB","CHI"],["ANTHONY","Ladd McConkey","WR","LAC"],["GRAHAM","David Montgomery","RB","HOU"],["SCOTTY","Lamar Jackson","QB","BAL"],["SCARPITTI","Parker Washington","WR","JAX"],["GREG","Emeka Egbuka","WR","TB"],["GANGUS","Tetairoa McMillan","WR","CAR"],["COYNE","Garrett Wilson","WR","NYJ"],["HAYDEN","Bucky Irving","RB","TB"],["SCHILLING","Colston Loveland","TE","CHI"]],"6":[["SCHILLING","Joe Burrow","QB","CIN"],["HAYDEN","Terry McLaurin","WR","WAS"],["COYNE","Davante Adams","WR","LAR"],["GANGUS","Quinshon Judkins","RB","CLE"],["GREG","Jalen Hurts","QB","PHI"],["SCARPITTI","Bhayshul Tuten","RB","JAX"],["SCOTTY","TreVeyon Henderson","RB","NE"],["GRAHAM","Mike Evans","WR","SF"],["ANTHONY","Tyler Warren","TE","IND"],["GARRETT","Brian Thomas Jr.","WR","JAX"]],"7":[["GARRETT","Jaylen Warren","RB","PIT"],["ANTHONY","Tony Pollard","RB","TEN"],["GRAHAM","Luther Burden III","WR","CHI"],["SCOTTY","Rhamondre Stevenson","RB","NE"],["SCARPITTI","DJ Moore","WR","BUF"],["GREG","Tucker Kraft","TE","GB"],["GANGUS","Jayden Daniels","QB","WAS"],["COYNE","Sam LaPorta","TE","DET"],["HAYDEN","Jadarian Price","RB","SEA"],["SCHILLING","Christian Watson","WR","GB"]],"8":[["SCHILLING","Rico Dowdle","RB","PIT"],["HAYDEN","Jameson Williams","WR","DET"],["COYNE","Caleb Williams","QB","CHI"],["GANGUS","Rome Odunze","WR","CHI"],["GREG","Marvin Harrison Jr.","WR","ARI"],["SCARPITTI","Carnell Tate","WR","TEN"],["SCOTTY","Kyle Pitts Sr.","TE","ATL"],["GRAHAM","Chuba Hubbard","RB","CAR"],["ANTHONY","J.K. Dobbins","RB","DEN"],["GARRETT","Harold Fannin Jr.","TE","CLE"]],"9":[["GARRETT","Dak Prescott","QB","DAL"],["ANTHONY","DK Metcalf","WR","PIT"],["GRAHAM","Justin Herbert","QB","LAC"],["SCOTTY","RJ Harvey","RB","DEN"],["SCARPITTI","Blake Corum","RB","LAR"],["GREG","Kenny Gainwell","RB","TB"],["GANGUS","Jonathon Brooks","RB","CAR"],["COYNE","Courtland Sutton","WR","DEN"],["HAYDEN","Jacory Croskey-Merritt","RB","WAS"],["SCHILLING","Makai Lemon","WR","PHI"]],"10":[["SCHILLING","Josh Downs","WR","IND"],["HAYDEN","Trevor Lawrence","QB","JAX"],["COYNE","Aaron Jones Sr.","RB","MIN"],["GANGUS","Alec Pierce","WR","IND"],["GREG","Patrick Mahomes","QB","KC"],["SCARPITTI","George Kittle","TE","SF"],["SCOTTY","Matthew Stafford","QB","LAR"],["GRAHAM","Travis Kelce","TE","KC"],["ANTHONY","Mark Andrews","TE","BAL"],["GARRETT","Kyle Monangai","RB","CHI"]],"11":[["GARRETT","Xavier Worthy","WR","KC"],["ANTHONY","Quentin Johnston","WR","LAC"],["GRAHAM","Jordyn Tyson","WR","NO"],["SCOTTY","KC Concepcion","WR","CLE"],["SCARPITTI","Woody Marks","RB","HOU"],["GREG","Michael Wilson","WR","ARI"],["GANGUS","Michael Pittman Jr.","WR","PIT"],["COYNE","Brock Purdy","QB","SF"],["HAYDEN","Chris Godwin Jr.","WR","TB"],["SCHILLING","Jaxson Dart","QB","NYG"]],"12":[["SCHILLING","Keaton Mitchell","RB","LAC"],["HAYDEN","Jordan Mason","RB","MIN"],["COYNE","Dalton Kincaid","TE","BUF"],["GANGUS","Isaiah Likely","TE","NYG"],["GREG","Rachaad White","RB","WAS"],["SCARPITTI","Bo Nix","QB","DEN"],["SCOTTY","Brandon Aubrey","K","DAL"],["GRAHAM","Chris Rodriguez Jr.","RB","JAX"],["ANTHONY","Jayden Reed","WR","GB"],["GARRETT","Isiah Pacheco","RB","DET"]],"13":[["GARRETT","Jakobi Meyers","WR","JAX"],["ANTHONY","Tyrone Tracy Jr.","RB","NYG"],["GRAHAM","Jared Goff","QB","DET"],["SCOTTY","Texans","DEF","HOU"],["SCARPITTI","Juwan Johnson","TE","NO"],["GREG","Dallas Goedert","TE","PHI"],["GANGUS","Kyler Murray","QB","MIN"],["COYNE","Tyjae Spears","RB","TEN"],["HAYDEN","Deebo Samuel Sr.","WR","SF"],["SCHILLING","Jake Ferguson","TE","DAL"]],"14":[["SCHILLING","Cameron Dicker","K","LAC"],["HAYDEN","Broncos","DEF","DEN"],["COYNE","Eagles","DEF","PHI"],["GANGUS","Ka’imi Fairbairn","K","HOU"],["GREG","Tyler Loop","K","BAL"],["SCARPITTI","Steelers","DEF","PIT"],["SCOTTY","Tank Bigsby","RB","PHI"],["GRAHAM","Seahawks","DEF","SEA"],["ANTHONY","Rams","DEF","LAR"],["GARRETT","Ravens","DEF","BAL"]],"15":[["GARRETT","Cam Little","K","JAX"],["ANTHONY","Eddy Pineiro","K","SF"],["GRAHAM","Jason Myers","K","SEA"],["SCOTTY","Wan’Dale Robinson","WR","TEN"],["SCARPITTI","Cairo Santos","K","CHI"],["GREG","Patriots","DEF","NE"],["GANGUS","Jaguars","DEF","JAX"],["COYNE","Harrison Mevis","K","LAR"],["HAYDEN","Evan McPherson","K","CIN"],["SCHILLING","Packers","DEF","GB"]]};

  /* ---------------------------------------------------------------- build */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text != null) { n.textContent = text; }
    return n;
  }

  /* "Christian McCaffrey" -> "C. McCaffrey" — the fallback used whenever a
     name is wider than the player column, same as the print board. */
  function abbreviate(name) {
    var parts = name.split(' ');
    if (parts.length < 2) { return name; }
    return parts[0].charAt(0) + '. ' + parts.slice(1).join(' ');
  }

  function buildRow(pick, entry) {
    var row = el('div', 'dr-row');
    row.setAttribute('role', 'row');

    row.appendChild(el('div', 'dr-cell dr-pick', String(pick)));

    var mgr = el('div', 'dr-cell dr-mgr');
    var chip = el('span', 'dr-chip');
    chip.appendChild(el('span', 'dr-chip__t', entry[0]));
    mgr.appendChild(chip);
    row.appendChild(mgr);

    var name = el('div', 'dr-cell dr-name');
    var nm = el('span', 'dr-nm', entry[1]);
    nm.setAttribute('data-full', entry[1]);
    nm.setAttribute('data-abbr', abbreviate(entry[1]));
    name.appendChild(nm);
    row.appendChild(name);

    var pos = el('div', 'dr-cell dr-pos');
    var badge = el('span', 'dr-badge');
    badge.appendChild(el('span', 'dr-badge__t', entry[2]));
    badge.style.background = POS_COLOR[entry[2]] || POS_COLOR.DEF;
    pos.appendChild(badge);
    row.appendChild(pos);

    row.appendChild(el('div', 'dr-cell dr-team', entry[3]));
    return row;
  }

  function buildRound(num, picks) {
    var outer = el('div', 'dr-block');
    var block = el('section', 'dr-round');
    block.setAttribute('aria-label', 'Round ' + num + ' picks');

    var panel = el('div', 'dr-panel');

    var head = el('div', 'dr-head');
    head.appendChild(el('div', 'dr-head__title', 'ROUND ' + num));
    head.appendChild(el('div', 'dr-head__lbl dr-hl-name', 'PLAYER'));
    head.appendChild(el('div', 'dr-head__lbl dr-hl-pos', 'POSITION'));
    head.appendChild(el('div', 'dr-head__lbl dr-hl-team', 'TEAM'));
    panel.appendChild(head);

    var rows = el('div', 'dr-rows');
    rows.setAttribute('role', 'table');
    picks.forEach(function (entry, i) {
      rows.appendChild(buildRow(i + 1, entry));
    });
    panel.appendChild(rows);

    block.appendChild(panel);
    outer.appendChild(block);
    return outer;
  }

  /* ------------------------------------------------------------------ fit */

  /* A handful of names ("Jacory Croskey-Merritt") are wider than the player
     column at the reference size. Try the full name, fall back to the
     abbreviated form, and only then shrink the type — so every name that
     already fits keeps the measured size. */
  function fitNames(root) {
    var nodes = root.querySelectorAll('.dr-nm');
    for (var i = 0; i < nodes.length; i++) {
      var nm = nodes[i];
      var cell = nm.parentNode;
      var cs = getComputedStyle(cell);
      var avail = cell.clientWidth -
        parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
      if (!(avail > 0)) { continue; }

      nm.style.fontSize = '';
      nm.textContent = nm.getAttribute('data-full');
      if (nm.getBoundingClientRect().width <= avail) { continue; }

      nm.textContent = nm.getAttribute('data-abbr');
      var w = nm.getBoundingClientRect().width;
      if (w <= avail) { continue; }

      var size = parseFloat(getComputedStyle(nm).fontSize);
      nm.style.fontSize = (size * avail / w).toFixed(3) + 'px';
    }
  }

  /* ----------------------------------------------------------------- boot */

  function init() {
    var grid = document.getElementById('drGrid');
    if (!grid) { return; }

    var frag = document.createDocumentFragment();
    for (var n = START_ROUND; n <= END_ROUND; n++) {
      var picks = DRAFT[String(n)];
      if (picks) { frag.appendChild(buildRound(n, picks)); }
    }
    grid.appendChild(frag);

    var run = function () { fitNames(grid); };

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(run);
    } else {
      window.addEventListener('load', run);
    }
    run();

    var t;
    window.addEventListener('resize', function () {
      clearTimeout(t);
      t = setTimeout(run, 120);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
