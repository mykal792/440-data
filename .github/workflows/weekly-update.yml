name: Weekly league update (manual backup)
# NO SCHEDULE. Settlement and standings now run inside "Live scoring" every
# 10 minutes, so nothing depends on a Tuesday schedule firing. GitHub's cron
# missed the first two Tuesdays of the season, which is why this moved.
#
# This stays as a button in case you ever want to force a settle-and-standings
# run on its own: Actions -> Weekly league update -> Run workflow. It is safe to
# press any time - settle never overwrites a week already in the ledger, and
# standings only commits when something changed.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-scoring
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install 'yahoofantasy==1.4.9'
      - name: Restore Yahoo token
        env:
          YAHOO_TOKEN_B64: ${{ secrets.YAHOO_TOKEN_B64 }}
        run: |
          if [ -z "$YAHOO_TOKEN_B64" ]; then
            echo "::error::YAHOO_TOKEN_B64 secret is not set."; exit 1
          fi
          echo "$YAHOO_TOKEN_B64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/.yahoofantasy"
      - name: Settle finished weeks
        continue-on-error: true
        run: python settle_week.py --auto --apply
      - name: Pull standings
        continue-on-error: true
        run: python pull_standings.py
      - name: Publish if changed
        if: always()
        run: |
          FILES="docs/season.json bank-ledger.json"
          # Stage first, THEN compare. "git diff" alone can't see files that
          # have never been committed, so a brand-new output (dots.json in
          # week 2) was written every run and silently discarded as "no change"
          # whenever nothing else changed alongside it.
          # One at a time: "git add" rejects the whole list if any single
          # file is missing, so one failed script would block the rest.
          for f in $FILES; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "No change this run."; exit 0
          fi
          git config user.name  "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git commit -m "Weekly update - $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          echo "::error::push failed after 3 attempts"; exit 1
