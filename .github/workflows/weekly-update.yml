name: Weekly league update
# Cron is UTC. Both lines are here on purpose: 9:00 UTC is 5am EDT and 10:00
# UTC is 5am EST, so one of them is always the right 5am and the other runs an
# hour off. A harmless second run - it just finds nothing changed.
on:
  workflow_dispatch:        # the "Run workflow" button, for testing
  schedule:
    - cron: '0 9 * * 2'     # 5am EDT  (Sep - early Nov)
    - cron: '0 10 * * 2'    # 5am EST  (Nov - Jan)
permissions:
  contents: write
concurrency:
  group: weekly-update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.11 on purpose. yahoofantasy calls ssl.wrap_socket(), removed in
          # 3.12 — the same thing patched locally. Staying on 3.11 avoids it.
          python-version: '3.11'
      - name: Install
        run: pip install 'yahoofantasy==1.4.9'
      - name: Restore Yahoo token
        env:
          YAHOO_TOKEN_B64: ${{ secrets.YAHOO_TOKEN_B64 }}
        run: |
          if [ -z "$YAHOO_TOKEN_B64" ]; then
            echo "::error::YAHOO_TOKEN_B64 secret is not set."; exit 1
          fi
          # The library reads .yahoofantasy from the CURRENT DIRECTORY, not
          # $HOME. Writing it to $HOME looks right and fails every time.
          echo "$YAHOO_TOKEN_B64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/.yahoofantasy"
      - name: Pull standings
        # Also merges bank-ledger.json into season.json, so paste the week's
        # winners into the ledger BEFORE this runs on Tuesday morning.
        run: python pull_standings.py
      - name: Publish if changed
        run: |
          if git diff --quiet -- docs/season.json; then
            echo "No change this run."; exit 0
          fi
          git config user.name  "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add docs/season.json
          git commit -m "Update standings — $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
