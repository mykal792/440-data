name: Weekly league update
# Tuesday 6am ET. Settles the finished week into bank-ledger.json, then rebuilds
# the standings and the DraftKings high-score board so all three land in the
# same commit.
#
# Four cron lines on purpose. Each pair covers a timezone - 10:00 UTC is 6am EDT
# and 11:00 UTC is 6am EST - and the later pair is an 8am backstop. 6am is close
# behind Monday Night Football and Yahoo does not always have the week marked
# final by then; on 2026-09-15 the scoreboard still read "live" at 1:55am ET.
# If 6am is too early the job simply does nothing and 8am catches it, instead of
# the week going unrecorded until the following Tuesday.
#
# Repeat runs are harmless: settle refuses a week already in the ledger, and the
# pulls then find nothing changed and skip the commit.
#
# Minute 17 rather than 00 - GitHub's scheduler is best-effort and the top of
# the hour is the most contested minute on the platform.
on:
  workflow_dispatch:        # the "Run workflow" button, for testing
  schedule:
    - cron: '17 10 * * 2'   # 6am EDT  (Sep - early Nov)
    - cron: '17 11 * * 2'   # 6am EST  (Nov - Jan)
    - cron: '17 12 * * 2'   # 8am EDT  backstop
    - cron: '17 13 * * 2'   # 8am EST  backstop
permissions:
  contents: write
concurrency:
  group: weekly-update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.11 on purpose. yahoofantasy calls ssl.wrap_socket(), removed in
          # 3.12 - the same thing patched locally. Staying on 3.11 avoids it.
          python-version: '3.11'
      - name: Install
        run: pip install 'yahoofantasy==1.4.9'
      - name: Restore Yahoo token
        env:
          YAHOO_TOKEN_B64: ${{ secrets.YAHOO_TOKEN_B64 }}
        run: |
          if [ -z "$YAHOO_TOKEN_B64" ]; then
            echo "::error::YAHOO_TOKEN_B64 secret is not set."; exit 1
          fi
          # The library reads .yahoofantasy from the CURRENT DIRECTORY, not
          # $HOME. Writing it to $HOME looks right and fails every time.
          echo "$YAHOO_TOKEN_B64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/.yahoofantasy"
      - name: Settle last week
        # Works out which week is finished and unsettled, then writes the six
        # winners (High Score, the weekly category, and four Dot Pot positions)
        # into bank-ledger.json. Ties split evenly. Refuses a week that is not
        # final, and refuses a week already in the ledger - so a retry, a
        # manual re-run, or the second cron line above never pays anyone twice.
        run: python settle_week.py --auto --apply
      - name: Pull standings
        # Reads the ledger the step above just wrote, so records, averages and
        # the bank column all land in the same commit.
        run: python pull_standings.py
      - name: Pull DraftKings ticker
        # Also reads the ledger - the High Score board is built from it, so it
        # has to run after settle or the board publishes a week behind. Without
        # this it only refreshes on the next live run, which is why week 1's
        # high score sat empty from 12:07 until 13:00 UTC.
        run: python pull_dk.py
      - name: Publish if changed
        run: |
          FILES="docs/season.json bank-ledger.json docs/dk.json"
          if git diff --quiet -- $FILES; then
            echo "No change this run."; exit 0
          fi
          git config user.name  "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add $FILES
          git commit -m "Weekly update - $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          echo "::error::push failed after 3 attempts"; exit 1
