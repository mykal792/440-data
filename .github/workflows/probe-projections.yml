name: Probe projections

# Manual only - no schedule. Answers one question: does Yahoo return
# per-player projections in a payload we already fetch? Writes nothing,
# commits nothing, touches no file in docs/. Read the answer in the log,
# then delete this workflow and probe_projections.py.

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week number (blank = current week)'
        required: false
        default: ''
      team:
        description: 'Team id (blank = first in TEAM_MAP)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install 'yahoofantasy==1.4.9'
      - name: Restore Yahoo token
        env:
          YAHOO_TOKEN_B64: ${{ secrets.YAHOO_TOKEN_B64 }}
        run: |
          if [ -z "$YAHOO_TOKEN_B64" ]; then
            echo "::error::YAHOO_TOKEN_B64 secret is not set."; exit 1
          fi
          echo "$YAHOO_TOKEN_B64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/.yahoofantasy"
      - name: Probe
        run: |
          ARGS=""
          if [ -n "${{ inputs.week }}" ]; then ARGS="$ARGS --week ${{ inputs.week }}"; fi
          if [ -n "${{ inputs.team }}" ]; then ARGS="$ARGS --team ${{ inputs.team }}"; fi
          python probe_projections.py $ARGS
