name: Live scoring
# Cron is UTC and ignores daylight saving; these cover EDT (Sep - early Nov).
# In November, shift each block one hour later.
#
# UTC day numbers look shifted because ET evening games fall on the NEXT UTC
# day: '* * 4' is Wednesday night ET, '* * 5' is Thursday night ET, and so on.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 0-4 * * 4'     # Wednesday night opener, Sep 9 only
    - cron: '*/10 0-4 * * 5'     # Thursday Night Football
    - cron: '*/10 18-23 * * 4'   # Thanksgiving afternoon games (week 13)
    - cron: '*/10 18-23 * * 6'   # Saturday afternoon (late-season games)
    - cron: '*/10 0-4 * * 0'     # Saturday night into Sunday ET
    - cron: '*/10 17-23 * * 0'   # Sunday 1pm - 8pm ET
    - cron: '*/10 0-4 * * 1'     # Sunday night into Monday ET
    - cron: '*/10 0-4 * * 2'     # Monday Night Football
permissions:
  contents: write
concurrency:
  group: live-scoring
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install 'yahoofantasy==1.4.9'
      - name: Restore Yahoo token
        env:
          YAHOO_TOKEN_B64: ${{ secrets.YAHOO_TOKEN_B64 }}
        run: |
          if [ -z "$YAHOO_TOKEN_B64" ]; then
            echo "::error::YAHOO_TOKEN_B64 secret is not set."; exit 1
          fi
          echo "$YAHOO_TOKEN_B64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/.yahoofantasy"
      - name: Pull live scores and bonus race
        run: python pull_live.py
      - name: Pull DraftKings ticker
        run: python pull_dk.py
      - name: Publish if changed
        run: |
          FILES="docs/bonus.json docs/scoreboard.json docs/dk.json"
          if git diff --quiet -- $FILES; then
            echo "No change."; exit 0
          fi
          git config user.name  "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add $FILES
          git commit -m "Live update $(date -u +'%H:%M UTC')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          echo "::error::push failed after 3 attempts"; exit 1
