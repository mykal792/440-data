name: Live scoring
# SCHEDULE DISABLED until Week 1 has been run by hand successfully.
# To switch it back on, delete the '#' from the five lines below.
# Cron is UTC and ignores daylight saving; these cover EDT (Sep - early Nov).
# In November, shift each block one hour later.
#
#  schedule:
#    - cron: '*/10 17-23 * * 0'   # Sunday 1pm - 8pm ET
#    - cron: '*/10 0-4 * * 1'     # Sunday night into Monday ET
#    - cron: '*/10 0-4 * * 2'     # Monday Night Football
#    - cron: '*/10 0-4 * * 5'     # Thursday Night Football
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-scoring
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install 'yahoofantasy==1.4.9'
      - name: Restore Yahoo token
        env:
          YAHOO_TOKEN_B64: ${{ secrets.YAHOO_TOKEN_B64 }}
        run: |
          if [ -z "$YAHOO_TOKEN_B64" ]; then
            echo "::error::YAHOO_TOKEN_B64 secret is not set."; exit 1
          fi
          # The library reads .yahoofantasy from the CURRENT DIRECTORY, not
          # $HOME. Writing it to $HOME looks right and fails every
