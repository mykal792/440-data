name: Live scoring
# NO GITHUB SCHEDULE. This runs from cron-job.org, which POSTs to the
# workflow_dispatch API every 10 minutes from 9am to 1:59am ET.
#
# Why: GitHub's scheduled workflows are best-effort and get deprioritised under
# load. On opening night, Sept 9 2026, exactly one scheduled run fired in a
# four-hour window that should have produced twenty-four. An external trigger
# hits the dispatch endpoint directly and runs when it says it will.
#
# The cron-job.org job is called "440 live scoring" and authenticates with a
# fine-grained GitHub token scoped to this repo with Actions read/write.
# THAT TOKEN EXPIRES 2027-09-10 - when it does, the site silently stops
# updating and cron-job.org starts logging 401s.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-scoring
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install 'yahoofantasy==1.4.9'
      - name: Restore Yahoo token
        env:
          YAHOO_TOKEN_B64: ${{ secrets.YAHOO_TOKEN_B64 }}
        run: |
          if [ -z "$YAHOO_TOKEN_B64" ]; then
            echo "::error::YAHOO_TOKEN_B64 secret is not set."; exit 1
          fi
          echo "$YAHOO_TOKEN_B64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/.yahoofantasy"
      - name: Pull live scores, bonus race and top players
        # Writes docs/scoreboard.json, docs/bonus.json and docs/top-players.json.
        run: python pull_live.py
      - name: Pull DraftKings ticker
        run: python pull_dk.py
      - name: Pull Squid Game scores
        # Writes docs/squid-scores.json only. Tokens, eliminated and duel live
        # in the Wix collection and no script ever opens them.
        run: python pull_squid.py
      - name: Publish if changed
        # EVERY file the scripts write must be listed here. A file that is
        # written but not listed is generated on the runner and thrown away -
        # the board then shows preseason data while every other board is live,
        # and nothing anywhere reports an error. That is exactly what happened
        # to top-players.json on opening night.
        run: |
          FILES="docs/scoreboard.json docs/bonus.json docs/top-players.json docs/dk.json docs/squid-scores.json"
          if git diff --quiet -- $FILES; then
            echo "No change."; exit 0
          fi
          git config user.name  "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add $FILES
          git commit -m "Live update $(date -u +'%H:%M UTC')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          echo "::error::push failed after 3 attempts"; exit 1
