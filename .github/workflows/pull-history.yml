name: Pull league history

# Manual only. Pulls every season of the league from Yahoo (2026 back to the
# first season) into docs/history/: seasons.json, matchups.json, managers.json.
# These feed the player profiles.
#
# Run with dry_run = true first and read the log. It prints one line per
# season (games found, champion) and a list of every Yahoo account that ever
# had a team, with anyone it couldn't match to a current manager at the end.
#
# Read-only against Yahoo. Writes nothing outside docs/history/.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only, write nothing'
        type: boolean
        default: true
      since:
        description: 'Only pull seasons from this year on (blank = all seasons)'
        required: false
        default: ''

concurrency:
  group: live-scoring
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install 'yahoofantasy==1.4.9'
      - name: Restore Yahoo token
        env:
          YAHOO_TOKEN_B64: ${{ secrets.YAHOO_TOKEN_B64 }}
        run: |
          if [ -z "$YAHOO_TOKEN_B64" ]; then
            echo "::error::YAHOO_TOKEN_B64 secret is not set."; exit 1
          fi
          echo "$YAHOO_TOKEN_B64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/.yahoofantasy"
      - name: Pull history
        run: |
          ARGS=""
          if [ -n "${{ inputs.since }}" ]; then ARGS="$ARGS --since ${{ inputs.since }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python pull_history.py $ARGS
      - name: Commit
        if: ${{ inputs.dry_run == false }}
        run: |
          FILES="docs/history/seasons.json docs/history/matchups.json docs/history/managers.json"
          for f in $FILES; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "No change."; exit 0
          fi
          git config user.name  "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git commit -m "League history - $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
          done
          echo "::error::push failed after 3 attempts"; exit 1
